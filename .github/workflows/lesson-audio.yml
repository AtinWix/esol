name: Lesson audio
on:
  push:
    paths:
      - '**/audio/*/scripts.json'
      - '**/audio/*/*.mp3'
      - 'tools/make_lesson_audio.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency: lesson-audio
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts piper-tts
      - name: Make audio and pages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/make_lesson_audio.py
      - name: Save results
        if: always()
        run: |
          git config user.name "lesson-audio-bot"
          git config user.email "lesson-audio-bot@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet || (git commit -m "Lesson audio: make audio and pages" && git pull --rebase -q && git push)
