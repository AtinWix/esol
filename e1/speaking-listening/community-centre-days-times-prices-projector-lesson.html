<script>
const S=[{"tag": "learn", "title": "Today", "html": "<h2>What's on at Riverside Community Centre?</h2>\n<p class=\"lead\">Today we use <b>one timetable</b> all afternoon.</p>\n<ol class=\"flow\"><li><b>Read</b> the timetable</li><li><b>Ask</b> and answer</li><li><b>Listen</b> – exam Task 4</li><li><b>Partner A and B</b> – find the missing information</li><li><b>Find the mistake</b></li><li><b>Talk</b> – exam Task 2: My week</li><li><b>Kahoot</b></li></ol>", "note": "Say: 'Good afternoon. This afternoon we use one timetable – a community centre. A community centre is a building for local people. You can go to classes and clubs there. We read it, we listen, we talk. At the end you give a short talk, like in the exam.' Point to each step as you say it. Learners log in to their PCs now; they don't open anything yet.", "reveal": false, "timer": 0, "steps": null}, {"tag": "prac", "title": "The timetable – on your PC", "html": "<div class=\"split\"><div><h2>Open the activity: 1 Timetable</h2>\n<ol class=\"steps\"><li>Read the timetable.</li><li><b>A</b> – Yes or no? 10 sentences. Press <b>Check A</b>.</li><li><b>B</b> – Choose the answer. 6 questions. Press <b>Check B</b>.</li><li><b>C</b> – Ask your partner 3 more questions. Type them.</li></ol>\n<div class=\"ex\"><p>free = you don't pay · 50p = fifty p · £2.50 = two pounds fifty · half past 10 = ten thirty</p></div></div>\n<div class=\"side\"><figure class=\"qrbox\"><div class=\"qr\" data-url=\"https://atinwix.github.io/esol/e1/speaking-listening/community-centre-days-times-prices-interactive-practice.html#start\" data-size=\"170\"></div><figcaption>Activity – 1 Timetable</figcaption></figure><a class=\"linkbtn\" href=\"https://atinwix.github.io/esol/e1/speaking-listening/community-centre-days-times-prices-interactive-practice.html#start\" target=\"_blank\" rel=\"noopener\">Open the activity</a></div></div>", "note": "Say: 'Open the activity on your PC – click the link in Teams, or scan the code. Click 1 Timetable.' Check everyone has it. Then say the key words and the class repeats twice: 'free – you don't pay', 'fifty p', 'two pounds fifty', 'half past ten'. Drill the question for part C: 'What time does the English club start?' – class repeats twice (learners often say 'What time it starts'). Say: 'Read the timetable. Do A – yes or no – and press Check A. Then do B and press Check B. Then C: ask your partner three more questions and type them.' Walk round. 15 minutes. Fast learners: more questions in C, including 'What time does it finish?'", "reveal": false, "timer": 900, "steps": null}, {"tag": "prac", "title": "Check A: yes or no", "html": "<div class=\"split\"><div><h2>Check A: yes or no?</h2><div class=\"stepq\" id=\"stepq\"></div><div class=\"stepa rv\" id=\"stepa\"></div></div><div class=\"side\"><table class=\"t big\"><tr><th>Activity</th><th>Day</th><th>Starts</th><th>Finishes</th><th>Price</th></tr><tr><td><b>English club</b></td><td>Monday</td><td>10 o&#x27;clock</td><td>12 o&#x27;clock</td><td>free</td></tr><tr><td><b>Computer class</b></td><td>Tuesday</td><td>2 o&#x27;clock</td><td>4 o&#x27;clock</td><td>£2</td></tr><tr><td><b>Cooking class</b></td><td>Wednesday</td><td>11 o&#x27;clock</td><td>1 o&#x27;clock</td><td>£3</td></tr><tr><td><b>Football</b></td><td>Thursday</td><td>6 o&#x27;clock</td><td>8 o&#x27;clock</td><td>£1</td></tr><tr><td><b>Sewing class</b></td><td>Friday</td><td>half past 10</td><td>half past 12</td><td>£2.50</td></tr><tr><td><b>Family film</b></td><td>Saturday</td><td>3 o&#x27;clock</td><td>5 o&#x27;clock</td><td>50p</td></tr><tr><td><b>Café</b></td><td>Every day</td><td>9 o&#x27;clock</td><td>5 o&#x27;clock</td><td>tea 80p</td></tr></table></div></div>", "note": "Quick check, 3 minutes. Read each sentence. Ask 'Yes or no?' – learners call out. Press Show answer, then Next sentence. For a NO answer, ask one learner for the correct sentence first.", "reveal": true, "timer": 0, "steps": [{"q": "The computer class is on Tuesday.", "a": "Yes"}, {"q": "The English club costs two pounds.", "a": "No – No, it isn't. It's free."}, {"q": "Football starts at six o'clock.", "a": "Yes"}, {"q": "The cooking class is on Thursday.", "a": "No – No, it isn't. It's on Wednesday."}, {"q": "The family film is on Saturday.", "a": "Yes"}, {"q": "The sewing class finishes at half past twelve.", "a": "Yes"}, {"q": "A tea in the café is fifty p.", "a": "No – No, it isn't. It's eighty p."}, {"q": "The computer class finishes at three o'clock.", "a": "No – No, it doesn't. It finishes at four o'clock."}, {"q": "The café is open every day.", "a": "Yes"}, {"q": "Football costs one pound.", "a": "Yes"}]}, {"tag": "talk", "title": "Check B and C: questions", "html": "<div class=\"split\"><div><h2>Check B: questions and answers</h2><div class=\"stepq\" id=\"stepq\"></div><div class=\"stepa rv\" id=\"stepa\"></div>\n<p class=\"muted\">Then C: say one of your questions. Who can answer?</p></div><div class=\"side\"><table class=\"t big\"><tr><th>Activity</th><th>Day</th><th>Starts</th><th>Finishes</th><th>Price</th></tr><tr><td><b>English club</b></td><td>Monday</td><td>10 o&#x27;clock</td><td>12 o&#x27;clock</td><td>free</td></tr><tr><td><b>Computer class</b></td><td>Tuesday</td><td>2 o&#x27;clock</td><td>4 o&#x27;clock</td><td>£2</td></tr><tr><td><b>Cooking class</b></td><td>Wednesday</td><td>11 o&#x27;clock</td><td>1 o&#x27;clock</td><td>£3</td></tr><tr><td><b>Football</b></td><td>Thursday</td><td>6 o&#x27;clock</td><td>8 o&#x27;clock</td><td>£1</td></tr><tr><td><b>Sewing class</b></td><td>Friday</td><td>half past 10</td><td>half past 12</td><td>£2.50</td></tr><tr><td><b>Family film</b></td><td>Saturday</td><td>3 o&#x27;clock</td><td>5 o&#x27;clock</td><td>50p</td></tr><tr><td><b>Café</b></td><td>Every day</td><td>9 o&#x27;clock</td><td>5 o&#x27;clock</td><td>tea 80p</td></tr></table></div></div>", "note": "Read each question; a learner gives the answer; press Show answer, then Next sentence. Then C: ask 3–4 learners to read one of their own questions aloud; another learner answers from the timetable. Correct 'What time it starts' to 'What time does it start'. 5 minutes.", "reveal": true, "timer": 0, "steps": [{"q": "What day is the computer class?", "a": "It&#x27;s on Tuesday."}, {"q": "What time does the English club start?", "a": "It starts at ten o&#x27;clock."}, {"q": "How much is the cooking class?", "a": "It&#x27;s three pounds."}, {"q": "What day is football?", "a": "It&#x27;s on Thursday."}, {"q": "What time does the family film finish?", "a": "It finishes at five o&#x27;clock."}, {"q": "How much is the sewing class?", "a": "It&#x27;s two pounds fifty."}]}, {"tag": "learn", "title": "Exam Task 4 – Listening", "html": "<h2>Exam Task 4: listen and answer</h2>\n<div class=\"grid g3\"><div class=\"box\"><h3>1</h3><p class=\"big\">You listen to a message or a short conversation.</p></div>\n<div class=\"box\"><h3>2</h3><p class=\"big\">You hear it <b>two</b> times.</p></div>\n<div class=\"box\"><h3>3</h3><p class=\"big\">2 questions: one <b>yes / no</b>, one <b>day, time or price</b>.</p></div></div>\n<div class=\"ex\"><p>Is it on Monday? → <b>Yes, it is.</b> / <b>No, it isn't.</b></p><p>What time does it start? → <b>At seven o'clock.</b></p></div>", "note": "Say: 'Now we listen, like in the exam. In Task 4 you listen to a message or a short conversation. You listen two times. Then you answer two questions. One question is a yes-no question: say Yes, it is, or No, it isn't. One question asks for a day, a time or a price.' Class repeats 'Yes, it is' and 'No, it isn't' twice. Say: 'Open 2 Listening on your PC. Read the questions first. Then listen.'", "reveal": false, "timer": 0, "steps": null}, {"tag": "prac", "title": "Script A – on your PC", "html": "<h2>Script A: phone message</h2><p class=\"muted\">On your PC: <b>2 Listening → Script A</b>. Read the questions. Listen two times. Answer.</p><div class=\"player\" data-id=\"script-a\"><span class=\"slab\">Script A</span><button class=\"btn play\" type=\"button\" data-play=\"script-a\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div>\n<div class=\"grid g2\"><div class=\"box\"><h3>Question 1</h3><p class=\"big\">Is the yoga class on Wednesday?</p><p class=\"rv ans\">Yes, it is.</p></div>\n<div class=\"box\"><h3>Question 2</h3><p class=\"big\">What time does the yoga class start?</p><p class=\"rv ans\">Seven o&#x27;clock</p></div></div>\n<div class=\"rv\"><div class=\"ex\"><p><b>Ann:</b> Hello. This is Riverside Community Centre. We have a new yoga class. It is on Wednesday. It starts at seven o&#x27;clock. It costs three pounds. Thank you. Goodbye.</p></div></div>", "note": "Say: 'Look at Script A on your PC. Read question 1 and question 2.' Read both aloud. Press ▶ Play twice (it plays, pauses, then plays again). Learners choose Yes or No and type answer 2 on their PC (they press Check after Script F, not now). Then check here: ask question 1 and 'What time does the yoga class start?' – take answers from 3–4 learners. Press Show answer three times: answer 1, then answer 2, then the script. Read the script aloud with the class (you are Ann, the class is Ben for a conversation). If the audio doesn't play, read the script yourself at a normal speed, twice.", "reveal": true, "timer": 0, "steps": null}, {"tag": "prac", "title": "Script B – on your PC", "html": "<h2>Script B: conversation</h2><p class=\"muted\">On your PC: <b>2 Listening → Script B</b>. Read the questions. Listen two times. Answer.</p><div class=\"player\" data-id=\"script-b\"><span class=\"slab\">Script B</span><button class=\"btn play\" type=\"button\" data-play=\"script-b\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div>\n<div class=\"grid g2\"><div class=\"box\"><h3>Question 1</h3><p class=\"big\">Is the music class on Thursday?</p><p class=\"rv ans\">No, it isn&#x27;t. It&#x27;s on Friday.</p></div>\n<div class=\"box\"><h3>Question 2</h3><p class=\"big\">How much is the music class?</p><p class=\"rv ans\">Two pounds (£2)</p></div></div>\n<div class=\"rv\"><div class=\"ex\"><p><b>Ben:</b> Hello. Is there a music class?</p><p><b>Ann:</b> Yes, there is. It&#x27;s on Friday.</p><p><b>Ben:</b> What time does it start?</p><p><b>Ann:</b> It starts at four o&#x27;clock.</p><p><b>Ben:</b> How much is it?</p><p><b>Ann:</b> It&#x27;s two pounds.</p></div></div>", "note": "Say: 'Look at Script B on your PC. Read question 1 and question 2.' Read both aloud. Press ▶ Play twice (it plays, pauses, then plays again). Learners choose Yes or No and type answer 2 on their PC (they press Check after Script F, not now). Then check here: ask question 1 and 'How much is the music class?' – take answers from 3–4 learners. Press Show answer three times: answer 1, then answer 2, then the script. Read the script aloud with the class (you are Ann, the class is Ben for a conversation). If the audio doesn't play, read the script yourself at a normal speed, twice.", "reveal": true, "timer": 0, "steps": null}, {"tag": "prac", "title": "Scripts C to F – on your PC", "html": "<div class=\"split\"><div><h2>Listen and answer on your PC</h2>\n<p class=\"muted\">Open the activity → <b>2 Listening</b>. Read the questions. Listen two times. Type your answers.</p>\n<div class=\"grid g2\"><div class=\"box\"><div class=\"player\" data-id=\"script-c\"><span class=\"slab\">Script C</span><button class=\"btn play\" type=\"button\" data-play=\"script-c\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div></div><div class=\"box\"><div class=\"player\" data-id=\"script-d\"><span class=\"slab\">Script D</span><button class=\"btn play\" type=\"button\" data-play=\"script-d\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div></div><div class=\"box\"><div class=\"player\" data-id=\"script-e\"><span class=\"slab\">Script E</span><button class=\"btn play\" type=\"button\" data-play=\"script-e\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div></div><div class=\"box\"><div class=\"player\" data-id=\"script-f\"><span class=\"slab\">Script F</span><button class=\"btn play\" type=\"button\" data-play=\"script-f\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div></div></div><div class=\"stepq\" id=\"stepq\"></div><div class=\"stepa rv\" id=\"stepa\"></div></div>\n<div class=\"side\"><figure class=\"qrbox\"><div class=\"qr\" data-url=\"https://atinwix.github.io/esol/e1/speaking-listening/community-centre-days-times-prices-interactive-practice.html#listen\" data-size=\"170\"></div><figcaption>Activity – 2 Listening</figcaption></figure><a class=\"linkbtn\" href=\"https://atinwix.github.io/esol/e1/speaking-listening/community-centre-days-times-prices-interactive-practice.html#listen\" target=\"_blank\" rel=\"noopener\">Open the activity</a></div></div>", "note": "Say: 'You already have 2 Listening open. Look at Script C. Read the two questions.' Give 30 seconds. Press ▶ Play twice for Script C. Learners type both answers. Do the same for D, E and F – give 30 seconds to read before each one. Don't stop between scripts to check. When all four are done, say 'Press Check'. Then go through the answers here: press Show answer for each script, then Next. Ask 'Who has the same?' each time. If a script is difficult for many learners, play it once more.", "reveal": true, "timer": 0, "steps": [{"q": "Script C: 1 Is the art class on Monday? &nbsp; 2 How much is the art class?", "a": "1 Yes, it is. &nbsp; 2 One pound fifty (£1.50)"}, {"q": "Script D: 1 Is the library open on Sunday? &nbsp; 2 What time does the library close?", "a": "1 No, it isn't. &nbsp; 2 Six o'clock"}, {"q": "Script E: 1 Is the football match on Sunday? &nbsp; 2 What time does the match start?", "a": "1 No, it isn't. It's on Saturday. &nbsp; 2 Two o'clock"}, {"q": "Script F: 1 Is the dance class on Tuesday? &nbsp; 2 How much is the dance class?", "a": "1 Yes, it is. &nbsp; 2 It's free"}]}, {"tag": "prac", "title": "Read the scripts", "html": "<h2>Now read the scripts</h2><p class=\"lead\">On your PC: under each script, press <b>Read the script</b>. Choose the missing words. Then read it with your partner – one person is Ann, one person is Ben.</p>\n<div class=\"grid g3\"><div class=\"box\"><h3>Script A</h3><p class=\"rv ans\">Wednesday · seven o&#x27;clock · three pounds</p></div><div class=\"box\"><h3>Script B</h3><p class=\"rv ans\">Friday · four o&#x27;clock · two pounds</p></div><div class=\"box\"><h3>Script C</h3><p class=\"rv ans\">Monday · half past one · one pound fifty</p></div><div class=\"box\"><h3>Script D</h3><p class=\"rv ans\">Sunday · Saturday · six o&#x27;clock</p></div><div class=\"box\"><h3>Script E</h3><p class=\"rv ans\">Saturday · two o&#x27;clock · water</p></div><div class=\"box\"><h3>Script F</h3><p class=\"rv ans\">Tuesday · free · Thank you</p></div></div>", "note": "Say: 'Now press Read the script under each one. Choose the missing words. Then read the script with your partner. One person is Ann, one person is Ben. Then change.' Walk round; listen to the pronunciation of times and prices. 8 minutes. Press Show answer to check the missing words together.", "reveal": true, "timer": 480, "steps": null}, {"tag": "talk", "title": "Partner A and Partner B", "html": "<div class=\"split\"><div><h2>Find the missing information</h2>\n<p class=\"lead\">Partner A and Partner B have <b>different</b> information. Don't look at your partner's screen! Ask and answer. Type the answers.</p>\n<div class=\"ex\"><p><b>A:</b> What day is swimming?</p><p><b>B:</b> It's on Monday.</p><p><b>A:</b> What time does it start?</p><p><b>B:</b> It starts at seven o'clock.</p><p><b>A:</b> How much is it?</p><p><b>B:</b> Sorry, I don't know. – <i>Your turn!</i></p></div></div>\n<div class=\"side\"><figure class=\"qrbox\"><div class=\"qr\" data-url=\"https://atinwix.github.io/esol/e1/speaking-listening/community-centre-days-times-prices-interactive-practice.html#a\" data-size=\"140\"></div><figcaption>Partner A</figcaption></figure><figure class=\"qrbox\"><div class=\"qr\" data-url=\"https://atinwix.github.io/esol/e1/speaking-listening/community-centre-days-times-prices-interactive-practice.html#b\" data-size=\"140\"></div><figcaption>Partner B</figcaption></figure></div></div>", "note": "Put learners in pairs, next to each other. Say: 'Partner A, open the activity and click 3 Partner A. Partner B, click 3 Partner B. Don't look at your partner's screen! You have different information.' Read the example with a strong learner: you are A. Say: 'Ask your partner questions. Type the answers in the white boxes. When you finish, press Check.' Pairs work. 15–20 minutes. Walk round: listen for 'What time does … start?' and 'It's on …'. Fast pairs: tell them to ask 'What time does it finish?' and invent the answer. Then go to the next slide and check together.", "reveal": false, "timer": 900, "steps": null}, {"tag": "talk", "title": "Check: clubs and sports", "html": "<h2>Riverside Centre – Clubs and Sports</h2><table class=\"t\"><tr><th>Activity</th><th>Day</th><th>Time</th><th>Price</th></tr><tr><td><b>Swimming</b></td><td class=\"rv\">Monday</td><td class=\"rv\">7 o&#x27;clock</td><td class=\"rv\">£3</td></tr><tr><td><b>Chess club</b></td><td class=\"rv\">Tuesday</td><td class=\"rv\">5 o&#x27;clock</td><td class=\"rv\">free</td></tr><tr><td><b>Basketball</b></td><td class=\"rv\">Wednesday</td><td class=\"rv\">4 o&#x27;clock</td><td class=\"rv\">£1</td></tr><tr><td><b>Gardening club</b></td><td class=\"rv\">Thursday</td><td class=\"rv\">10 o&#x27;clock</td><td class=\"rv\">£2</td></tr><tr><td><b>Bingo</b></td><td class=\"rv\">Friday</td><td class=\"rv\">3 o&#x27;clock</td><td class=\"rv\">50p</td></tr><tr><td><b>Walking group</b></td><td class=\"rv\">Sunday</td><td class=\"rv\">9 o&#x27;clock</td><td class=\"rv\">free</td></tr></table>", "note": "Say: 'Let's check. What day is swimming?' Take answers for each row, asking different learners the three questions. Press Show answer once for each answer – they appear one at a time, row by row. Ask: 'Which club is free?' (Chess club and the walking group.) 'Which day is bingo?' (Friday.)", "reveal": true, "timer": 0, "steps": null}, {"tag": "prac", "title": "Find the mistake", "html": "<div class=\"split\"><div><h2>Find the mistake</h2><p class=\"muted\">On your PC: <b>4 Find the mistake</b>. Tap the wrong word. Then type the correct sentence.</p>\n<div class=\"stepq\" id=\"stepq\"></div><div class=\"stepa rv\" id=\"stepa\"></div></div><div class=\"side\"><figure class=\"qrbox\"><div class=\"qr\" data-url=\"https://atinwix.github.io/esol/e1/speaking-listening/community-centre-days-times-prices-interactive-practice.html#err\" data-size=\"170\"></div><figcaption>Activity – 4 Find the mistake</figcaption></figure></div></div>", "note": "Say: 'Open 4 Find the mistake. There is one mistake in each sentence. Tap the wrong word. Then type the correct sentence and press Check.' Learners work alone for 10 minutes; they can help each other. Then check here: read each sentence, ask 'What's the mistake?', take the correct sentence from a learner, press Show answer, then Next. Point out the rule each time (it is in brackets on the answer): he / she / it + s; I / we / they – no s; questions with does.", "reveal": true, "timer": 600, "steps": [{"q": "The computer class start at two o&#x27;clock.", "a": "The computer class starts at two o&#x27;clock. <span class=\"muted\">(he / she / it + s: starts)</span>"}, {"q": "Football are on Thursday.", "a": "Football is on Thursday. <span class=\"muted\">(one thing: is)</span>"}, {"q": "I goes to the English club on Monday.", "a": "I go to the English club on Monday. <span class=\"muted\">(I + go (no s))</span>"}, {"q": "The family film is in Saturday.", "a": "The family film is on Saturday. <span class=\"muted\">(days: on Saturday)</span>"}, {"q": "My friend like the cooking class.", "a": "My friend likes the cooking class. <span class=\"muted\">(he / she + s: likes)</span>"}, {"q": "The café open at nine o&#x27;clock.", "a": "The café opens at nine o&#x27;clock. <span class=\"muted\">(it + s: opens)</span>"}, {"q": "Is the sewing class on Friday? Yes, it are.", "a": "Is the sewing class on Friday? Yes, it is. <span class=\"muted\">(it is)</span>"}, {"q": "We doesn&#x27;t go to football on Sunday.", "a": "We don&#x27;t go to football on Sunday. <span class=\"muted\">(we + don&#x27;t)</span>"}, {"q": "The English club is free. It cost nothing.", "a": "The English club is free. It costs nothing. <span class=\"muted\">(it + s: costs)</span>"}, {"q": "What time it starts?", "a": "What time does it start? <span class=\"muted\">(questions: What time does it start?)</span>"}]}, {"tag": "learn", "title": "Word game", "html": "<h2>Hangman Paragraphs</h2><p class=\"lead\">Listen to the text two times. Then guess the words!</p>\n<div class=\"btnrow\"><button class=\"btn\" type=\"button\" id=\"hgRead\">▶ Read the text aloud</button><button class=\"btn ghost\" type=\"button\" id=\"hgCopy\">Copy the text</button><a class=\"linkbtn\" href=\"https://atinwix.github.io/Hangman-Paragraphs-Game/?p=Uml2ZXJzaWRlIENvbW11bml0eSBDZW50cmUgaXMgb3BlbiBldmVyeSBkYXkuIE9uIE1vbmRheSB0aGVyZSBpcyBhbiBFbmdsaXNoIGNsdWIsIGFuZCBpdCBpcyBmcmVlLiBUaGUgY29tcHV0ZXIgY2xhc3MgaXMgb24gVHVlc2RheSBhdCB0d28gbydjbG9jay4gSXQgY29zdHMgdHdvIHBvdW5kcy4gT24gVGh1cnNkYXkgZXZlbmluZyBwZW9wbGUgcGxheSBmb290YmFsbC4gVGhlIGNhZsOpIHNlbGxzIHRlYSBhbmQgY29mZmVlLCBhbmQgYSB0ZWEgaXMgZWlnaHR5IHAuIE1hbnkgcGVvcGxlIGdvIHRvIHRoZSBjZW50cmUgZXZlcnkgd2VlaywgYW5kIHRoZXkgbWFrZSBuZXcgZnJpZW5kcyB0aGVyZS4\" target=\"_blank\" rel=\"noopener\">Open the game</a><span id=\"hgMsg\" class=\"muted\"></span></div>", "note": "Short break from the screens. Say: 'Listen. I read a short text about the community centre – two times.' Press 'Read the text aloud' (or press Copy the text and paste it into NaturalReader). Then press Open the game – the text is already loaded. Learners call out letters and words. 8–10 minutes. The text is not shown on this slide on purpose.", "reveal": false, "timer": 0, "steps": null}, {"tag": "learn", "title": "Exam Task 2 – the short talk", "html": "<h2>Exam Task 2: a short talk</h2>\n<div class=\"grid g3\"><div class=\"box\"><h3>1</h3><p class=\"big\">You get a topic.</p></div><div class=\"box\"><h3>2</h3><p class=\"big\">You talk for about <b>1 minute</b>.</p></div><div class=\"box\"><h3>3</h3><p class=\"big\">Your partner asks you questions.</p></div></div>\n<p class=\"lead\">Today's topic: <b>My week</b>. Use the timetable!</p>", "note": "Say: 'Now we practise the talk – Task 2 in the exam. You get a topic. You talk for about one minute. Then your partner asks you questions. Today the topic is My week. You can use the community centre timetable – imagine you go there.' First we make one talk together.", "reveal": false, "timer": 0, "steps": null}, {"tag": "talk", "title": "Sara's talk – on your PC", "html": "<div class=\"split\"><div><h2>Sara's talk – on your PC</h2><p class=\"muted\">Open <b>5 My talk</b>. At the top: choose the missing words in Sara's talk. Press <b>Check</b>. Then we check together.</p><div class=\"stepq\" id=\"stepq\"></div><div class=\"stepa rv\" id=\"stepa\"></div></div><div class=\"side\"><table class=\"t big\"><tr><th>Activity</th><th>Day</th><th>Starts</th><th>Finishes</th><th>Price</th></tr><tr><td><b>English club</b></td><td>Monday</td><td>10 o&#x27;clock</td><td>12 o&#x27;clock</td><td>free</td></tr><tr><td><b>Computer class</b></td><td>Tuesday</td><td>2 o&#x27;clock</td><td>4 o&#x27;clock</td><td>£2</td></tr><tr><td><b>Cooking class</b></td><td>Wednesday</td><td>11 o&#x27;clock</td><td>1 o&#x27;clock</td><td>£3</td></tr><tr><td><b>Football</b></td><td>Thursday</td><td>6 o&#x27;clock</td><td>8 o&#x27;clock</td><td>£1</td></tr><tr><td><b>Sewing class</b></td><td>Friday</td><td>half past 10</td><td>half past 12</td><td>£2.50</td></tr><tr><td><b>Family film</b></td><td>Saturday</td><td>3 o&#x27;clock</td><td>5 o&#x27;clock</td><td>50p</td></tr><tr><td><b>Café</b></td><td>Every day</td><td>9 o&#x27;clock</td><td>5 o&#x27;clock</td><td>tea 80p</td></tr></table></div></div>", "note": "Say: 'This is Sara. She goes to the community centre. Open 5 My talk. At the top is Sara's talk. Choose the missing words – use the timetable – and press Check.' 4 minutes. Then check here: read each sentence, a learner gives the word, press Show answer, then Next sentence. For 'because', ask 'Why does she like it?'", "reveal": true, "timer": 0, "steps": [{"q": "On ____ I go to the English club.", "a": "Monday"}, {"q": "It starts at ____.", "a": "ten o&#x27;clock"}, {"q": "It is ____.", "a": "free"}, {"q": "On Wednesday I go to the ____.", "a": "cooking class"}, {"q": "It costs ____.", "a": "three pounds"}, {"q": "I like the cooking class ____ I learn new food.", "a": "because"}]}, {"tag": "talk", "title": "Sara's talk", "html": "<h2>My week – Sara</h2><div class=\"talk\"><p><span class=\"sec\">Start</span> Hello. My name is Sara. I want to talk about my week.</p><p><span class=\"sec\">Day 1</span> On Monday I go to the English club. It starts at ten o&#x27;clock. It is free.</p><p><span class=\"sec\">Day 2</span> On Wednesday I go to the cooking class. It starts at eleven o&#x27;clock. It costs three pounds.</p><p><span class=\"sec\">Like</span> I like the cooking class because I learn new food.</p><p><span class=\"sec\">Don&#x27;t like</span> I don&#x27;t like Monday mornings because I am tired.</p><p><span class=\"sec\">Finish</span> Thank you.</p></div><p class=\"muted\">Partner question: <b>How much is the cooking class?</b> → It&#39;s three pounds.</p>", "note": "Read Sara's talk aloud at normal speed. Then the class reads it together with you. Then say: 'Look at the parts: Start – Day 1 – Day 2 – I like – I don't like – Finish. Your talk has the same parts.' Ask: 'How much is the cooking class?' (It's three pounds.) 'What time does the English club start?' (Ten o'clock.) – these are partner questions.", "reveal": false, "timer": 0, "steps": null}, {"tag": "talk", "title": "Your talk", "html": "<div class=\"split\"><div><h2>Make your talk</h2><p class=\"lead\">On your PC: <b>5 My talk</b>. Choose two activities. Write the day, time and price. Say why you like it.</p>\n<div class=\"ex frame\"><p>Hello. My name is ____. I want to talk about my week.</p><p>On ____ I go to the ____. It starts at ____. It costs ____ / It is free.</p><p>On ____ I go to the ____. ...</p><p>I like the ____ because ____.</p><p>I don't like ____ because ____.</p><p>Thank you.</p></div></div><div class=\"side\"><figure class=\"qrbox\"><div class=\"qr\" data-url=\"https://atinwix.github.io/esol/e1/speaking-listening/community-centre-days-times-prices-interactive-practice.html#talk\" data-size=\"170\"></div><figcaption>Activity – 5 My talk</figcaption></figure></div></div>", "note": "Say: 'Now make your talk. Open 5 My talk. Choose two activities from the timetable. Type the day, the time and the price – the box goes green when it's right. Then write why you like it and what you don't like.' Walk round and help – this is the part that was hard last week, so work with weaker learners first, and sit a weaker learner next to a stronger one. 10–12 minutes. When the talk is ready, learners press 'Show my talk' and read it quietly twice.", "reveal": false, "timer": 720, "steps": null}, {"tag": "talk", "title": "Talk to your partner", "html": "<div class=\"split\"><div><h2>Give your talk – 1 minute</h2><ol class=\"steps\"><li>Partner 1 talks. Try not to read – look at your partner!</li><li>Partner 2 listens, then asks <b>2 questions</b>.</li><li>Change.</li></ol></div>\n<div class=\"side box\"><h3>Questions to ask</h3><ul class=\"l\"><li>What time does it start?</li><li>What time does it finish?</li><li>How much is it?</li><li>Who do you go with?</li><li>Do you like it?</li><li>How do you go there?</li></ul></div></div>", "note": "Say: 'Partner 1, give your talk. One minute. Look at your partner, not the screen – you can look down sometimes.' Start the 1-minute timer. Then say: 'Partner 2, ask two questions.' Point to the questions. Then change and start the timer again. Then change partners (move one seat) and do it again. Do 2–3 rounds – it gets easier each time.", "reveal": false, "timer": 60, "steps": null}, {"tag": "talk", "title": "Talks for the class", "html": "<h2>Who can give their talk to the class?</h2><p class=\"lead\">Listen. Then the class asks 2 questions.</p>\n<div class=\"grid g2\"><div class=\"box\"><h3>Listen for</h3><p class=\"big\">2 days · 2 times · 2 prices</p></div><div class=\"box\"><h3>Ask</h3><p class=\"big\">What time does it start? · How much is it?</p></div></div>", "note": "Ask 3–4 learners to come to the front and give their talk (1 minute each, timer on). After each one, two learners ask a question each. Praise one thing in each talk (e.g. 'Good – you said starts at'). Correct only one mistake per talk.", "reveal": false, "timer": 60, "steps": null}, {"tag": "prac", "title": "Kahoot", "html": "<h2>Kahoot quiz</h2><p class=\"lead\">20 questions on the timetable, the listening and today's grammar.</p><p class=\"muted\">Go to <b>kahoot.it</b> and type the game PIN.</p>", "note": "Open the Kahoot (Teacher Hub card: 'Kahoot – ready to play', or import the file 'Kahoot import file (20 Qs)'). Learners join on their PCs or phones at kahoot.it. After each question, say the correct answer as a full sentence (e.g. 'The computer class is on Tuesday').", "reveal": false, "timer": 0, "steps": null}, {"tag": "learn", "title": "Today we...", "html": "<h2>Today we...</h2><ul class=\"l big\"><li>read a timetable: <b>days, times, prices</b></li><li>asked: <b>What time does it start? How much is it?</b></li><li>listened like in exam Task 4</li><li>gave a 1-minute talk, like exam Task 2</li></ul>", "note": "Say: 'What did we do today?' Elicit the four points. Say: 'At home, practise your talk – say it to a friend or say it in the mirror. Next week we practise all four exam tasks.' Learners log off.", "reveal": false, "timer": 0, "steps": null}];
const AUD={"script-a": "Hello. This is Riverside Community Centre. We have a new yoga class. It is on Wednesday. It starts at seven o'clock. It costs three pounds. Thank you. Goodbye.", "script-b": "Hello. Is there a music class? Yes, there is. It's on Friday. What time does it start? It starts at four o'clock. How much is it? It's two pounds.", "script-c": "Hi Maria. It's Lina. The art class is on Monday. It starts at half past one. It costs one pound fifty. See you there. Bye.", "script-d": "Excuse me. Is the library open on Sunday? No, it isn't. It's open Monday to Saturday. What time does it close? It closes at six o'clock.", "script-e": "Hello, Ali. This is Joe. The football match is on Saturday. It starts at two o'clock. Bring some water. See you!", "script-f": "Hello. What day is the dance class? It's on Tuesday. And how much is it? It's free. Great. Thank you!"}, AUDL={"script-a": [["Ann", "Hello. This is Riverside Community Centre. We have a new yoga class. It is on Wednesday. It starts at seven o'clock. It costs three pounds. Thank you. Goodbye."]], "script-b": [["Ben", "Hello. Is there a music class?"], ["Ann", "Yes, there is. It's on Friday."], ["Ben", "What time does it start?"], ["Ann", "It starts at four o'clock."], ["Ben", "How much is it?"], ["Ann", "It's two pounds."]], "script-c": [["Ann", "Hi Maria. It's Lina. The art class is on Monday. It starts at half past one. It costs one pound fifty. See you there. Bye."]], "script-d": [["Ann", "Excuse me. Is the library open on Sunday?"], ["Ben", "No, it isn't. It's open Monday to Saturday."], ["Ann", "What time does it close?"], ["Ben", "It closes at six o'clock."]], "script-e": [["Ben", "Hello, Ali. This is Joe. The football match is on Saturday. It starts at two o'clock. Bring some water. See you!"]], "script-f": [["Ben", "Hello. What day is the dance class?"], ["Ann", "It's on Tuesday."], ["Ben", "And how much is it?"], ["Ann", "It's free."], ["Ben", "Great. Thank you!"]]}, HANG="Riverside Community Centre is open every day. On Monday there is an English club, and it is free. The computer class is on Tuesday at two o'clock. It costs two pounds. On Thursday evening people play football. The caf\u00e9 sells tea and coffee, and a tea is eighty p. Many people go to the centre every week, and they make new friends there.";
(function(){
const $=id=>document.getElementById(id);let i=0,left=0,tick=null,si=0;
const TAGS={learn:'Learn',prac:'Practise',talk:'Speak'};
function qrs(root){root.querySelectorAll('.qr[data-url]').forEach(q=>{if(q.dataset.done)return;q.dataset.done=1;const sz=+q.dataset.size||160;try{new QRCode(q,{text:q.dataset.url,width:sz,height:sz,correctLevel:QRCode.CorrectLevel.M});}catch(e){q.innerHTML='<a href="'+q.dataset.url+'">'+q.dataset.url+'</a>';}});}
function dots(){$('dots').innerHTML='';S.forEach((s,k)=>{const b=document.createElement('button');b.type='button';b.className='dot'+(k<i?' done':'')+(k===i?' now':'');b.setAttribute('aria-label','Step '+(k+1)+': '+s.title);b.onclick=()=>go(k);$('dots').appendChild(b);});}
function stop(){clearInterval(tick);tick=null;$('clock').classList.remove('run');}
function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0');}
function showStep(){const st=S[i].steps;if(!st)return;const s=st[si];$('stepq').innerHTML='<small>'+(si+1)+' of '+st.length+'</small>'+s.q;$('stepa').innerHTML=s.a;$('stepa').classList.add('off');$('show').textContent='Show answer';$('snext').disabled=si>=st.length-1;}
function go(k){stopAudio();i=Math.max(0,Math.min(S.length-1,k));const s=S[i];si=0;stop();
 $('h-tag').className='tag '+s.tag;$('h-tag').textContent=TAGS[s.tag];$('h-title').textContent=s.title;
 $('stage').innerHTML=s.html+(s.note?'<div class="tnote" id="tn" hidden><b>Teacher note:</b> '+s.note+'</div>':'');
 $('stage').querySelectorAll('.rv').forEach(e=>e.classList.add('off'));
 $('show').hidden=!s.reveal;$('show').textContent='Show answer';$('note').hidden=!s.note;$('snext').hidden=!s.steps;
 const t=s.timer||0;$('clock').hidden=!t;$('tbtn').hidden=!t;left=t;$('clock').textContent=fmt(t);$('clock').className='clock';$('tbtn').textContent='Start timer';
 $('back').disabled=i===0;$('next').disabled=i===S.length-1;dots();qrs($('stage'));wire();showStep();$('stage').parentElement.scrollTop=0;}
function reveal(){if(S[i].steps){const a=$('stepa');const off=a.classList.toggle('off');$('show').textContent=off?'Show answer':'Hide answer';return;}
 const r=[...$('stage').querySelectorAll('.rv.off')];if(!r.length){$('stage').querySelectorAll('.rv').forEach(e=>e.classList.add('off'));$('show').textContent='Show answer';return;}
 r[0].classList.remove('off');r[0].scrollIntoView({block:'nearest',behavior:'smooth'});$('show').textContent=r.length<=1?'Hide answers':'Show next answer';}
function timer(){if(tick){stop();$('tbtn').textContent='Start timer';return;}if(left<=0)left=S[i].timer;$('clock').classList.add('run');$('clock').classList.remove('end');$('tbtn').textContent='Pause';
 tick=setInterval(()=>{left--;$('clock').textContent=fmt(left);if(left<=0){stop();$('clock').classList.add('end');$('tbtn').textContent='Start timer';$('timeup').hidden=false;setTimeout(()=>$('timeup').hidden=true,2500);}},1000);}
/* audio: MP3 from the lesson audio page, or the browser's own voice if the MP3 isn't there */
let cur=null;
function voices(){const v=speechSynthesis.getVoices().filter(x=>/^en(-|_)GB/i.test(x.lang));const all=v.length?v:speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));
 const f=all.find(x=>/female|libby|sonia|maisie|hazel|kate|serena|susan/i.test(x.name))||all[0];const m=all.find(x=>/male|ryan|thomas|george|daniel|oliver/i.test(x.name)&&x!==f)||all[1]||all[0];return{Ann:f,Ben:m};}
function stopAudio(){if(cur){cur.stop();cur=null;}}
function makePlayer(id,btn,stat){let a=new Audio('audio/community-centre/'+id+'.mp3');let useTTS=false,round=0,paused=false,active=false,gapT=null,q=[],qi=0;
 a.addEventListener('error',()=>{useTTS=true;});
 function setBtn(){btn.textContent=active?(paused?'▶ Carry on':'⏸ Pause'):'▶ Play twice';}
 function done(){if(round===1){round=2;stat.textContent='Again in 3 seconds…';gapT=setTimeout(()=>{stat.textContent='Second time';playOnce();},3000);}else{active=false;round=0;stat.textContent='Finished';setBtn();}}
 function speakNext(){if(qi>=q.length){done();return;}const [w,t]=q[qi++];const u=new SpeechSynthesisUtterance(t);const v=voices();if(v[w])u.voice=v[w];u.lang='en-GB';u.rate=0.9;u.onend=()=>{if(active&&!paused)setTimeout(speakNext,350);};speechSynthesis.speak(u);}
 function playOnce(){if(useTTS||!a.src){q=AUDL[id];qi=0;speechSynthesis.cancel();speakNext();}else{a.currentTime=0;a.play().catch(()=>{useTTS=true;playOnce();});}}
 a.addEventListener('ended',()=>{if(active)done();});
 return{toggle(){if(!active){stopAudio();cur=this;active=true;paused=false;round=1;stat.textContent='First time';playOnce();setBtn();return;}
   if(paused){paused=false;if(useTTS){speechSynthesis.resume();if(!speechSynthesis.speaking)speakNext();}else a.play();}else{paused=true;clearTimeout(gapT);if(useTTS)speechSynthesis.pause();else a.pause();}setBtn();},
  stop(){active=false;paused=false;round=0;clearTimeout(gapT);a.pause();speechSynthesis.cancel();stat.textContent='';setBtn();}};}
function wire(){$('stage').querySelectorAll('[data-play]').forEach(b=>{const p=makePlayer(b.dataset.play,b,b.parentElement.querySelector('.pstat'));b.onclick=()=>p.toggle();});
 const r=$('hgRead');if(r){let on=false;r.onclick=()=>{if(on){speechSynthesis.cancel();on=false;r.textContent='▶ Read the text aloud';return;}stopAudio();on=true;r.textContent='⏹ Stop';let n=0;const say=()=>{const u=new SpeechSynthesisUtterance(HANG);const v=voices();if(v.Ann)u.voice=v.Ann;u.lang='en-GB';u.rate=0.85;u.onend=()=>{n++;if(on&&n<2)setTimeout(say,2500);else{on=false;r.textContent='▶ Read the text aloud';}};speechSynthesis.speak(u);};speechSynthesis.cancel();say();};
  $('hgCopy').onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(HANG):Promise.reject()).then(()=>$('hgMsg').textContent='Copied ✓',()=>$('hgMsg').textContent='Copy not allowed here – use the read-aloud page');};}}
$('next').onclick=()=>go(i+1);$('back').onclick=()=>go(i-1);$('show').onclick=reveal;$('tbtn').onclick=timer;
$('snext').onclick=()=>{const st=S[i].steps;if(st&&si<st.length-1){si++;showStep();}};
$('note').onclick=()=>{const n=$('tn');if(n)n.hidden=!n.hidden;};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,button'))return;if(e.key===' '||e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(i+1);}else if(e.key==='ArrowLeft'||e.key==='PageUp')go(i-1);else if(e.key==='t'||e.key==='T'){if(S[i].timer)timer();}else if(e.key==='a'||e.key==='A'){if(S[i].reveal)reveal();}});
if('speechSynthesis' in window)speechSynthesis.getVoices();
qrs(document.querySelector('header'));go(0);})();
