:root{
  --bg:#E9F1EE; --surface:#FFFFFF; --ink:#1D2B2A; --muted:#5A6B69;

@media (min-width:860px){

.q{

}
.n{font-weight:700; color:var(--tile); font-size:1.15rem; text-align:right}
.qt{font-weight:700}
.slot{
  grid-column:2; min-height:52px; border:2px dashed var(--line); border-radius:10px;
  display:flex; align-items:center; gap:8px; padding:4px;
  transition:background .15s, border-color .15s; cursor:pointer;
}
.slot:empty::before{content:"Put the answer here"; color:var(--muted); font-size:.9rem; padding-left:8px}
.slot.over, .slot.ready{border-color:var(--tile); background:var(--tile-soft)}
.slot.correct{border-style:solid; border-color:var(--apple); background:var(--apple-soft)}
.slot.wrong{border-style:solid; border-color:var(--tomato); background:var(--tomato-soft)}
.slot.correct::after{content:"✓"; color:var(--apple); font-weight:700; font-size:1.3rem; padding:0 8px}
.slot.wrong::after{content:"✗"; color:var(--tomato); font-weight:700; font-size:1.3rem; padding:0 8px}
.slot:focus-visible, .card:focus-visible{outline:3px solid var(--apple); outline-offset:2px}
.tray{background:var(--tile); border-radius:14px; padding:14px}
.tray h2{margin:0 0 10px; font-size:1.15rem; color:var(--surface)}
.pool{display:flex; flex-direction:column; gap:8px; min-height:56px; border-radius:10px; transition:background .15s}
.pool.over{background:rgba(255,255,255,.15)}
.pool:empty::before{content:"All the answers are in place."; color:var(--surface); padding:12px 4px}
.card{
  flex:1; background:var(--surface); color:var(--ink); border-radius:8px;
  padding:10px 14px; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;
  box-shadow:0 2px 0 rgba(0,0,0,.18);
}
.slot .card{box-shadow:none; border:1px solid var(--line)}
.card.selected{outline:3px solid var(--apple); outline-offset:2px}
.card.dragging{opacity:.3}
.ghost{position:fixed; left:0; top:0; z-index:1000; pointer-events:none; margin:0; transform:rotate(-1.5deg); box-shadow:0 10px 24px rgba(0,0,0,.28)}
.bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:18px}
button{font:inherit; font-weight:700; border-radius:999px; padding:10px 22px; cursor:pointer}
button:focus-visible{outline:3px solid var(--apple); outline-offset:2px}
.primary{background:var(--apple); color:var(--surface); border:2px solid var(--apple)}
.secondary{background:transparent; color:var(--tile); border:2px solid var(--tile)}
.status{font-weight:700; min-height:1.5em}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} .ghost{transform:none} }

<script>
const QUESTIONS = [
  ["What is on the wall?", "clock"],
  ["Who is cooking?", "cooking"],
  ["Is there a table in the kitchen?", "table"],
  ["Where is the food?", "food"],
  ["How many apples are there on the table?", "apples"],
  ["Is there a refrigerator in the kitchen?", "fridge"],
  ["What is between the woman and the cooker?", "between"],
  ["Where is the sun?", "sun"],
  ["What is on the chair?", "cat"],
  ["Are there windows in the kitchen?", "windows"],
  ["What is on the stove?", "pan"],
  ["Who is next to the fridge?", "woman"],
  ["Is there a cooker in the kitchen?", "cooker"]
];
const ANSWERS = {
  clock:"There is a clock on the wall.",
  cooking:"There is a woman cooking.",
  table:"There is a table in the kitchen.",
  food:"The food is on the table.",
  apples:"There are three green apples on the table.",
  fridge:"There is a refrigerator in the kitchen.",
  between:"The fridge is between the woman and the cooker.",
  sun:"The sun is in the sky.",
  cat:"There is a cat on the chair.",
  windows:"There are windows in the kitchen.",
  pan:"There is a pan on the stove.",
  woman:"There is a woman next to the fridge.",
  cooker:"There is a cooker in the kitchen."
};

const qBox = document.getElementById('questions');
const pool = document.getElementById('pool');
const statusEl = document.getElementById('status');
const retryBtn = document.getElementById('retry');
let selected = null;

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function mixedOrder(){
  const order = QUESTIONS.map(q=>q[1]);
  let a;
  for(let tries=0; tries<5000; tries++){
    a = shuffle(order.slice());
    let ok = true;
    for(let i=0;i<a.length && ok;i++){
      const qi = order.indexOf(a[i]);
      if(Math.abs(qi - i) < 2) ok = false;
      if(i>0 && Math.abs(order.indexOf(a[i-1]) - qi) === 1) ok = false;
    }
    if(ok) return a;
  }
  return a;
}
function build(){
  qBox.innerHTML = ''; pool.innerHTML = '';
  QUESTIONS.forEach(([text,key],i)=>{
    const q = document.createElement('div');
    q.className = 'q';
    q.innerHTML = `<span class="n">${i+1}</span><span class="qt">${text}</span>`;
    const slot = document.createElement('div');
    slot.className = 'slot'; slot.dataset.key = key; slot.tabIndex = 0;
    slot.setAttribute('aria-label', `Answer space for question ${i+1}`);
    q.appendChild(slot); qBox.appendChild(q);
  });
  mixedOrder().forEach(k=>{
    const c = document.createElement('div');
    c.className = 'card'; c.dataset.key = k; c.tabIndex = 0;
    c.setAttribute('role','button');
    c.textContent = ANSWERS[k];
    pool.appendChild(c);
  });
  selected = null; clearMarks(); statusEl.textContent = '';
}
function clearMarks(){
  document.querySelectorAll('.slot').forEach(s=>s.classList.remove('correct','wrong'));
  retryBtn.hidden = true;
}
function setSelected(card){
  if(selected) selected.classList.remove('selected');
  selected = card;
  document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('ready', !!card));
  if(card) card.classList.add('selected');
}
function place(card, target){
  clearMarks(); statusEl.textContent = '';
  if(target.classList.contains('slot')){
    const existing = target.querySelector('.card');
    if(existing === card){ setSelected(null); return; }
    if(existing){
      const from = card.parentElement;
      (from.classList.contains('slot') ? from : pool).appendChild(existing);
    }
    target.appendChild(card);
  } else {
    pool.appendChild(card);
  }
  setSelected(null);
}
let drag = null, ghost = null, hoverEl = null, scrollRAF = null, lastY = 0;
function targetAt(x,y){
  const el = document.elementFromPoint(x,y);
  if(!el) return null;
  return el.closest('.slot') || (el.closest('.tray') ? pool : null);
}
function setHover(t){
  if(hoverEl === t) return;
  if(hoverEl) hoverEl.classList.remove('over');
  hoverEl = t;
  if(hoverEl) hoverEl.classList.add('over');
}
function autoScroll(){
  const edge = 70, h = window.innerHeight;
  let dy = 0;
  if(lastY < edge) dy = -Math.ceil((edge-lastY)/5);
  else if(lastY > h-edge) dy = Math.ceil((lastY-(h-edge))/5);
  if(dy) window.scrollBy(0,dy);
  scrollRAF = requestAnimationFrame(autoScroll);
}
function endDrag(){
  if(ghost){ ghost.remove(); ghost = null; }
  if(drag && drag.card) drag.card.classList.remove('dragging');
  setHover(null);
  if(scrollRAF){ cancelAnimationFrame(scrollRAF); scrollRAF = null; }
  drag = null;
}
document.addEventListener('pointerdown', e=>{
  const card = e.target.closest('.card');
  if(!card || e.button > 0 || card.classList.contains('ghost')) return;
  drag = {card, x:e.clientX, y:e.clientY, id:e.pointerId, started:false};
});
window.addEventListener('pointermove', e=>{
  if(!drag || e.pointerId !== drag.id) return;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 6) return;
    const r = drag.card.getBoundingClientRect();
    drag.ox = drag.x - r.left; drag.oy = drag.y - r.top;
    ghost = drag.card.cloneNode(true);
    ghost.classList.add('ghost'); ghost.classList.remove('selected');
    ghost.style.width = r.width + 'px';
    document.body.appendChild(ghost);
    drag.card.classList.add('dragging');
    drag.started = true;
    setSelected(null);
    scrollRAF = requestAnimationFrame(autoScroll);
  }
  e.preventDefault();
  lastY = e.clientY;
  ghost.style.transform = `translate(${e.clientX-drag.ox}px, ${e.clientY-drag.oy}px) rotate(-1.5deg)`;
  setHover(targetAt(e.clientX, e.clientY));
}, {passive:false});
window.addEventListener('pointerup', e=>{
  if(!drag || e.pointerId !== drag.id) return;
  const card = drag.card;
  if(drag.started){
    const t = targetAt(e.clientX, e.clientY);
    endDrag();
    if(t) place(card, t);
  } else {
    endDrag();
    tapCard(card);
  }
});
window.addEventListener('pointercancel', endDrag);
function tapCard(card){
  if(selected && selected !== card && card.parentElement.classList.contains('slot')){
    place(selected, card.parentElement);
  } else {
    setSelected(selected === card ? null : card);
  }
}
qBox.addEventListener('click', e=>{
  const slot = e.target.closest('.slot');
  if(slot && selected && !e.target.closest('.card')) place(selected, slot);
});
pool.addEventListener('click', e=>{
  if(selected && !e.target.closest('.card') && selected.parentElement !== pool) place(selected, pool);
});
document.addEventListener('keydown', e=>{
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest && e.target.closest('.card');
  const slot = e.target.closest && e.target.closest('.slot');
  if(card){ e.preventDefault(); tapCard(card); }
  else if(slot && selected){ e.preventDefault(); place(selected, slot); }
});
document.getElementById('check').addEventListener('click', ()=>{
  let right = 0, placed = 0;
  document.querySelectorAll('.slot').forEach(s=>{
    s.classList.remove('correct','wrong');
    const c = s.querySelector('.card');
    if(!c) return;
    placed++;
    if(c.dataset.key === s.dataset.key){ s.classList.add('correct'); right++; }
    else s.classList.add('wrong');
  });
  const total = QUESTIONS.length;
  if(placed === 0){ statusEl.textContent = 'Put some answers in first.'; return; }
  if(right === total){ statusEl.textContent = 'All 13 are correct. Well done!'; }
  else {
    statusEl.textContent = `You have ${right} out of ${total} correct.` + (placed < total ? ` ${total-placed} still empty.` : '');
  }
  retryBtn.hidden = (placed === right);
});
retryBtn.addEventListener('click', ()=>{
  document.querySelectorAll('.slot.wrong .card').forEach(c=>pool.appendChild(c));
  clearMarks(); statusEl.textContent = '';
});
document.getElementById('reset').addEventListener('click', build);
build();
</script>
