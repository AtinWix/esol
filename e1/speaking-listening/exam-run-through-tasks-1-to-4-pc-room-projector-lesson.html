ty</a></div></div>", "note": "Say: “Open the activity. Click 2 Task 4. Read the two questions for Script E. I play it two times. First time: yes or no. Second time: one thing. Then answer on your PC and press Check.” Play Script E twice and wait. Do the same for Scripts F, G and H. After each script, press Show answer and use the Next button to see the next question. Read the answers aloud: E “No, she isn’t. Fish and rice.” F “Yes, he does. They cook together.” G “No, it isn’t. It’s on Sunday. Twelve o’clock.” H “Yes, it does. One pound twenty.” Audio tracks: Scripts E to H.", "timer": 900, "steps": [{"q": "Script E: Is Sara going to college? / What does she want to buy?", "a": "No, she isn’t. · Fish and rice"}, {"q": "Script F: Does the speaker live with a brother? / What do they do on Sunday?", "a": "Yes, he does. · They cook together"}, {"q": "Script G: Is the picnic on Saturday? / What time do they meet?", "a": "No, it isn’t. It’s on Sunday. · Twelve o’clock"}, {"q": "Script H: Does the shop have milk? / How much is the milk?", "a": "Yes, it does. · £1.20"}], "reveal": true}, {"tag": "learn", "title": "The full run-through", "html": "<h2>Tasks 1, 2, 3 and 4: one after another</h2><div class=\"grid g2\"><div class=\"box\"><h3>You are the candidate (A)</h3><p>Task 1: answer 4 questions.</p><p>Task 2: give a one-minute talk. Answer 2 questions.</p><p>Task 3: describe a picture.</p><p>Task 4: listen and answer.</p></div><div class=\"box\"><h3>Your partner is the assessor (B)</h3><p>Ask the Task 1 questions.</p><p>Listen to the talk. Ask 2 questions.</p><p>Ask: “What can you see?”</p><p>Ask the Task 4 questions after the audio.</p></div></div><p class=\"lead\">Use the <b>Exam card</b> on your PC: Activity → <b>3 Exam card</b>.</p>", "note": "Say: “Now the whole exam. Pairs. A is the candidate first. B is the assessor. Open 3 Exam card on your PC. It gives you your questions. For Task 1, B asks four questions. For Task 2, A gives a one-minute talk and B asks two questions. For Task 3, B shows a picture and asks: ‘What can you see?’ For Task 4, I play a text, B asks the two questions. Then you swap.” Check understanding: “Who asks the questions?” (The assessor.) “Who talks for one minute?” (The candidate.) “What do you do after the second listening?” (Answer.) Tell them there is no writing in this exercise.", "timer": 0, "steps": null, "reveal": false}, {"tag": "talk", "title": "Run-through 1", "html": "<div class=\"split\"><div><h2>Round 1: A is the candidate</h2><ol class=\"steps\"><li><b>Task 1</b> – The assessor asks 4 questions (3 minutes)</li><li><b>Task 2</b> – The candidate talks for 1 minute. The assessor asks 2 questions (5 minutes)</li><li><b>Task 3</b> – describe a picture (5 minutes)</li><li><b>Task 4</b> – listen to Script I. Answer aloud (6 minutes)</li></ol><div class=\"player\"><span class=\"slab\">Script I</span><button class=\"btn play\" type=\"button\" data-play=\"script-i\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div><div class=\"stepq\" id=\"stepq\"></div><div class=\"stepa rv\" id=\"stepa\"></div></div><div class=\"side\"><figure class=\"qrbox\"><div class=\"qr\" data-url=\"https://atinwix.github.io/esol/e1/speaking-listening/task1-task4-exam-run-through-interactive-practice.html#t3\" data-size=\"170\"></div><figcaption>Activity – 3 Exam card</figcaption></figure></div></div>", "note": "Say: “Round 1. A is the candidate. Open your Exam card. Start Task 1.” Start the timer for 22 minutes. Say after about 8 minutes: “Task 3 now.” Say after about 16 minutes: “Task 4. Listen to Script I.” While pairs work, walk round with a notebook and write one good sentence and one mistake you hear. Play the script twice. Say: “The assessor asks two questions. The candidate answers aloud.” Press Show answer and read the answers aloud: “No, it isn’t. The number twelve.” Then say: “Now swap roles for Round 2.”", "timer": 1320, "steps": [{"q": "Task 4, question 1: Is this the bus to the station?", "a": "No, it isn’t."}, {"q": "Task 4, question 2: Which bus goes to the station?", "a": "The number twelve."}], "reveal": true}, {"tag": "talk", "title": "Run-through 2", "html": "<div class=\"split\"><div><h2>Round 2: B is the candidate</h2><ol class=\"steps\"><li><b>Task 1</b> – The assessor asks 4 questions (3 minutes)</li><li><b>Task 2</b> – The candidate talks for 1 minute. The assessor asks 2 questions (5 minutes)</li><li><b>Task 3</b> – describe a picture (5 minutes)</li><li><b>Task 4</b> – listen to Script J. Answer aloud (6 minutes)</li></ol><div class=\"player\"><span class=\"slab\">Script J</span><button class=\"btn play\" type=\"button\" data-play=\"script-j\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div><div class=\"stepq\" id=\"stepq\"></div><div class=\"stepa rv\" id=\"stepa\"></div></div><div class=\"side\"><figure class=\"qrbox\"><div class=\"qr\" data-url=\"https://atinwix.github.io/esol/e1/speaking-listening/task1-task4-exam-run-through-interactive-practice.html#t3\" data-size=\"170\"></div><figcaption>Activity – 3 Exam card</figcaption></figure></div></div>", "note": "Say: “Round 2. Swap roles. B is the candidate now. Open your Exam card. Start Task 1.” Start the timer for 22 minutes. Say after about 8 minutes: “Task 3 now.” Say after about 16 minutes: “Task 4. Listen to Script J.” While pairs work, walk round with a notebook and write one good sentence and one mistake you hear. Play the script twice. Say: “The assessor asks two questions. The candidate answers aloud.” Press Show answer and read the answers aloud: “No, it isn’t. It’s Room eight. Ten o’clock.” Then say: “Well done. Stop.”", "timer": 1320, "steps": [{"q": "Task 4, question 1: Is the English class in Room six?", "a": "No, it isn’t. It’s Room eight."}, {"q": "Task 4, question 2: What time does it start?", "a": "Ten o’clock."}], "reveal": true}, {"tag": "learn", "title": "Feedback", "html": "<div class=\"split\"><div><h2>What is difficult?</h2><p cla const AUD={"script-a": "One. Your class is in Room 6. Two. What is the problem? Three. How much are the apples? Four. Dinner is ready. Five. Take this medicine. Six. Two kilos of rice, please. Seven. Open your books. Eight. Sit on the sofa.", "script-b": "Hello. Are you a new student? Yes, I am. My name is Hana. Welcome, Hana. Your class is in Room 6. Thank you. Is it upstairs? Yes, it is.", "script-c": "Good morning. What is the problem? I have a bad cough. Take this medicine two times a day. Thank you, doctor.", "script-d": "Number one. K, H, A, N. Khan. Number two. G, R, A, C, E. Grace. Number three. My phone number is oh seven seven double oh, nine double oh, four six one.", "script-e": "Hi Sara. Where are you going? I'm going to the market. What do you want to buy? Fish and rice.", "script-f": "I live in a small flat. I live with my brother. He is a bus driver. On Sunday we cook together. I like Sunday.", "script-g": "Hello, Sam. This is Anna. The picnic is on Sunday. We meet at the park at twelve o'clock. Bring some food and a drink. See you there!", "script-h": "Excuse me. Do you have milk? Yes, we do. It's by the door. How much is it? It's one pound twenty. Thank you.", "script-i": "Excuse me. Is this the bus to the station? No, it isn't. This is the bus to the market. Which bus goes to the station? The number twelve. Thank you.", "script-j": "Hello, this is Hackney College. Your English class is in Room eight. It starts at ten o'clock. Please bring a pen. Thank you."}, AUDL={"script-a": [["Ann", "One. Your class is in Room 6."], ["Ben", "Two. What is the problem?"], ["Ann", "Three. How much are the apples?"], ["Ben", "Four. Dinner is ready."], ["Ann", "Five. Take this medicine."], ["Ben", "Six. Two kilos of rice, please."], ["Ann", "Seven. Open your books."], ["Ben", "Eight. Sit on the sofa."]], "script-b": [["Ann", "Hello. Are you a new student?"], ["Ben", "Yes, I am. My name is Hana."], ["Ann", "Welcome, Hana. Your class is in Room 6."], ["Ben", "Thank you. Is it upstairs?"], ["Ann", "Yes, it is."]], "script-c": [["Ann", "Good morning. What is the problem?"], ["Ben", "I have a bad cough."], ["Ann", "Take this medicine two times a day."], ["Ben", "Thank you, doctor."]], "script-d": [["Ann", "Number one. K, H, A, N. Khan."], ["Ann", "Number two. G, R, A, C, E. Grace."], ["Ann", "Number three. My phone number is oh seven seven double oh, nine double oh, four six one."]], "script-e": [["Ben", "Hi Sara. Where are you going?"], ["Ann", "I'm going to the market."], ["Ben", "What do you want to buy?"], ["Ann", "Fish and rice."]], "script-f": [["Ben", "I live in a small flat. I live with my brother. He is a bus driver. On Sunday we cook together. I like Sunday."]], "script-g": [["Ann", "Hello, Sam. This is Anna. The picnic is on Sunday. We meet at the park at twelve o'clock. Bring some food and a drink. See you there!"]], "script-h": [["Ben", "Excuse me. Do you have milk?"], ["Ann", "Yes, we do. It's by the door."], ["Ben", "How much is it?"], ["Ann", "It's one pound twenty."], ["Ben", "Thank you."]], "script-i": [["Ben", "Excuse me. Is this the bus to the station?"], ["Ann", "No, it isn't. This is the bus to the market."], ["Ben", "Which bus goes to the station?"], ["Ann", "The number twelve."], ["Ben", "Thank you."]], "script-j": [["Ann", "Hello, this is Hackney College. Your English class is in Room eight. It starts at ten o'clock. Please bring a pen. Thank you."]]}, HANG="";
(function(){
const $=id=>document.getElementById(id);
function wireOrder(){$('stage').querySelectorAll('.ord').forEach(d=>{if(d.dataset.on)return;d.dataset.on=1;const ws=d.dataset.words.split('|'),ans=d.dataset.ans;let sel=[];const sh=ws.slice().sort(()=>Math.random()-.5);
 d.innerHTML='<div class="ol"></div><div class="ow"></div><div class="oa"><button class="chk" type="button">Check</button><button class="rs" type="button">Again</button></div><div class="ores"></div>';
 const ol=d.querySelector('.ol'),ow=d.querySelector('.ow'),or=d.querySelector('.ores');
 sh.forEach(w=>{const b=document.createElement('button');b.type='button';b.textContent=w;b.onclick=()=>{sel.push(w);b.disabled=true;ol.textContent=sel.join(' ');or.textContent='';};ow.appendChild(b);});
 d.querySelector('.chk').onclick=()=>{const g=sel.join(' ').toLowerCase().replace(/[?.]/g,'');const t=ans.toLowerCase().replace(/[?.]/g,'');if(sel.length<ws.length){or.className='ores no';or.textContent='Use all the words.';}else if(g===t){or.className='ores ok';or.textContent='✓ '+ans;}else{or.className='ores no';or.textContent='Not yet.';}};
 d.querySelector('.rs').onclick=()=>{sel=[];ol.textContent='';or.textContent='';ow.querySelectorAll('button').forEach(b=>b.disabled=false);};});}
let i=0,left=0,tick=null,si=0;
const TAGS={learn:'Learn',prac:'Practise',talk:'Speak'};
function qrs(root){root.querySelectorAll('.qr[data-url]').forEach(q=>{if(q.dataset.done)return;q.dataset.done=1;const sz=+q.dataset.size||160;try{new QRCode(q,{text:q.dataset.url,width:sz,height:sz,correctLevel:QRCode.CorrectLevel.M});}catch(e){q.innerHTML='<a href="'+q.dataset.url+'">'+q.dataset.url+'</a>';}});}
function dots(){$('dots').innerHTML='';S.forEach((s,k)=>{const b=document.createElement('button');b.type='button';b.className='dot'+(k<i?' done':'')+(k===i?' now':'');b.setAttribute('aria-label','Step '+(k+1)+': '+s.title);b.onclick=()=>go(k);$('dots').appendChild(b);});}
function stop(){clearInterval(tick);tick=null;$('clock').classList.remove('run');}
function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0');}
function showStep(){const st=S[i].steps;if(!st)return;const s=st[si];$('stepq').innerHTML='<small>'+(si+1)+' of '+st.length+'</small>'+s.q;$('stepa').innerHTML=s.a;$('stepa').classList.add('off');$('show').textContent='Show answer';$('snext').disabled=si>=st.length-1;}
function go(k){stopAudio();i=Math.max(0,Math.min(S.length-1,k));const s=S[i];si=0;stop();
 $('h-tag').className='tag '+s.tag;$('h-tag').textContent=TAGS[s.tag];$('h-title').textContent=s.title;
 $('stage').innerHTML=s.html+(s.note?'<div class="tnote" id="tn" hidden><b>Teacher note:</b> '+s.note+'</div>':'');
 $('stage').querySelectorAll('.rv').forEach(e=>e.classList.add('off'));
 $('show').hidden=!s.reveal;$('show').textContent='Show answer';$('note').hidden=!s.note;$('snext').hidden=!s.steps;
 const t=s.timer||0;$('clock').hidden=!t;$('tbtn').hidden=!t;left=t;$('clock').textContent=fmt(t);$('clock').className='clock';$('tbtn').textContent='Start timer';
 $('back').disabled=i===0;$('next').disabled=i===S.length-1;dots();qrs($('stage'));wire();showStep();$('stage').parentElement.scrollTop=0;}
function reveal(){if(S[i].steps){const a=$('stepa');const off=a.classList.toggle('off');$('show').textContent=off?'Show answer':'Hide answer';return;}
 const r=[...$('stage').querySelectorAll('.rv.off')];if(!r.length){$('stage').querySelectorAll('.rv').forEach(e=>e.classList.add('off'));$('show').textContent='Show answer';return;}
 r[0].classList.remove('off');r[0].scrollIntoView({block:'nearest',behavior:'smooth'});$('show').textContent=r.length<=1?'Hide answers':'Show next answer';}
function timer(){if(tick){stop();$('tbtn').textContent='Start timer';return;}if(left<=0)left=S[i].timer;$('clock').classList.add('run');$('clock').classList.remove('end');$('tbtn').textContent='Pause';
 tick=setInterval(()=>{left--;$('clock').textContent=fmt(left);if(left<=0){stop();$('clock').classList.add('end');$('tbtn').textContent='Start timer';$('timeup').hidden=false;setTimeout(()=>$('timeup').hidden=true,2500);}},1000);}
/* audio: MP3 from the lesson audio page, or the browser's own voice if the MP3 isn't there */
let cur=null;
function voices(){const v=speechSynthesis.getVoices().filter(x=>/^en(-|_)GB/i.test(x.lang));const all=v.length?v:speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));
 const f=all.find(x=>/female|libby|sonia|maisie|hazel|kate|serena|susan/i.test(x.name))||all[0];const m=all.find(x=>/male|ryan|thomas|george|daniel|oliver/i.test(x.name)&&x!==f)||all[1]||all[0];return{Ann:f,Ben:m};}
function stopAudio(){if(cur){cur.stop();cur=null;}}
function makePlayer(id,btn,stat){let a=new Audio('audio/short-conversations/'+id+'.mp3');let useTTS=false,round=0,paused=false,active=false,gapT=null,q=[],qi=0;
 a.addEventListener('error',()=>{useTTS=true;});
 function setBtn(){btn.textContent=active?(paused?'▶ Carry on':'⏸ Pause'):'▶ Play twice';}
 function done(){if(round===1){round=2;stat.textContent='Again in 3 seconds…';gapT=setTimeout(()=>{stat.textContent='Second time';playOnce();},3000);}else{active=false;round=0;stat.textContent='Finished';setBtn();}}
 function speakNext(){if(qi>=q.length){done();return;}const [w,t]=q[qi++];const u=new SpeechSynthesisUtterance(t);const v=voices();if(v[w])u.voice=v[w];u.lang='en-GB';u.rate=0.9;u.onend=()=>{if(active&&!paused)setTimeout(speakNext,350);};speechSynthesis.speak(u);}
 function playOnce(){if(useTTS||!a.src){q=AUDL[id];qi=0;speechSynthesis.cancel();speakNext();}else{a.currentTime=0;a.play().catch(()=>{useTTS=true;playOnce();});}}
 a.addEventListener('ended',()=>{if(active)done();});
 return{toggle(){if(!active){stopAudio();cur=this;active=true;paused=false;round=1;stat.textContent='First time';playOnce();setBtn();return;}
   if(paused){paused=false;if(useTTS){speechSynthesis.resume();if(!speechSynthesis.speaking)speakNext();}else a.play();}else{paused=true;clearTimeout(gapT);if(useTTS)speechSynthesis.pause();else a.pause();}setBtn();},
  stop(){active=false;paused=false;round=0;clearTimeout(gapT);a.pause();speechSynthesis.cancel();stat.textContent='';setBtn();}};}
function wire(){wireOrder();$('stage').querySelectorAll('[data-play]').forEach(b=>{const p=makePlayer(b.dataset.play,b,b.parentElement.querySelector('.pstat'));b.onclick=()=>p.toggle();});
 const r=$('hgRead');if(r){let on=false;r.onclick=()=>{if(on){speechSynthesis.cancel();on=false;r.textContent='▶ Read the text aloud';return;}stopAudio();on=true;r.textContent='⏹ Stop';let n=0;const say=()=>{const u=new SpeechSynthesisUtterance(HANG);const v=voices();if(v.Ann)u.voice=v.Ann;u.lang='en-GB';u.rate=0.85;u.onend=()=>{n++;if(on&&n<2)setTimeout(say,2500);else{on=false;r.textContent='▶ Read the text aloud';}};speechSynthesis.speak(u);};speechSynthesis.cancel();say();};
  $('hgCopy').onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(HANG):Promise.reject()).then(()=>$('hgMsg').textContent='Copied ✓',()=>$('hgMsg').textContent='Copy not allowed here – use the read-aloud page');};}}
$('next').onclick=()=>go(i+1);$('back').onclick=()=>go(i-1);$('show').onclick=reveal;$('tbtn').onclick=timer;
$('snext').onclick=()=>{const st=S[i].steps;if(st&&si<st.length-1){si++;showStep();}};
$('note').onclick=()=>{const n=$('tn');if(n)n.hidden=!n.hidden;};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,button'))return;if(e.key===' '||e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(i+1);}else if(e.key==='ArrowLeft'||e.key==='PageUp')go(i-1);else if(e.key==='t'||e.key==='T'){if(S[i].timer)timer();}else if(e.key==='a'||e.key==='A'){if(S[i].reveal)reveal();}});
if('speechSynthesis' in window)speechSynthesis.getVoices();
qrs(document.querySelector('header'));go(0);})();
</script>
