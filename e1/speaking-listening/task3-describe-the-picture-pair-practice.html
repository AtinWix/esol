<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>E1 Speaking – Task 3 Describe the Picture – Pair Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;700&display=swap">
<style>
/* Layout: widescreen = picture left (big), task panel right; phone = stacked. Text starts large and shrinks to fit one screen. */
:root{
  --bg:#f3f5f8; --card:#ffffff; --fg:#17202e; --muted:#5b6678; --line:#d7dde6;
  --ink:#1f4fa3; --ink-soft:#e5ecf9; --good:#1d7a46; --good-bg:#e3f4ea; --bad:#b3261e; --bad-bg:#fbe7e5;
  --exam:#6a4bb5; --exam-soft:#efe9fb; --warm:#9a5b00; --warm-bg:#fff3dc;
  --display:"Lexend", "Atkinson Hyperlegible", Arial, sans-serif;
  --body:"Atkinson Hyperlegible", Verdana, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161f; --card:#1a212d; --fg:#e8edf5; --muted:#9aa6b8; --line:#2e3848;
  --ink:#8db2ff; --ink-soft:#22304a; --good:#6fd39b; --good-bg:#16362a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --exam:#c3a9ff; --exam-soft:#2b2343; --warm:#ffc46b; --warm-bg:#3a2c12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161f; --card:#1a212d; --fg:#e8edf5; --muted:#9aa6b8; --line:#2e3848;
  --ink:#8db2ff; --ink-soft:#22304a; --good:#6fd39b; --good-bg:#16362a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --exam:#c3a9ff; --exam-soft:#2b2343; --warm:#ffc46b; --warm-bg:#3a2c12; color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.45}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:16px 32px;display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;color:var(--ink)}
.topr{display:flex;align-items:center;gap:10px}
.fs,.home{font:inherit;font-family:var(--display);font-weight:600;font-size:.8em;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sec{font-size:.78em;text-transform:uppercase;letter-spacing:.08em;color:var(--ink);font-weight:700}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:2em} h2{font-size:1.35em;font-weight:600} h3{font-size:1.05em;font-weight:600}
p{margin:0}
.btn{font:inherit;font-family:var(--display);font-weight:600;font-size:1em;padding:.6em 1em;border-radius:10px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--card)}
.btn:focus-visible,.fs:focus-visible,.home:focus-visible,.choice:focus-visible,.tick:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{color:var(--muted);font-size:.9em}
/* start screen */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.choice{font:inherit;text-align:left;display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.choice:hover{border-color:var(--ink)}
.choice b{font-family:var(--display);font-size:1.2em;color:var(--ink)}
.choice span{color:var(--muted)}
.scenes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.scenes button{font:inherit;text-align:left;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--ink-soft);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.scenes button[aria-pressed="true"]{border-color:var(--ink)}
.scenes svg{width:100%;height:auto;border-radius:6px;display:block}
.scenes b{font-family:var(--display);color:var(--ink)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.roles button{font:inherit;font-family:var(--display);font-weight:700;font-size:1.4em;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.roles button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink-soft);color:var(--ink)}
/* activity screen */
.act{display:flex;flex-direction:column;gap:14px}
.pic{border-radius:10px;overflow:hidden;border:1px solid var(--line);line-height:0;background:var(--ink-soft)}
.pic svg{width:100%;height:auto;display:block}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.rolebar{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;background:var(--exam-soft)}
.rolebar p{display:flex;gap:.5em;align-items:baseline}
.tag{flex:none;display:inline-block;font-family:var(--display);font-weight:700;font-size:.8em;padding:1px 9px;border-radius:999px}
.tag.a{background:var(--exam);color:var(--card)}
.tag.b{background:var(--ink);color:var(--card)}
.qs{margin:0;padding-left:1.5em;display:flex;flex-direction:column;gap:4px;font-size:1.1em}
.qs li::marker{font-family:var(--display);font-weight:700;color:var(--exam)}
.help{border-radius:10px;padding:10px 12px;background:var(--warm-bg);border:1px solid var(--warm)}
.help ul{margin:4px 0 0;padding-left:1.2em}
.timer{font-family:var(--display);font-weight:700;font-size:1.6em;font-variant-numeric:tabular-nums;color:var(--ink);min-width:3.2em}
.timer.done{color:var(--bad)}
.model{border-radius:10px;padding:10px 12px;background:var(--ink-soft);border:1px solid var(--ink)}
.diffs{display:flex;flex-direction:column;gap:6px}
.drow{display:flex;gap:8px;align-items:center}
.tick{flex:none;width:1.6em;height:1.6em;border-radius:6px;border:2px solid var(--ink);background:var(--card);color:var(--good);font-weight:700;cursor:pointer;display:grid;place-items:center;font:inherit;line-height:1}
.tick[aria-pressed="true"]{background:var(--good-bg);border-color:var(--good)}
.drow input{flex:1;min-width:0;font:inherit;padding:.35em .6em;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.drow input:focus{outline:3px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
.answers{border-radius:10px;padding:10px 12px;background:var(--good-bg);border:1px solid var(--good)}
.answers ol{margin:4px 0 0;padding-left:1.4em}
.both{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.both figure{margin:0;display:flex;flex-direction:column;gap:4px}
.both figcaption{font-family:var(--display);font-weight:700;color:var(--ink)}
.warn{font-family:var(--display);font-weight:600;color:var(--bad)}
@media (min-width:1000px){
  .wrap{max-width:none;padding-inline:clamp(16px,2vw,40px);padding-block:12px 16px;gap:10px}
  .card{padding:clamp(16px,1.6vw,32px)}
  .act{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(20px,2.5vw,48px);align-items:start}
  .pic svg{max-height:calc(100vh - 9em)}
  .both svg{max-height:calc(50vh)}
}
@media (max-width:480px){h1{font-size:1.6em}.card{padding:16px 12px}.roles button{font-size:1.2em}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand" id="brand">Entry 1 · Describe the picture · Pairs</div>
    <div class="topr"><button type="button" class="home" id="home" hidden>⌂ Start</button><button type="button" class="fs" id="fs" hidden>⛶ Full screen</button></div>
  </div>
  <main class="card" id="card" aria-live="polite"></main>
</div>

<script>
/* ---------- drawing helpers ---------- */
function person(o){
  const s=(o.h||110)/110, x=o.x, y=o.y, skin=o.skin||"#c68642", shirt=o.shirt||"#3a6fd8", legs=o.legs||"#2d3a5a", hair=o.hair||"#222";
  const sh=y-82*s, L=[];
  L.push(`<line x1="${x-6*s}" y1="${y-50*s}" x2="${x-8*s}" y2="${y}" stroke="${legs}" stroke-width="${7*s}" stroke-linecap="round"/>`);
  L.push(`<line x1="${x+6*s}" y1="${y-50*s}" x2="${x+8*s}" y2="${y}" stroke="${legs}" stroke-width="${7*s}" stroke-linecap="round"/>`);
  if(o.skirt) L.push(`<polygon points="${x-12*s},${y-54*s} ${x+12*s},${y-54*s} ${x+20*s},${y-28*s} ${x-20*s},${y-28*s}" fill="${o.skirt}"/>`);
  if(o.longHair) L.push(`<rect x="${x-13*s}" y="${y-110*s}" width="${26*s}" height="${32*s}" rx="${10*s}" fill="${hair}"/>`);
  L.push(`<rect x="${x-12*s}" y="${y-88*s}" width="${24*s}" height="${40*s}" rx="${8*s}" fill="${shirt}"/>`);
  const arm=(x1,x2,y2)=>`<line x1="${x1}" y1="${sh}" x2="${x2}" y2="${y2}" stroke="${shirt}" stroke-width="${7*s}" stroke-linecap="round"/><circle cx="${x2}" cy="${y2}" r="${4*s}" fill="${skin}"/>`;
  const la=o.left||"down", ra=o.right||"down";
  L.push(la==="up"?arm(x-10*s,x-20*s,y-112*s):la==="forward"?arm(x-10*s,x-30*s,y-70*s):arm(x-10*s,x-17*s,y-54*s));
  L.push(ra==="up"?arm(x+10*s,x+22*s,y-112*s):ra==="forward"?arm(x+10*s,x+30*s,y-70*s):arm(x+10*s,x+17*s,y-54*s));
  L.push(`<rect x="${x-3*s}" y="${y-94*s}" width="${6*s}" height="${8*s}" fill="${skin}"/>`);
  L.push(`<circle cx="${x}" cy="${y-102*s}" r="${11*s}" fill="${skin}"/>`);
  L.push(`<path d="M${x-11*s},${y-102*s} a${11*s},${11*s} 0 0 1 ${22*s},0 q${-11*s},${-5*s} ${-22*s},0z" fill="${hair}"/>`);
  L.push(`<circle cx="${x-4*s}" cy="${y-102*s}" r="${1.4*s}" fill="#222"/><circle cx="${x+4*s}" cy="${y-102*s}" r="${1.4*s}" fill="#222"/>`);
  L.push(`<path d="M${x-4*s},${y-97*s} q${4*s},${3*s} ${8*s},0" stroke="#222" stroke-width="${1.2*s}" fill="none"/>`);
  return L.join("");
}
function seated(x,y,shirt,skin,hair,longHair){
  return `${longHair?`<rect x="${x-13}" y="${y-58}" width="26" height="30" rx="10" fill="${hair}"/>`:""}
  <rect x="${x-12}" y="${y-36}" width="24" height="36" rx="8" fill="${shirt}"/>
  <circle cx="${x}" cy="${y-48}" r="11" fill="${skin}"/>
  <path d="M${x-11},${y-48} a11,11 0 0 1 22,0 q-11,-5 -22,0z" fill="${hair}"/>
  <circle cx="${x-4}" cy="${y-48}" r="1.4" fill="#222"/><circle cx="${x+4}" cy="${y-48}" r="1.4" fill="#222"/>`;
}
const svg=(inner,label)=>`<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label}">${inner}</svg>`;
const cloud=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="22" ry="11" fill="#e8edf2"/><ellipse cx="${x-12}" cy="${y+4}" rx="14" ry="9" fill="#e8edf2"/><ellipse cx="${x+13}" cy="${y+4}" rx="14" ry="9" fill="#e8edf2"/>`;

/* ---------- scenes: draw(b) — b=false is Student A's picture, b=true is Student B's ---------- */
const SCENES=[
 {id:"kitchen", title:"In the kitchen",

  draw:b=>svg(`

   ${b?"":`<circle cx="286" cy="157" r="8" fill="#6abf3a"/>`}
   <rect x="352" y="160" width="6" height="76" fill="#7a4b2a"/><rect x="352" y="196" width="40" height="7" fill="#7a4b2a"/><rect x="386" y="196" width="6" height="40" fill="#7a4b2a"/>
   ${(c=>`<ellipse cx="372" cy="186" rx="13" ry="11" fill="${c}"/><circle cx="372" cy="170" r="8" fill="${c}"/><polygon points="365,165 367,156 371,163" fill="${c}"/><polygon points="379,165 377,156 373,163" fill="${c}"/><circle cx="369" cy="170" r="1.5" fill="#1b1b1b"/><circle cx="375" cy="170" r="1.5" fill="#1b1b1b"/><path d="M384,192 q14,-4 8,-18" stroke="${c}" stroke-width="3" fill="none"/>`)(b?"#e08a2e":"#222")}
  `,"A woman cooking in a kitchen, apples on a table, a cat on a chair")},

 {id:"park", title:"In the park",
  questions:["Tell me what you can see in this picture.","What is the man doing?","What are the children doing?","What is in the tree?","Do you like parks? Why? / Why not?","What do you do at the weekend?"],
  model:"In this picture I can see a park. It is sunny. A man is walking his dog. Two children are playing football. There is a bird in the tree. I like parks because they are green and quiet.",
  diffs:[["The man's jacket is blue.","The man's jacket is red."],["The dog is brown.","The dog is black."],["There is a bird in the tree.","There is no bird in the tree."],["There are no apples in the tree.","There are apples in the tree."],["The girl's top is yellow.","The girl's top is pink."]],
  draw:b=>svg(`
   <rect width="400" height="160" fill="#a8dcf7"/><rect y="150" width="400" height="110" fill="#7cc35a"/>
   <circle cx="355" cy="40" r="20" fill="#ffd23f"/>
   <rect x="40" y="95" width="16" height="105" fill="#7a4b2a"/><circle cx="48" cy="85" r="34" fill="#3f9a3a"/><circle cx="22" cy="105" r="22" fill="#3f9a3a"/><circle cx="74" cy="105" r="22" fill="#3f9a3a"/>
   ${b?`<circle cx="34" cy="74" r="5" fill="#d9483b"/><circle cx="58" cy="66" r="5" fill="#d9483b"/><circle cx="22" cy="104" r="5" fill="#d9483b"/><circle cx="70" cy="100" r="5" fill="#d9483b"/>`:`<ellipse cx="82" cy="72" rx="8" ry="6" fill="#d9483b"/><circle cx="89" cy="68" r="4" fill="#d9483b"/><polygon points="93,68 98,69 93,70" fill="#f5a623"/>`}
   <rect x="95" y="185" width="70" height="8" fill="#8b5a2b"/><rect x="95" y="172" width="70" height="6" fill="#8b5a2b"/><rect x="100" y="193" width="6" height="22" fill="#8b5a2b"/><rect x="154" y="193" width="6" height="22" fill="#8b5a2b"/>
   ${person({x:205,y:245,h:118,shirt:b?"#d63b3b":"#2b59c3",legs:"#222",hair:"#5a3a1a",right:"forward",skin:"#f1c27d"})}
   <path d="M240,173 q20,30 32,48" stroke="#333" stroke-width="2" fill="none"/>
   ${((c,e)=>`<ellipse cx="282" cy="228" rx="22" ry="11" fill="${c}"/><circle cx="270" cy="216" r="9" fill="${c}"/><ellipse cx="263" cy="212" rx="4" ry="7" fill="${e}"/><circle cx="266" cy="214" r="1.6" fill="#fff"/>
   <line x1="268" y1="236" x2="266" y2="248" stroke="${c}" stroke-width="5"/><line x1="296" y1="236" x2="298" y2="248" stroke="${c}" stroke-width="5"/><path d="M303,224 q12,-6 8,-16" stroke="${c}" stroke-width="4" fill="none"/>`)(b?"#222":"#8b5a2b", b?"#444":"#6b3f1a")}
   ${person({x:318,y:232,h:78,shirt:b?"#f06bb0":"#f5c400",skirt:"#7a3fb0",legs:"#8d5524",hair:"#1b1b1b",longHair:true,skin:"#8d5524",left:"up"})}
   ${person({x:378,y:232,h:78,shirt:"#f07a22",legs:"#2d3a5a",hair:"#1b1b1b",skin:"#e0ac69",left:"forward"})}
   <circle cx="348" cy="228" r="7" fill="#fff" stroke="#222" stroke-width="1.5"/><circle cx="348" cy="228" r="2.5" fill="#222"/>
  `,"A park: a man walking a dog, two children playing football, a tree and a bench")},

 {id:"busstop", title:"At the bus stop",
  questions:["Tell me what you can see in this picture.","What is the weather like?","What is the man holding?","What is the woman wearing?","Do you like the rain? Why? / Why not?","How do you come to college?"],
  model:"In this picture I can see a bus stop. It is raining. A man has a black umbrella. A woman has a bag. She is wearing a green coat. The red bus is coming. I don't like the rain because it is cold.",
  diffs:[["The umbrella is black.","The umbrella is red."],["The bus is red.","The bus is blue."],["The woman's coat is green.","The woman's coat is purple."],["The woman has a yellow bag.","The woman has no bag."],["There is a puddle.","There is no puddle."]],
  draw:b=>svg(`
   <rect width="400" height="200" fill="#b7c0c9"/><rect y="200" width="400" height="60" fill="#8f979e"/><rect y="195" width="400" height="8" fill="#6f777e"/>
   <ellipse cx="80" cy="35" rx="50" ry="18" fill="#9aa4ad"/><ellipse cx="200" cy="25" rx="60" ry="20" fill="#9aa4ad"/><ellipse cx="330" cy="38" rx="55" ry="18" fill="#9aa4ad"/>
   ${Array.from({length:28},(_,n)=>`<line x1="${(n*53)%400}" y1="${50+(n*37)%140}" x2="${(n*53)%400-6}" y2="${64+(n*37)%140}" stroke="#5d7fa3" stroke-width="2"/>`).join("")}
   <rect x="28" y="70" width="5" height="160" fill="#555"/><rect x="12" y="62" width="38" height="28" rx="4" fill="#d63b3b"/><text x="31" y="81" font-family="Arial" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">BUS</text>
   ${(c=>`<rect x="225" y="105" width="170" height="105" rx="10" fill="${c[0]}"/><rect x="231" y="160" width="26" height="45" fill="${c[1]}"/>`)(b?["#2f5fb3","#244a8c"]:["#d72a2a","#b31f1f"])}

   <circle cx="265" cy="212" r="13" fill="#222"/><circle cx="355" cy="212" r="13" fill="#222"/><circle cx="265" cy="212" r="5" fill="#888"/><circle cx="355" cy="212" r="5" fill="#888"/>

/* ---------- state ---------- */
// screen: "start" | "exam" | "spotsetup" | "spot"
let screen="start", scene=0, round=0, role="", answersShown=false, bothShown=false, confirmAns=false;
let notes=["","","","",""], ticks=[false,false,false,false,false], modelShown=false;
let timerLeft=60, timerId=0;

const card=document.getElementById("card"), brand=document.getElementById("brand"), home=document.getElementById("home");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){ draw(); fit(); }
function draw(){
  home.hidden = screen==="start";
  if(screen==="start") return drawStart();
  if(screen==="exam") return drawExam();
  if(screen==="spotsetup") return drawSpotSetup();
  if(screen==="spot") return drawSpot();
}

function drawStart(){
  brand.textContent="Entry 1 · Describe the picture · Pairs";
  card.innerHTML=`<div class="sec">Speaking practice · work with a partner</div>
   <h1>Describe the picture: pairs</h1>
   <div class="modes">
     <button type="button" class="choice" id="m1"><b>1 · Exam practice</b><span>Like Task 3 in the exam. Student A is the examiner and asks the questions. Student B describes the picture. Then swap.</span></button>
     <button type="button" class="choice" id="m2"><b>2 · Spot the difference</b><span>Student A and Student B have different pictures. Don't look! Ask and answer to find 5 differences.</span></button>
   </div>
   <p class="hint">On the board: two students come to the front. On phones: one phone per pair for Exam practice, one phone each for Spot the difference.</p>`;
  document.getElementById("m1").onclick=()=>{screen="exam";round=0;scene=0;resetExam();render()};
  document.getElementById("m2").onclick=()=>{screen="spotsetup";role="";render()};
}

/* ----- mode 1: exam practice ----- */
function resetExam(){ stopTimer(); timerLeft=60; modelShown=false; }
function drawExam(){
  const s=SCENES[scene], aAsks=round%2===0;
  brand.textContent=`Entry 1 · Exam practice · Picture ${round+1}`;
  card.innerHTML=`<div class="act">
    <div class="pic">${s.draw(false)}</div>
    <div class="panel">
      <div class="sec">Task 3 · ${esc(s.title)}</div>
      <div class="rolebar">
        <p><span class="tag a">${aAsks?"Student A":"Student B"}</span><span>You are the <b>examiner</b>. Ask the questions in order.</span></p>
        <p><span class="tag b">${aAsks?"Student B":"Student A"}</span><span>Look at the picture. Answer in <b>full sentences</b>.</span></p>
      </div>
      <h3>Examiner's questions</h3>
      <ol class="qs">${s.questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ol>
      <div class="help"><b>Useful language</b><ul>
        <li>In this picture I can see …</li><li>There is … / There are …</li>
        <li>He is … / She is … / They are … + <b>-ing</b></li><li>I like it because … / I don't like it because …</li></ul></div>
      <div class="row">
        <span class="timer${timerLeft===0?" done":""}" id="tm">${fmt(timerLeft)}</span>
        <button type="button" class="btn" id="go">${timerId?"⏸ Pause":timerLeft===0?"↺ Reset":"▶ Start 1 minute"}</button>
        <button type="button" class="btn" id="mdl">${modelShown?"Hide":"Show"} example answer</button>
      </div>
      ${modelShown?`<div class="model">${esc(s.model)}</div>`:""}
      <div class="row"><button type="button" class="btn primary" id="swap">Swap roles → next picture</button></div>
    </div></div>`;
  document.getElementById("go").onclick=()=>{ if(timerId) stopTimer(); else if(timerLeft===0){timerLeft=60;} else startTimer(); render(); };
  document.getElementById("mdl").onclick=()=>{modelShown=!modelShown;render()};
  document.getElementById("swap").onclick=()=>{round++;scene=(scene+1)%SCENES.length;resetExam();render();window.scrollTo(0,0)};
}
const fmt=t=>`${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;
function startTimer(){ timerId=setInterval(()=>{ timerLeft=Math.max(0,timerLeft-1); const el=document.getElementById("tm");
  if(el){ el.textContent=fmt(timerLeft); el.classList.toggle("done",timerLeft===0); }
  if(timerLeft===0){ stopTimer(); const g=document.getElementById("go"); if(g) g.textContent="↺ Reset"; } },1000); }
function stopTimer(){ clearInterval(timerId); timerId=0; }

/* ----- mode 2: spot the difference ----- */
function drawSpotSetup(){
  brand.textContent="Entry 1 · Spot the difference";
  card.innerHTML=`<div class="sec">Spot the difference · setup</div>
   <h2>1. Who are you?</h2>
   <div class="roles"><button type="button" data-r="A" aria-pressed="${role==="A"}">I'm Student A</button><button type="button" data-r="B" aria-pressed="${role==="B"}">I'm Student B</button></div>
   <h2>2. Choose the same picture as your partner</h2>
   <div class="scenes">${SCENES.map((s,k)=>`<button type="button" data-s="${k}"><b>${k+1} · ${esc(s.title)}</b></button>`).join("")}</div>
   <p class="warn" id="err" hidden>First choose Student A or Student B.</p>
   <p class="hint">Teacher on the board? Choose Student A, then use “Show both pictures” at the end to check together.</p>`;
  card.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{role=b.dataset.r;render()});
  card.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
    if(!role){document.getElementById("err").hidden=false;return}
    scene=+b.dataset.s; screen="spot"; answersShown=false; bothShown=false; confirmAns=false;
    notes=["","","","",""]; ticks=[false,false,false,false,false]; render(); window.scrollTo(0,0);
  });
}
function drawSpot(){
  const s=SCENES[scene], mine=role==="B";
  brand.textContent=`Entry 1 · Spot the difference · ${s.title}`;
  const found=ticks.filter(Boolean).length;
  card.innerHTML=`<div class="act">
    <div>${bothShown?`<div class="both"><figure><figcaption>Student A</figcaption><div class="pic">${s.draw(false)}</div></figure><figure><figcaption>Student B</figcaption><div class="pic">${s.draw(true)}</div></figure></div>`
      :`<div class="pic">${s.draw(mine)}</div>`}</div>
    <div class="panel">
      <div class="sec">You are Student ${role} · ${esc(s.title)}</div>
      <h2>Don't show your partner! Talk to find 5 differences.</h2>
      <div class="help"><b>Ask</b><ul>
        <li>Is there a … in your picture?</li><li>How many … are there?</li>
        <li>What colour is the …?</li><li>What time is it? / What is the weather like?</li></ul>
        <b>Answer</b><ul><li>In my picture, the … is …</li><li>Yes, there is. / No, there isn't.</li></ul></div>
      <h3>Differences found: ${found} / 5</h3>
      <div class="diffs">${notes.map((n,k)=>`<div class="drow"><button type="button" class="tick" data-t="${k}" aria-pressed="${ticks[k]}" aria-label="Found difference ${k+1}">${ticks[k]?"✓":k+1}</button><input id="n${k}" type="text" autocomplete="off" placeholder="In my picture … / In your picture …" value="${esc(n)}"></div>`).join("")}</div>
      <div class="row">
        ${answersShown?"":confirmAns?`<span>Finished?</span><button type="button" class="btn primary" id="yes">Yes, show the answers</button><button type="button" class="btn" id="no">Not yet</button>`
          :`<button type="button" class="btn primary" id="ans">Check the answers</button>`}
        <button type="button" class="btn" id="both">${bothShown?"Show my picture":"Show both pictures"}</button>
      </div>
      ${answersShown?`<div class="answers"><b>The 5 differences</b><ol>${s.diffs.map(([a,b2])=>`<li>A: ${esc(a)} &nbsp;·&nbsp; B: ${esc(b2)}</li>`).join("")}</ol></div>`:""}
      <div class="row"><button type="button" class="btn" id="next">Next picture →</button><button type="button" class="btn" id="setup">Change role</button></div>
    </div></div>`;
  notes.forEach((_,k)=>{const el=document.getElementById("n"+k); el.oninput=()=>{notes[k]=el.value}; });
  card.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const k=+b.dataset.t;ticks[k]=!ticks[k];render();document.querySelector(`[data-t="${k}"]`)?.focus()});
  const a=document.getElementById("ans"); if(a) a.onclick=()=>{confirmAns=true;render()};
  const y=document.getElementById("yes"); if(y) y.onclick=()=>{answersShown=true;confirmAns=false;render()};
  const n=document.getElementById("no"); if(n) n.onclick=()=>{confirmAns=false;render()};
  document.getElementById("both").onclick=()=>{bothShown=!bothShown;render()};
  document.getElementById("next").onclick=()=>{scene=(scene+1)%SCENES.length;answersShown=false;bothShown=false;confirmAns=false;notes=["","","","",""];ticks=[false,false,false,false,false];render();window.scrollTo(0,0)};
  document.getElementById("setup").onclick=()=>{screen="spotsetup";render()};
}

/* ---------- full screen + fit to one screen on wide displays ---------- */
const fsBtn=document.getElementById("fs"), wrapEl=document.querySelector(".wrap");
try{ if(document.fullscreenEnabled && window.matchMedia("(min-width:700px)").matches) fsBtn.hidden=false; }catch(e){}
fsBtn.onclick=async()=>{ try{ if(document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }catch(e){ fsBtn.hidden=true; } };
document.addEventListener("fullscreenchange",()=>{ fsBtn.textContent=document.fullscreenElement?"✕ Exit full screen":"⛶ Full screen"; setTimeout(fit,150); });
home.onclick=()=>{stopTimer();screen="start";render();window.scrollTo(0,0)};
function fit(){
  wrapEl.style.fontSize="";
  if(window.innerWidth<1000) return;
  let fs=Math.max(16, Math.min(36, window.innerWidth*0.0145, window.innerHeight*0.028));
  wrapEl.style.fontSize=fs+"px";
  while(document.documentElement.scrollHeight>window.innerHeight+1 && fs>13){ fs-=0.5; wrapEl.style.fontSize=fs+"px"; }
}
let fitT=0; window.addEventListener("resize",()=>{clearTimeout(fitT);fitT=setTimeout(fit,120)});
render();
</script>
