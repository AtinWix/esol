<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: widescreen = picture left, task right, all on one screen; phone = stacked */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#18222E; --muted:#556170; --line:#D7DDE4;
  --accent:#0E6B6B; --accent-ink:#FFFFFF; --accent-soft:#DDEFEE;
  --mark:#E8A317; --mark-soft:#FCF0D2;
  --good:#1D7A3A; --good-soft:#DDF1E3; --bad:#B3261E; --bad-soft:#F8DEDC;
  --display:"Lexend","Segoe UI",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161C; --surface:#1A222B; --ink:#E9EEF3; --muted:#9AA6B3; --line:#2C3743;
  --accent:#4FB8B3; --accent-ink:#08201F; --accent-soft:#163533; --mark:#F0B940; --mark-soft:#3A2F14;
  --good:#5FCB82; --good-soft:#163222; --bad:#F08A82; --bad-soft:#3A1A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#1A222B; --ink:#E9EEF3; --muted:#9AA6B3; --line:#2C3743;
  --accent:#4FB8B3; --accent-ink:#08201F; --accent-soft:#163533; --mark:#F0B940; --mark-soft:#3A2F14;
  --good:#5FCB82; --good-soft:#163222; --bad:#F08A82; --bad-soft:#3A1A18; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45}
.wrap{min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:14px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font:700 1em var(--display);color:var(--accent)}
.meta{color:var(--muted);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.9em} h2{font-size:1.3em} h3{font-size:1.05em}
p{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.btn{font:600 1em/1 var(--display);padding:.7em 1.1em;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.chip:focus-visible,.gap:focus-visible,.opt:focus-visible,.step:focus-visible,.thumb:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{color:var(--muted);font-size:.9em}
input[type=text],textarea{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:3.2em;resize:vertical}
/* start */
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.thumb{font:inherit;text-align:left;padding:8px;border:2px solid var(--line);border-radius:12px;background:var(--accent-soft);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.thumb svg{width:100%;height:auto;border-radius:8px;display:block}
.thumb b{font-family:var(--display);color:var(--accent)}
.thumb span{font-size:.85em;color:var(--muted)}
/* activity */
.act{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start;flex:1;min-height:0}
.pics{display:flex;flex-direction:column;gap:10px;min-width:0}
.pic{margin:0;position:relative}
.pic svg{display:block;width:100%;height:auto;border-radius:10px;border:2px solid var(--line)}
.pic figcaption{position:absolute;left:8px;top:8px;background:var(--ink);color:var(--bg);font:700 .85em var(--display);padding:3px 9px;border-radius:6px}
.pics.two{display:flex;flex-direction:column;align-items:flex-start}
.pics.two .pic{max-width:100%}
.pics.two .pic svg{height:min(41vh,calc((50vw - 60px)*0.65));width:auto;aspect-ratio:400/260;max-width:100%}
@media (max-width:900px){.pics.two .pic,.pics.two .pic svg{height:auto;width:100%}}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{font:600 .9em var(--display);padding:.5em .9em;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.step[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.done::after{content:" ✓"}
.box{background:var(--mark-soft);border-radius:10px;padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;padding:.4em .8em;border-radius:999px;border:2px solid var(--accent);background:var(--surface);color:var(--ink);cursor:pointer}
.chip.used{opacity:.35}
.chip.sel{background:var(--accent);color:var(--accent-ink)}
.gaptext{font-size:1.1em;line-height:2.1}
.gap{display:inline-block;min-width:6.5em;text-align:center;font:inherit;padding:0 .4em;border:none;border-bottom:3px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:6px 6px 0 0;cursor:pointer;line-height:1.5}
.gap.right{background:var(--good-soft);border-color:var(--good)}
.gap.wrong{background:var(--bad-soft);border-color:var(--bad)}
.q{display:flex;flex-direction:column;gap:6px}
.q p.qq{font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;padding:.45em .9em;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-align:left}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ex{color:var(--muted);font-size:.92em}
.fb{font-weight:700;min-height:1.3em}
.ok{color:var(--good)} .no{color:var(--bad)}
.score{font:700 1em var(--display);font-variant-numeric:tabular-nums;color:var(--muted)}
.big{font:700 clamp(2.5em,8vw,4em)/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
@media (max-width:900px){.act{grid-template-columns:1fr}.thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="wrap">
  <div class="top">
    <div class="brand">Entry 1 · Speaking Task 3 · Describe the picture</div>

</div>

<script>
/* ---------- drawing helpers ---------- */
function person(o){
  const s=(o.h||110)/110, x=o.x, y=o.y, skin=o.skin||"#c68642", shirt=o.shirt||"#3a6fd8", legs=o.legs||"#2d3a5a", hair=o.hair||"#222";
  const sh=y-82*s, L=[];
  L.push(`<line x1="${x-6*s}" y1="${y-50*s}" x2="${x-8*s}" y2="${y}" stroke="${legs}" stroke-width="${7*s}" stroke-linecap="round"/>`);
  L.push(`<line x1="${x+6*s}" y1="${y-50*s}" x2="${x+8*s}" y2="${y}" stroke="${legs}" stroke-width="${7*s}" stroke-linecap="round"/>`);
  if(o.skirt) L.push(`<polygon points="${x-12*s},${y-54*s} ${x+12*s},${y-54*s} ${x+20*s},${y-28*s} ${x-20*s},${y-28*s}" fill="${o.skirt}"/>`);
  if(o.longHair) L.push(`<rect x="${x-13*s}" y="${y-110*s}" width="${26*s}" height="${32*s}" rx="${10*s}" fill="${hair}"/>`);
  L.push(`<rect x="${x-12*s}" y="${y-88*s}" width="${24*s}" height="${40*s}" rx="${8*s}" fill="${shirt}"/>`);
  const arm=(x1,x2,y2)=>`<line x1="${x1}" y1="${sh}" x2="${x2}" y2="${y2}" stroke="${shirt}" stroke-width="${7*s}" stroke-linecap="round"/><circle cx="${x2}" cy="${y2}" r="${4*s}" fill="${skin}"/>`;
  const la=o.left||"down", ra=o.right||"down";
  L.push(la==="up"?arm(x-10*s,x-20*s,y-112*s):la==="forward"?arm(x-10*s,x-30*s,y-70*s):arm(x-10*s,x-17*s,y-54*s));
  L.push(ra==="up"?arm(x+10*s,x+22*s,y-112*s):ra==="forward"?arm(x+10*s,x+30*s,y-70*s):arm(x+10*s,x+17*s,y-54*s));
  L.push(`<rect x="${x-3*s}" y="${y-94*s}" width="${6*s}" height="${8*s}" fill="${skin}"/>`);
  L.push(`<circle cx="${x}" cy="${y-102*s}" r="${11*s}" fill="${skin}"/>`);
  L.push(`<path d="M${x-11*s},${y-102*s} a${11*s},${11*s} 0 0 1 ${22*s},0 q${-11*s},${-5*s} ${-22*s},0z" fill="${hair}"/>`);
  L.push(`<circle cx="${x-4*s}" cy="${y-102*s}" r="${1.4*s}" fill="#222"/><circle cx="${x+4*s}" cy="${y-102*s}" r="${1.4*s}" fill="#222"/>`);
  L.push(`<path d="M${x-4*s},${y-97*s} q${4*s},${3*s} ${8*s},0" stroke="#222" stroke-width="${1.2*s}" fill="none"/>`);
  return L.join("");
}
function seated(x,y,shirt,skin,hair,longHair){
  return `${longHair?`<rect x="${x-13}" y="${y-58}" width="26" height="30" rx="10" fill="${hair}"/>`:""}
  <rect x="${x-12}" y="${y-36}" width="24" height="36" rx="8" fill="${shirt}"/>
  <circle cx="${x}" cy="${y-48}" r="11" fill="${skin}"/>
  <path d="M${x-11},${y-48} a11,11 0 0 1 22,0 q-11,-5 -22,0z" fill="${hair}"/>
  <circle cx="${x-4}" cy="${y-48}" r="1.4" fill="#222"/><circle cx="${x+4}" cy="${y-48}" r="1.4" fill="#222"/>`;
}
const svg=(inner,label)=>`<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label}">${inner}</svg>`;
const cloud=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="22" ry="11" fill="#e8edf2"/><ellipse cx="${x-12}" cy="${y+4}" rx="14" ry="9" fill="#e8edf2"/><ellipse cx="${x+13}" cy="${y+4}" rx="14" ry="9" fill="#e8edf2"/>`;

 {id:"park", title:"In the park",

  model:"In this picture I can see a park. It is sunny. A man is walking his dog. Two children are playing football. There is a bird in the tree. I like parks because they are green and quiet.",

  draw:b=>svg(`

   <circle cx="355" cy="40" r="20" fill="#ffd23f"/>

   ${person({x:378,y:232,h:78,shirt:"#f07a22",legs:"#2d3a5a",hair:"#1b1b1b",skin:"#e0ac69",left:"forward"})}
   <circle cx="348" cy="228" r="7" fill="#fff" stroke="#222" stroke-width="1.5"/><circle cx="348" cy="228" r="2.5" fill="#222"/>
  `,"A park: a man walking a dog, two children playing football, a tree and a bench")},

 {id:"busstop", title:"At the bus stop",

  draw:b=>svg(`

   ${person({x:90,y:238,h:112,shirt:"#8b5a2b",legs:"#2d3a5a",hair:"#999",right:"up",skin:"#f1c27d"})}
   ${person({x:160,y:238,h:108,shirt:b?"#7b3fb0":"#2e8b57",legs:"#333",hair:"#1b1b1b",longHair:true,skin:"#c68642"})}
   ${b?"":`<rect x="168" y="182" width="20" height="22" rx="3" fill="#f4e04d" stroke="#c9b200" stroke-width="2"/><path d="M172,182 q6,-10 12,0" stroke="#c9b200" stroke-width="2" fill="none"/>`}

}
function chNextTab(label){return `<button type="button" class="btn" id="cnext">${label||'Next challenge →'}</button>`;}
function wireTab(){const b=$('cnext');if(b)b.onclick=()=>{CS.tab=Math.min(4,CS.tab+1);render();};}
/* 1 Build the sentence */
function chBuild(){
  const B=CS.build;
  if(B.i>=CH.build.length){$('ctask').innerHTML=`<div class="panel"><h3>Finished: ${B.score} / ${CH.build.length}</h3>${chNextTab()}</div>`;wireTab();return;}
  const [id,sent]=CH.build[B.i];const words=sent.split(' ');
  if(!B.order||B.orderFor!==B.i){let o=shuffle(words.map((w,i)=>i));let g=0;while(o.every((v,i)=>v===i)&&g++<5)o=shuffle(o);B.order=o;B.orderFor=B.i;B.picked=[];B.tried=false;B.ok=false;}
  $('ctask').innerHTML=`<div class="pics">${chPic(id)}</div><div class="panel">
    <h3>Make a sentence about the picture. Tap the words in order. (${B.i+1} / ${CH.build.length})</h3>
    <div class="box" style="min-height:3em"><div class="chips" id="cans">${B.picked.map((k,j)=>`<button type="button" class="chip sel" data-j="${j}">${esc(words[k])}</button>`).join('')}</div></div>
    <div class="chips" id="cwords">${B.order.map(k=>`<button type="button" class="chip ${B.picked.includes(k)?'used':''}" data-k="${k}">${esc(words[k])}</button>`).join('')}</div>
    <p class="fb" id="cfb">${B.ok?'<span class="ok">Correct!</span>':''}</p>
    <div class="row">${B.ok?`<button type="button" class="btn" id="cbn">Next →</button>`:`<button type="button" class="btn" id="cbc">Check</button><button type="button" class="btn ghost" id="cbs">Show me</button>`}</div></div>`;
  $('cwords').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(B.ok)return;const k=+c.dataset.k;if(B.picked.includes(k))return;B.picked.push(k);render();});
  $('cans').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(B.ok)return;B.picked.splice(+c.dataset.j,1);render();});
  if(B.ok){$('cbn').onclick=()=>{B.i++;render();};return;}
  $('cbc').onclick=()=>{if(B.picked.length<words.length){$('cfb').innerHTML='<span class="no">Use all the words.</span>';return;}
    const s=B.picked.map(k=>words[k]).join(' ');if(s===sent){if(!B.tried)B.score++;B.ok=true;render();}else{B.tried=true;$('cfb').innerHTML='<span class="no">Not yet. Tap a word at the top to take it back.</span>';}};
  $('cbs').onclick=()=>{B.tried=true;B.picked=words.map((_,i)=>i);B.ok=true;render();$('cfb').innerHTML='<span class="ok">Here is the sentence. Read it, then go on.</span>';};
}
/* 2 Fix the mistake */
const norm=s=>s.replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();
function chFix(){
  const F=CS.fix;
  if(F.i>=CH.fix.length){$('ctask').innerHTML=`<div class="panel"><h3>Finished: ${F.score} / ${CH.fix.length}</h3>${chNextTab()}</div>`;wireTab();return;}
  const [bad,good,tip]=CH.fix[F.i];
  $('ctask').innerHTML=`<div class="panel" style="grid-column:1/-1;max-width:60em">
    <h3>Each sentence has one mistake. Write the correct sentence. (${F.i+1} / ${CH.fix.length})</h3>
    <p style="font-size:1.4em;font-weight:700;color:var(--bad)">${esc(bad)}</p>
    <form id="ffm" class="row" autocomplete="off"><input type="text" id="fin" aria-label="Correct sentence" value="${esc(F.val||'')}" ${F.shown?'disabled':''} style="flex:1;min-width:14em;font-size:1.2em"></form>
    <p class="fb" id="ffb">${F.msg||''}</p>
    <div class="row">${F.shown?`<button type="button" class="btn" id="fnx">Next →</button>`:`<button type="button" class="btn" id="fck">Check</button>`}</div></div>`;
  const inp=$('fin');if(!F.shown)inp.focus();
  inp.oninput=()=>F.val=inp.value;
  const next=()=>{F.i++;F.val='';F.msg='';F.tries=0;F.shown=false;render();};
  if(F.shown){$('fnx').onclick=next;return;}
  const check=()=>{const v=norm(inp.value);if(!v)return;
    if(good.some(g=>norm(g)===v)){if(F.tries===0)F.score++;F.msg='<span class="ok">Correct! '+esc(tip)+'</span>';F.shown=true;render();}
    else{F.tries++;if(F.tries>=2){F.msg='<span class="no">The answer is: '+esc(good[0])+'</span> <span class="hint">'+esc(tip)+'</span>';F.shown=true;render();}
      else $('ffb').innerHTML='<span class="no">Not yet. Hint: '+esc(tip)+'</span>';}};
  $('ffm').onsubmit=e=>{e.preventDefault();check();};$('fck').onclick=check;
}
/* 3 Where is it? */
function chPrep(){
  const P=CS.prep;
  if(P.i>=CH.prep.length){$('ctask').innerHTML=`<div class="panel"><h3>Finished: ${P.score} / ${CH.prep.length}</h3>${chNextTab()}</div>`;wireTab();return;}
  const [id,sent,ans]=CH.prep[P.i];
  $('ctask').innerHTML=`<div class="pics">${chPic(id)}</div><div class="panel">
    <h3>Look at the picture. Choose the right word. (${P.i+1} / ${CH.prep.length})</h3>
    <p style="font-size:1.4em;font-weight:700">${esc(sent).replace('___',`<span class="gap ${P.pick?(P.pick===ans?'right':'wrong'):''}">${P.pick?esc(ans):'&nbsp;'}</span>`)}</p>
    <div class="opts">${PREPS.map(w=>`<button type="button" class="opt ${P.pick?(w===ans?'right':(w===P.pick?'wrong':'')):''}" data-w="${w}" ${P.pick?'disabled':''}>${w}</button>`).join('')}</div>
    <div class="row">${P.pick?`<button type="button" class="btn" id="pnx">Next →</button>`:''}</div></div>`;
  $('ctask').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{P.pick=b.dataset.w;if(P.pick===ans)P.score++;render();});
  if(P.pick)$('pnx').onclick=()=>{P.i++;P.pick=null;render();};
}
/* 4 Memory test */
let memT=null;
function chMem(){
  const M=CS.mem;clearInterval(memT);
  if(M.i>=CH.mem.length){$('ctask').innerHTML=`<div class="panel"><h3>Finished: ${M.score} / 12</h3>${chNextTab()}</div>`;wireTab();return;}
  const [id,qs]=CH.mem[M.i];
  if(M.phase==='look'){
    $('ctask').innerHTML=`<div class="pics">${chPic(id)}</div><div class="panel">
      <h3>Memory test ${M.i+1} / 4. Look at the picture for 20 seconds. Remember everything!</h3>
      <p class="big" id="mclock">20</p><button type="button" class="btn" id="mgo">I'm ready</button></div>`;
    let left=20;memT=setInterval(()=>{left--;const c=$('mclock');if(c)c.textContent=left;if(left<=0){clearInterval(memT);M.phase='ask';render();}},1000);
    $('mgo').onclick=()=>{clearInterval(memT);M.phase='ask';render();};return;
  }
  const done=qs.every((_,k)=>M.ans[k]!==undefined);
  $('ctask').innerHTML=`<div class="pics">${done?chPic(id):`<div class="box" style="aspect-ratio:400/260;display:grid;place-items:center;font:700 1.3em var(--display)">The picture is hidden!</div>`}</div><div class="panel">
    <h3>True or false? Don't look back!</h3>
    ${qs.map(([q,t],k)=>`<div class="q"><p class="qq">${k+1}. ${esc(q)}</p><div class="opts">${[['True',true],['False',false]].map(([l,v])=>{let c='opt';if(M.ans[k]!==undefined){if(v===t)c+=' right';else if(M.ans[k]===v)c+=' wrong';}return `<button type="button" class="${c}" data-k="${k}" data-v="${v}" ${M.ans[k]!==undefined?'disabled':''}>${l}</button>`;}).join('')}</div></div>`).join('')}
    <div class="row">${done?`<button type="button" class="btn" id="mnx">Next picture →</button>`:''}</div></div>`;
  $('ctask').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;const v=b.dataset.v==='true';M.ans[k]=v;if(v===qs[k][1])M.score++;render();});
  if(done)$('mnx').onclick=()=>{M.i++;M.ans={};M.phase='look';render();};
}
/* 5 Write */
const COLOURS=/\b(red|blue|green|yellow|black|white|orange|brown|grey|gray|pink|purple)\b/gi;
function chWrite(){
  const W=CS.write;const s=SCENES[W.scene];
  $('ctask').innerHTML=`<div class="pics">${chPic(s.id,true)}<div class="row">${SCENES.map((x,k)=>`<button type="button" class="step" aria-selected="${k===W.scene}" data-w="${k}">${esc(x.title)}</button>`).join('')}</div></div>
    <div class="panel"><h3>Look at this picture (Picture B). Write 5 or more sentences about it.</h3>
    <textarea id="wtx" style="min-height:8em" placeholder="In this picture I can see …">${esc(W.text)}</textarea>
    <div class="opts" id="wck"></div>
    <div class="row"><button type="button" class="btn ghost" id="wmd">Show an example</button></div>
    <p class="ex" id="wmodel" hidden></p></div>`;
  card.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{W.scene=+b.dataset.w;W.text='';render();});
  const tx=$('wtx');
  const upd=()=>{W.text=tx.value;const t=tx.value,low=t.toLowerCase();
    const sents=(t.match(/[^.!?]+[.!?]/g)||[]).filter(x=>x.trim().split(/\s+/).length>=3).length;
    const words=(low.match(/[a-z']+/g)||[]).length;const cols=new Set((low.match(COLOURS)||[]));
    const items=[["Starts with In this picture",/^\s*in this picture/.test(low)],["There is / There are",/\bthere (is|are)\b/.test(low)],["is / are + -ing",/\b(is|are)\s+\w+ing\b/.test(low)],["2 colours",cols.size>=2],[`5 sentences (${sents})`,sents>=5],[`35 words (${words})`,words>=35]];
    $('wck').innerHTML=items.map(([l,ok])=>`<span class="opt ${ok?'right':''}">${ok?'✓':'○'} ${esc(l)}</span>`).join('');};
  tx.oninput=upd;upd();
  const MODELS={kitchen:"In this picture I can see a kitchen. A woman is cooking. She has a green top and a blue skirt. There are two green apples on the table. An orange cat is sitting on the chair. It is cloudy outside.",
    park:"In this picture I can see a park. A man in a red jacket is walking his black dog. Two children are playing football. The girl has a pink top. There are red apples in the tree.",
    busstop:"In this picture I can see a bus stop. It is raining. A man has a red umbrella. A woman is wearing a purple coat. A blue bus is coming.",
    classroom:"In this picture I can see a classroom. The teacher is pointing at the board. She has a pink top. The board says 123. Two students are sitting at their desks. There is one blue book on the desk."};
  $('wmd').onclick=()=>{const m=$('wmodel');m.hidden=false;m.textContent='Example: '+MODELS[s.id];};
}

/* Fit to one screen on wide displays */
const wrap=$('wrap');
function fit(){wrap.style.fontSize='';if(window.innerWidth<900)return;
  let fs=Math.min(window.innerWidth*0.015,window.innerHeight*0.028,32);fs=Math.max(fs,14);wrap.style.fontSize=fs+'px';
  while(document.documentElement.scrollHeight>window.innerHeight+1&&fs>12){fs-=0.5;wrap.style.fontSize=fs+'px';}}
let ft=0;window.addEventListener('resize',()=>{clearTimeout(ft);ft=setTimeout(fit,120);});
render();
})();
</script>
