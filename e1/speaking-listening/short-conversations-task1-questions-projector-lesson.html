<script>
const S=[{"tag": "learn", "title": "Today", "html": "<h2>Short conversations and Task 1 questions</h2><p class=\"lead\">Today: <b>listen</b> to two short conversations, <b>say</b> them, then practise the <b>questions</b> in Task 1.</p><ol class=\"flow\"><li>Finish your <b>My week</b> talk</li><li>Where are they?</li><li>Two conversations</li><li>Say them yourselves</li><li>Task 1 questions: order, question words, spelling, numbers</li><li>Kahoot</li></ol>", "note": "Say: “Good morning. Today we listen to short conversations, like Task 4. We also practise the questions in Task 1. First, we finish our talk: My week.” Point to each step as you say it.", "timer": 0, "steps": null, "reveal": false}, {"tag": "talk", "title": "My week – finish your talk", "html": "<div class=\"split\"><div><h2>My week: tell your partner</h2><ol class=\"steps\"><li>Write <b>four sentences</b> about your week.</li><li>Tell your partner. Say the day and the time.</li><li>Your partner asks <b>two questions</b>.</li><li>Swap.</li></ol></div><div class=\"side\"><div class=\"ex\"><p>On Monday I go to college.</p><p>I get up at seven o’clock.</p><p>On Saturday I play football.</p><p>I like Saturday because I see my friends.</p><hr><p><b>Questions:</b> What do you do on Sunday? · Where do you go on Friday? · Do you like Monday?</p></div></div></div>", "note": "Say: “We have a talk called My week. Today we finish it. Look at my example.” Read the four example sentences aloud: “On Monday I go to college. I get up at seven o’clock. On Saturday I play football. I like Saturday because I see my friends.” Say: “Write four sentences about your week. Use a day and a time. Then tell your partner. Your partner asks you two questions – look at the three examples. Then swap.” Check understanding: “How many sentences?” (Four.) “How many questions?” (Two.) Walk round and listen for the verb after I – go, play, get up, never an -ed word. Hear two volunteers at the end.", "timer": 720, "steps": null, "reveal": false}, {"tag": "learn", "title": "Where are they?", "html": "<div class=\"split\"><div><h2>Where are they?</h2><p class=\"lead\">Listen. Vote on your phone.</p><div class=\"grid g2\"><div class=\"box\"><b>A</b> college</div><div class=\"box\"><b>B</b> doctor</div><div class=\"box\"><b>C</b> market</div><div class=\"box\"><b>D</b> home</div></div><div class=\"stepq\" id=\"stepq\"></div><div class=\"stepa rv\" id=\"stepa\"></div></div><div class=\"side\"><figure class=\"qrbox\"><div class=\"qr\" data-url=\"https://atinwix.github.io/esol/all-levels/classroom-tool-vote-card.html?mode=abcd\" data-size=\"150\"></div><figcaption>Vote card A–D</figcaption></figure></div></div>", "note": "Say: “Scan the code. Choose A to D on your phone. A is college, B is doctor, C is market, D is home.” Read each sentence aloud twice, slowly, and wait for the votes: 1 “Your class is in Room 6.” 2 “What is the problem?” 3 “How much are the apples?” 4 “Dinner is ready.” 5 “Take this medicine.” 6 “Two kilos of rice, please.” 7 “Open your books.” 8 “Sit on the sofa.” After each vote press Show answer, then ask one learner: “Which word helps you?” (Room, problem, how much, dinner, medicine, kilos, books, sofa.) Write the helping words on the board under each place. Audio track: Script A. At the end say: “Tell your partner one more thing people say at the doctor.”", "timer": 0, "steps": [{"q": "Sentence 1: listen", "a": "A college"}, {"q": "Sentence 2: listen", "a": "B doctor"}, {"q": "Sentence 3: listen", "a": "C market"}, {"q": "Sentence 4: listen", "a": "D home"}, {"q": "Sentence 5: listen", "a": "B doctor"}, {"q": "Sentence 6: listen", "a": "C market"}, {"q": "Sentence 7: listen", "a": "A college"}, {"q": "Sentence 8: listen", "a": "D home"}], "reveal": true}, {"tag": "learn", "title": "How to listen in Task 4", "html": "<h2>Task 4: three steps</h2><div class=\"grid g3\"><div class=\"box hl\"><h3>First time</h3><p class=\"big\">Listen for <b>yes or no</b>.</p></div><div class=\"box hl\"><h3>Second time</h3><p class=\"big\">Listen for <b>one thing</b>.</p></div><div class=\"box hl\"><h3>Then</h3><p class=\"big\"><b>Talk</b> to your partner.</p></div></div><p class=\"lead\">Short answers: <b>Yes, she is. · No, he doesn’t. · Room 6.</b></p>", "note": "Say: “This is Task 4. First time, listen for yes or no. Second time, listen for one thing – a room, a time, a price. Then you talk about it with your partner.” Ask: “First time – what do you listen for?” (Yes or no.) “Second time?” (One thing.) Say: “Answer with a short answer. If the question is ‘Is Hana a new student?’ you say: ‘Yes, she is.’” Learners repeat “Yes, she is. No, he doesn’t.” twice.", "timer": 0, "steps": null, "reveal": false}, {"tag": "prac", "title": "Conversation 1: college", "html": "<div class=\"split\"><div><h2>Conversation 1: college</h2><div class=\"player\"><span class=\"slab\">Script B – college</span><button class=\"btn play\" type=\"button\" data-play=\"script-b\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div><div class=\"stepq\" id=\"stepq\"></div><div class=\"stepa rv\" id=\"stepa\"></div><div class=\"rv\"><div class=\"ex\"><p><b>A:</b> Hello. Are you a new student?</p><p><b>B:</b> Yes, I am. My name is Hana.</p><p><b>A:</b> Welcome, Hana. Your class is in Room 6.</p><p><b>B:</b> Thank you. Is it upstairs?</p><p><b>A:</b> Yes, it is.</p></div></div></div><div class=\"side\"><figure class=\"qrbox\"><div class=\"qr\" data-url=\"https://atinwix.github.io/esol/all-levels/classroom-tool-vote-card.html?mode=yn\" data-size=\"150\"></div><figcaption>Vote card Yes / No</figcaption></figure></div></div>", "note": "Say: “Take Handout 12A. Look at Section A. Read the two questions for Text 1.” Read them aloud: “Is Hana a new student? Which room is her class in?” Say: “First listening: yes or no. Vote on your phone.” Play Script B once. Ask: “Is Hana a new student?” Press Show answer. Say: “Second listening: one thing. Which room?” Play Script B again. Learners write the answer in Section A. Check: “Which room is her class in?” (Room 6.) Ask for a full answer: “Her class is in Room 6.” Press Show answer to show the text only if the class needs it.", "timer": 0, "steps": [{"q": "Question 1 (yes / no): Is Hana a new student?", "a": "Yes, she is."}, {"q": "Question 2 (one detail): Which room is her class in?", "a": "Room 6."}], "reveal": true}, {"tag": "prac", "title": "Conversation 2: doctor", "html": "<div class=\"split\"><div><h2>Conversation 2: doctor</h2><div class=\"player\"><span class=\"slab\">Script C – doctor</span><button class=\"btn play\" type=\"button\" data-play=\"script-c\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div><div class=\"stepq\" id=\"stepq\"></div><div class=\"stepa rv\" id=\"stepa\"></div><div class=\"rv\"><div class=\"ex\"><p><b>A:</b> Good morning. What is the problem?</p><p><b>B:</b> I have a bad cough.</p><p><b>A:</b> Take this medicine two times a day.</p><p><b>B:</b> Thank you, doctor.</p></div></div></div><div class=\"side\"><figure class=\"qrbox\"><div class=\"qr\" data-url=\"https://atinwix.github.io/esol/all-levels/classroom-tool-vote-card.html?mode=yn\" data-size=\"150\"></div><figcaption>Vote card Yes / No</figcaption></figure></div></div>", "note": "Say: “Now Text 2. Read the two questions in Section A.” Read them aloud: “Does the man have a headache? How many times a day does he take the medicine?” Say: “First listening: yes or no.” Play Script C once. Learners vote. Ask: “Does the man have a headache?” Press Show answer. Say: “The question says headache. The man says cough. So the answer is no.” Say: “Second listening: how many times a day?” Play again. Learners write. Check: “Two times.” Ask for a full answer: “He takes the medicine two times a day.”", "timer": 0, "steps": [{"q": "Question 1 (yes / no): Does the man have a headache?", "a": "No, he doesn’t. He has a cough."}, {"q": "Question 2 (one detail): How many times a day does he take the medicine?", "a": "Two times."}], "reveal": true}, {"tag": "prac", "title": "Fill the gaps", "html": "<h2>Fill the gaps: Section B</h2><p class=\"muted\">Listen to Script B and Script C again. Write the missing words in Handout 12A, Section B.</p><div class=\"grid g2\"><div class=\"ex\"><p><b>A:</b> Hello. Are you a new <u>______</u>?</p><p><b>B:</b> Yes, I am. My name is Hana.</p><p><b>A:</b> Welcome, Hana. Your class is in Room <u>______</u>.</p></div><div class=\"ex\"><p><b>A:</b> Good morning. What is the <u>______</u>?</p><p><b>B:</b> I have a bad <u>______</u>.</p><p><b>A:</b> Take this medicine <u>______</u> times a day.</p></div></div><div class=\"rv\"><div class=\"box hl\"><h3>Answers</h3><p class=\"big\">student · 6 · problem · cough · two</p></div></div>", "note": "Say: “Look at Section B on your handout. There are five gaps. Listen and write the missing words.” Play Script B once, then Script C once, pausing after each line if needed. Say: “Check with your partner.” Then press Show answer and read the five answers aloud: “student, six, problem, cough, two.” Learners correct their spelling. Say: “Well done. Now you say it.”", "timer": 0, "steps": null, "reveal": true}, {"tag": "talk", "title": "Say it yourselves", "html": "<div class=\"split\"><div><h2>Say it yourselves</h2><ol class=\"steps\"><li>Read <b>Script B</b>. Then swap.</li><li>Change the <b>name</b>, the <b>room</b>, and <b>upstairs / downstairs</b>.</li><li>Read <b>Script C</b>. Then swap.</li><li>Change the <b>problem</b> and the <b>number</b>.</li></ol><div class=\"grid g2\"><div class=\"box\"><h3>Change 1</h3><p>Hana · Room 6 · upstairs</p><p>Tom · Room 3 · downstairs</p></div><div class=\"box\"><h3>Change 2</h3><p>a cough · 2 times</p><p>a headache · a cold · a sore throat · 1 or 3 times</p></div></div></div><div class=\"side\"><div class=\"ex\"><p><b>A:</b> Hello. Are you a new student?</p><p><b>B:</b> Yes, I am. My name is Tom.</p><p><b>A:</b> Welcome, Tom. Your class is in Room 3.</p><p><b>B:</b> Thank you. Is it downstairs?</p><p><b>A:</b> Yes, it is.</p></div></div></div>", "note": "Say: “Now you speak. Work with a partner. Read Script B from the handout, Section B. Then swap roles.” Model one change with a strong learner: “Hello. Are you a new student?” “Yes, I am. My name is Tom.” “Welcome, Tom. Your class is in Room 3.” “Thank you. Is it downstairs?” “Yes, it is.” Say: “Now Script C. Change the problem and the number: a headache, a cold, a sore throat; one time, two times, three times.” Walk round and listen for: “Is it upstairs?” with rising voice, “two times a day”. Hear two pairs. Ask the class one yes/no question about each: “Is Tom a new student?” (Yes, he is.)", "timer": 600, "steps": null, "reveal": false}, {"tag": "prac", "title": "Task 1: put the question in order", "html": "<h2>Put the words in order</h2><p class=\"muted\">A learner comes to the board. Tap the words in order. Then press Check.</p><div class=\"grid g3\"><div class=\"ord\" data-words=\"where|you|do|live\" data-ans=\"Where do you live?\"></div><div class=\"ord\" data-words=\"name|your|is|what\" data-ans=\"What is your name?\"></div><div class=\"ord\" data-words=\"do|spell|you|how|your name\" data-ans=\"How do you spell your name?\"></div><div class=\"ord\" data-words=\"get up|when|do|you\" data-ans=\"When do you get up?\"></div><div class=\"ord\" data-words=\"with|live|who|you|do\" data-ans=\"Who do you live with?\"></div><div class=\"ord\" data-words=\"your|what's|phone number\" data-ans=\"What's your phone number?\"></div></div>", "note": "Say: “In Task 1 the assessor asks you questions. Today we practise the questions. Come to the board. Tap the words in the right order.” Call a different learner for each question and ask the class to say the question together before you press Check. Questions: “Where do you live?” “What is your name?” “How do you spell your name?” “When do you get up?” “Who do you live with?” “What’s your phone number?” After each, the learner says the question aloud and a partner answers it. Say: “Question word first. Then do. Then you. Then the verb.” (This pattern is for the first four; What is and What’s are different.)", "timer": 0, "steps": null, "reveal": false}, {"tag": "prac", "title": "Which question word?", "html": "<div class=\"split\"><div><h2>Which question word?</h2><p class=\"lead\">Listen to the answer. Vote for the question word.</p><div class=\"grid g2\"><div class=\"box\"><b>A</b> What</div><div class=\"box\"><b>B</b> Where</div><div class=\"box\"><b>C</b> When</div><div class=\"box\"><b>D</b> Who</div></div><div class=\"stepq\" id=\"stepq\"></div><div class=\"stepa rv\" id=\"stepa\"></div></div><div class=\"side\"><figure class=\"qrbox\"><div class=\"qr\" data-url=\"https://atinwix.github.io/esol/all-levels/classroom-tool-vote-card.html?mode=abcd\" data-size=\"150\"></div><figcaption>Vote card A–D</figcaption></figure></div></div>", "note": "Say: “I say an answer. You choose the question word on your phone. A is What, B is Where, C is When, D is Who.” Read each answer aloud: 1 “In Hackney.” 2 “On Monday.” 3 “My sister.” 4 “Rice.” 5 “At seven o’clock.” 6 “My teacher.” 7 “In the kitchen.” 8 “A pen.” After each vote, press Show answer and ask one learner for the whole question: “Where do you live?” “When do you go to college?” “Who do you live with?” “What do you eat?”", "timer": 0, "steps": [{"q": "Answer 1: “In Hackney.”", "a": "B Where"}, {"q": "Answer 2: “On Monday.”", "a": "C When"}, {"q": "Answer 3: “My sister.”", "a": "D Who"}, {"q": "Answer 4: “Rice.”", "a": "A What"}, {"q": "Answer 5: “At seven o’clock.”", "a": "C When"}, {"q": "Answer 6: “My teacher.”", "a": "D Who"}, {"q": "Answer 7: “In the kitchen.”", "a": "B Where"}, {"q": "Answer 8: “A pen.”", "a": "A What"}], "reveal": true}, {"tag": "prac", "title": "Spell it and say the number", "html": "<div class=\"split\"><div><h2>Listen and write</h2><div class=\"player\"><span class=\"slab\">Script D</span><button class=\"btn play\" type=\"butt hat, please?’ Then swap.” Model with one learner: “Where do you live?” “I live in Hackney.” “Who do you live with?” “I live with my sister.” Walk round. Every minute say one question very fast so that pairs must use the rescue sentence. Hear two pairs.", "timer": 660, "steps": null, "reveal": false}, {"tag": "prac", "title": "Kahoot", "html": "<div class=\"split\"><div><h2>Kahoot: 20 questions</h2><p class=\"lead\">Places · the two conversations · Task 1 questions · Task 4 steps</p><p class=\"lead\">Go to <b>kahoot.it</b> on your phone. Type the PIN.</p></div><div class=\"side\"><div class=\"ex\"><p><b>Teacher:</b> open the Kahoot (import file on the Hub card) and press Start.</p></div></div></div>", "note": "Say: “Take out your phone. Go to kahoot.it and type the PIN on the screen. Choose a nickname – not your real name if you prefer. Read each question carefully. You have twenty seconds.” After each question ask one learner why the answer is right. At the end say: “Well done. Look at the question you got wrong. Tell your partner the correct answer.”", "timer": 0, "steps": null, "reveal": false}, {"tag": "learn", "title": "Finish", "html": "<h2>Finish</h2><div class=\"grid g2\"><div class=\"box hl\"><h3>Say it again</h3><p class=\"big\">First listen for… <span class=\"rv ans\">yes or no.</span></p><p class=\"big\">Then listen for… <span class=\"rv ans\">one thing.</span></p><p class=\"big\">Then… <span class=\"rv ans\">talk to my partner.</span></p></div><div class=\"box\"><h3>This afternoon</h3><p class=\"big\">In the PC room: Tasks 1, 2, 3 and 4 – one after another, in pairs.</p></div></div>", "note": "Ask: “First listen for…?” (Yes or no.) “Then listen for…?” (One thing.) “Then…?” (Talk to my partner.) Press Show answer after each. Say: “After the break we go to the PC room. We do the whole exam in pairs: Task 1, Task 2, Task 3 and Task 4.” Tell learners to keep Handout 12A. Say: “You do not need headphones. Bring your phone.”", "timer": 0, "steps": null, "reveal": true}];
const AUD={"script-a": "One. Your class is in Room 6. Two. What is the problem? Three. How much are the apples? Four. Dinner is ready. Five. Take this medicine. Six. Two kilos of rice, please. Seven. Open your books. Eight. Sit on the sofa.", "script-b": "Hello. Are you a new student? Yes, I am. My name is Hana. Welcome, Hana. Your class is in Room 6. Thank you. Is it upstairs? Yes, it is.", "script-c": "Good morning. What is the problem? I have a bad cough. Take this medicine two times a day. Thank you, doctor.", "script-d": "Number one. K, H, A, N. Khan. Number two. G, R, A, C, E. Grace. Number three. My phone number is oh seven seven double oh, nine double oh, four six one.", "script-e": "Hi Sara. Where are you going? I'm going to the market. What do you want to buy? Fish and rice.", "script-f": "I live in a small flat. I live with my brother. He is a bus driver. On Sunday we cook together. I like Sunday.", "script-g": "Hello, Sam. This is Anna. The picnic is on Sunday. We meet at the park at twelve o'clock. Bring some food and a drink. See you there!", "script-h": "Excuse me. Do you have milk? Yes, we do. It's by the door. How much is it? It's one pound twenty. Thank you.", "script-i": "Excuse me. Is this the bus to the station? No, it isn't. This is the bus to the market. Which bus goes to the station? The number twelve. Thank you.", "script-j": "Hello, this is Hackney College. Your English class is in Room eight. It starts at ten o'clock. Please bring a pen. Thank you."}, AUDL={"script-a": [["Ann", "One. Your class is in Room 6."], ["Ben", "Two. What is the problem?"], ["Ann", "Three. How much are the apples?"], ["Ben", "Four. Dinner is ready."], ["Ann", "Five. Take this medicine."], ["Ben", "Six. Two kilos of rice, please."], ["Ann", "Seven. Open your books."], ["Ben", "Eight. Sit on the sofa."]], "script-b": [["Ann", "Hello. Are you a new student?"], ["Ben", "Yes, I am. My name is Hana."], ["Ann", "Welcome, Hana. Your class is in Room 6."], ["Ben", "Thank you. Is it upstairs?"], ["Ann", "Yes, it is."]], "script-c": [["Ann", "Good morning. What is the problem?"], ["Ben", "I have a bad cough."], ["Ann", "Take this medicine two times a day."], ["Ben", "Thank you, doctor."]], "script-d": [["Ann", "Number one. K, H, A, N. Khan."], ["Ann", "Number two. G, R, A, C, E. Grace."], ["Ann", "Number three. My phone number is oh seven seven double oh, nine double oh, four six one."]], "script-e": [["Ben", "Hi Sara. Where are you going?"], ["Ann", "I'm going to the market."], ["Ben", "What do you want to buy?"], ["Ann", "Fish and rice."]], "script-f": [["Ben", "I live in a small flat. I live with my brother. He is a bus driver. On Sunday we cook together. I like Sunday."]], "script-g": [["Ann", "Hello, Sam. This is Anna. The picnic is on Sunday. We meet at the park at twelve o'clock. Bring some food and a drink. See you there!"]], "script-h": [["Ben", "Excuse me. Do you have milk?"], ["Ann", "Yes, we do. It's by the door."], ["Ben", "How much is it?"], ["Ann", "It's one pound twenty."], ["Ben", "Thank you."]], "script-i": [["Ben", "Excuse me. Is this the bus to the station?"], ["Ann", "No, it isn't. This is the bus to the market."], ["Ben", "Which bus goes to the station?"], ["Ann", "The number twelve."], ["Ben", "Thank you."]], "script-j": [["Ann", "Hello, this is Hackney College. Your English class is in Room eight. It starts at ten o'clock. Please bring a pen. Thank you."]]}, HANG="";
(function(){
const $=id=>document.getElementById(id);
function wireOrder(){$('stage').querySelectorAll('.ord').forEach(d=>{if(d.dataset.on)return;d.dataset.on=1;const ws=d.dataset.words.split('|'),ans=d.dataset.ans;let sel=[];const sh=ws.slice().sort(()=>Math.random()-.5);
 d.innerHTML='<div class="ol"></div><div class="ow"></div><div class="oa"><button class="chk" type="button">Check</button><button class="rs" type="button">Again</button></div><div class="ores"></div>';
 const ol=d.querySelector('.ol'),ow=d.querySelector('.ow'),or=d.querySelector('.ores');
 sh.forEach(w=>{const b=document.createElement('button');b.type='button';b.textContent=w;b.onclick=()=>{sel.push(w);b.disabled=true;ol.textContent=sel.join(' ');or.textContent='';};ow.appendChild(b);});
 d.querySelector('.chk').onclick=()=>{const g=sel.join(' ').toLowerCase().replace(/[?.]/g,'');const t=ans.toLowerCase().replace(/[?.]/g,'');if(sel.length<ws.length){or.className='ores no';or.textContent='Use all the words.';}else if(g===t){or.className='ores ok';or.textContent='✓ '+ans;}else{or.className='ores no';or.textContent='Not yet.';}};
 d.querySelector('.rs').onclick=()=>{sel=[];ol.textContent='';or.textContent='';ow.querySelectorAll('button').forEach(b=>b.disabled=false);};});}
let i=0,left=0,tick=null,si=0;
const TAGS={learn:'Learn',prac:'Practise',talk:'Speak'};
function qrs(root){root.querySelectorAll('.qr[data-url]').forEach(q=>{if(q.dataset.done)return;q.dataset.done=1;const sz=+q.dataset.size||160;try{new QRCode(q,{text:q.dataset.url,width:sz,height:sz,correctLevel:QRCode.CorrectLevel.M});}catch(e){q.innerHTML='<a href="'+q.dataset.url+'">'+q.dataset.url+'</a>';}});}
function dots(){$('dots').innerHTML='';S.forEach((s,k)=>{const b=document.createElement('button');b.type='button';b.className='dot'+(k<i?' done':'')+(k===i?' now':'');b.setAttribute('aria-label','Step '+(k+1)+': '+s.title);b.onclick=()=>go(k);$('dots').appendChild(b);});}
function stop(){clearInterval(tick);tick=null;$('clock').classList.remove('run');}
function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0');}
function showStep(){const st=S[i].steps;if(!st)return;const s=st[si];$('stepq').innerHTML='<small>'+(si+1)+' of '+st.length+'</small>'+s.q;$('stepa').innerHTML=s.a;$('stepa').classList.add('off');$('show').textContent='Show answer';$('snext').disabled=si>=st.length-1;}
function go(k){stopAudio();i=Math.max(0,Math.min(S.length-1,k));const s=S[i];si=0;stop();
 $('h-tag').className='tag '+s.tag;$('h-tag').textContent=TAGS[s.tag];$('h-title').textContent=s.title;
 $('stage').innerHTML=s.html+(s.note?'<div class="tnote" id="tn" hidden><b>Teacher note:</b> '+s.note+'</div>':'');
 $('stage').querySelectorAll('.rv').forEach(e=>e.classList.add('off'));
 $('show').hidden=!s.reveal;$('show').textContent='Show answer';$('note').hidden=!s.note;$('snext').hidden=!s.steps;
 const t=s.timer||0;$('clock').hidden=!t;$('tbtn').hidden=!t;left=t;$('clock').textContent=fmt(t);$('clock').className='clock';$('tbtn').textContent='Start timer';
 $('back').disabled=i===0;$('next').disabled=i===S.length-1;dots();qrs($('stage'));wire();showStep();$('stage').parentElement.scrollTop=0;}
function reveal(){if(S[i].steps){const a=$('stepa');const off=a.classList.toggle('off');$('show').textContent=off?'Show answer':'Hide answer';return;}
 const r=[...$('stage').querySelectorAll('.rv.off')];if(!r.length){$('stage').querySelectorAll('.rv').forEach(e=>e.classList.add('off'));$('show').textContent='Show answer';return;}
 r[0].classList.remove('off');r[0].scrollIntoView({block:'nearest',behavior:'smooth'});$('show').textContent=r.length<=1?'Hide answers':'Show next answer';}
function timer(){if(tick){stop();$('tbtn').textContent='Start timer';return;}if(left<=0)left=S[i].timer;$('clock').classList.add('run');$('clock').classList.remove('end');$('tbtn').textContent='Pause';
 tick=setInterval(()=>{left--;$('clock').textContent=fmt(left);if(left<=0){stop();$('clock').classList.add('end');$('tbtn').textContent='Start timer';$('timeup').hidden=false;setTimeout(()=>$('timeup').hidden=true,2500);}},1000);}
/* audio: MP3 from the lesson audio page, or the browser's own voice if the MP3 isn't there */
let cur=null;
function voices(){const v=speechSynthesis.getVoices().filter(x=>/^en(-|_)GB/i.test(x.lang));const all=v.length?v:speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));
 const f=all.find(x=>/female|libby|sonia|maisie|hazel|kate|serena|susan/i.test(x.name))||all[0];const m=all.find(x=>/male|ryan|thomas|george|daniel|oliver/i.test(x.name)&&x!==f)||all[1]||all[0];return{Ann:f,Ben:m};}
function stopAudio(){if(cur){cur.stop();cur=null;}}
function makePlayer(id,btn,stat){let a=new Audio('audio/short-conversations/'+id+'.mp3');let useTTS=false,round=0,paused=false,active=false,gapT=null,q=[],qi=0;
 a.addEventListener('error',()=>{useTTS=true;});
 function setBtn(){btn.textContent=active?(paused?'▶ Carry on':'⏸ Pause'):'▶ Play twice';}
 function done(){if(round===1){round=2;stat.textContent='Again in 3 seconds…';gapT=setTimeout(()=>{stat.textContent='Second time';playOnce();},3000);}else{active=false;round=0;stat.textContent='Finished';setBtn();}}
 function speakNext(){if(qi>=q.length){done();return;}const [w,t]=q[qi++];const u=new SpeechSynthesisUtterance(t);const v=voices();if(v[w])u.voice=v[w];u.lang='en-GB';u.rate=0.9;u.onend=()=>{if(active&&!paused)setTimeout(speakNext,350);};speechSynthesis.speak(u);}
 function playOnce(){if(useTTS||!a.src){q=AUDL[id];qi=0;speechSynthesis.cancel();speakNext();}else{a.currentTime=0;a.play().catch(()=>{useTTS=true;playOnce();});}}
 a.addEventListener('ended',()=>{if(active)done();});
 return{toggle(){if(!active){stopAudio();cur=this;active=true;paused=false;round=1;stat.textContent='First time';playOnce();setBtn();return;}
   if(paused){paused=false;if(useTTS){speechSynthesis.resume();if(!speechSynthesis.speaking)speakNext();}else a.play();}else{paused=true;clearTimeout(gapT);if(useTTS)speechSynthesis.pause();else a.pause();}setBtn();},
  stop(){active=false;paused=false;round=0;clearTimeout(gapT);a.pause();speechSynthesis.cancel();stat.textContent='';setBtn();}};}
function wire(){wireOrder();$('stage').querySelectorAll('[data-play]').forEach(b=>{const p=makePlayer(b.dataset.play,b,b.parentElement.querySelector('.pstat'));b.onclick=()=>p.toggle();});
 const r=$('hgRead');if(r){let on=false;r.onclick=()=>{if(on){speechSynthesis.cancel();on=false;r.textContent='▶ Read the text aloud';return;}stopAudio();on=true;r.textContent='⏹ Stop';let n=0;const say=()=>{const u=new SpeechSynthesisUtterance(HANG);const v=voices();if(v.Ann)u.voice=v.Ann;u.lang='en-GB';u.rate=0.85;u.onend=()=>{n++;if(on&&n<2)setTimeout(say,2500);else{on=false;r.textContent='▶ Read the text aloud';}};speechSynthesis.speak(u);};speechSynthesis.cancel();say();};
  $('hgCopy').onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(HANG):Promise.reject()).then(()=>$('hgMsg').textContent='Copied ✓',()=>$('hgMsg').textContent='Copy not allowed here – use the read-aloud page');};}}
$('next').onclick=()=>go(i+1);$('back').onclick=()=>go(i-1);$('show').onclick=reveal;$('tbtn').onclick=timer;
$('snext').onclick=()=>{const st=S[i].steps;if(st&&si<st.length-1){si++;showStep();}};
$('note').onclick=()=>{const n=$('tn');if(n)n.hidden=!n.hidden;};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,button'))return;if(e.key===' '||e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(i+1);}else if(e.key==='ArrowLeft'||e.key==='PageUp')go(i-1);else if(e.key==='t'||e.key==='T'){if(S[i].timer)timer();}else if(e.key==='a'||e.key==='A'){if(S[i].reveal)reveal();}});
if('speechSynthesis' in window)speechSynthesis.getVoices();
qrs(document.querySelector('header'));go(0);})();
