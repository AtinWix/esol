<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E2 Question Forms – Speaking &amp; Listening Exam Practice – Interactive</title>
  <style>
    /* =====================================================================
       BASE & RESET — Self-contained, offline-ready, 16:9 widescreen first
       ===================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-page: #f1f5f9;
      --bg-card: #ffffff;
      --bg-subtle: #e2e8f0;
      --bg-hover: #dbeafe;
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --primary-light: #eff6ff;
      --success: #15803d;
      --success-bg: #dcfce7;
      --success-border: #86efac;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --danger-border: #fca5a5;
      --warn-bg: #fef3c7;
      --warn-border: #fcd34d;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: #cbd5e1;
      --radius: 10px;
      --shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: Calibri, Arial, Helvetica, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-size: 16px;
      line-height: 1.35;
      overflow-x: hidden;
    }

    /* Full-screen flex shell designed to fit 16:9 widescreen without vertical scroll */
    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 1440px;
      margin: 0 auto;
      padding: 10px 18px 8px 18px;
    }

    @media (min-width: 1024px) {
      .app-shell {
        height: 100vh;
        overflow: hidden;
      }
    }

    /* =====================================================================
       HEADER & TASK NAVIGATION
       ===================================================================== */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 14px;
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .level-badge {
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--bg-page);
      color: var(--text-main);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 7px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover {
      background: var(--bg-hover);
      border-color: var(--primary);
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary-dark);
    }

    .tab-score {
      background: rgba(255, 255, 255, 0.25);
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 0.82rem;
    }

    .tab-btn:not(.active) .tab-score {
      background: var(--bg-subtle);
      color: var(--text-main);
    }

    /* =====================================================================
       SUB-BAR: INSTRUCTIONS + PROJECTOR CONTROLS
       ===================================================================== */
    .control-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--primary-light);
      border: 1px solid #bfdbfe;
      border-radius: var(--radius);
      padding: 7px 14px;
      margin-top: 8px;
      flex-shrink: 0;
    }

    .instruction-text {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      border: none;
      border-radius: 7px;
      padding: 7px 13px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-reveal {
      background: #0f766e;
      color: #ffffff;
    }

    .btn-reveal:hover {
      background: #115e59;
    }

    .btn-reset {
      background: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-reset:hover {
      background: var(--bg-subtle);
    }

    .score-pill {
      background: #ffffff;
      border: 1px solid #93c5fd;
      color: var(--primary-dark);
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 0.92rem;
    }

    /* =====================================================================
       MAIN CONTENT AREA (2-COLUMN WIDESCREEN GRID FOR 6 ITEMS)
       ===================================================================== */
    .task-panel {
      display: none;
      flex: 1;
      margin-top: 8px;
      min-height: 0;
    }

    .task-panel.active {
      display: flex;
      flex-direction: column;
    }

    .items-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      flex: 1;
      min-height: 0;
    }

    @media (min-width: 900px) {
      .items-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(3, 1fr);
      }
    }

      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 10
