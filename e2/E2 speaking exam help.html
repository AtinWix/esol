<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E2 Question Forms – Speaking &amp; Listening Exam Practice – Interactive</title>
  <style>
    /* =====================================================================
       BASE & RESET — Self-contained, offline-ready, 16:9 widescreen first
       ===================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-page: #f1f5f9;
      --bg-card: #ffffff;
      --bg-subtle: #e2e8f0;
      --bg-hover: #dbeafe;
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --primary-light: #eff6ff;
      --success: #15803d;
      --success-bg: #dcfce7;
      --success-border: #86efac;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --danger-border: #fca5a5;
      --warn-bg: #fef3c7;
      --warn-border: #fcd34d;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: #cbd5e1;
      --radius: 10px;
      --shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: Calibri, Arial, Helvetica, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-size: 16px;
      line-height: 1.35;
      overflow-x: hidden;
    }

    /* Full-screen flex shell designed to fit 16:9 widescreen without vertical scroll */
    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 1440px;
      margin: 0 auto;
      padding: 10px 18px 8px 18px;
    }

    @media (min-width: 1024px) {
      .app-shell {
        height: 100vh;
        overflow: hidden;
      }
    }

    /* =====================================================================
       HEADER & TASK NAVIGATION
       ===================================================================== */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 14px;
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .level-badge {
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--bg-page);
      color: var(--text-main);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 7px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover {
      background: var(--bg-hover);
      border-color: var(--primary);
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary-dark);
    }

    .tab-score {
      background: rgba(255, 255, 255, 0.25);
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 0.82rem;
    }

    .tab-btn:not(.active) .tab-score {
      background: var(--bg-subtle);
      color: var(--text-main);
    }

    /* =====================================================================
       SUB-BAR: INSTRUCTIONS + PROJECTOR CONTROLS
       ===================================================================== */
    .control-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--primary-light);
      border: 1px solid #bfdbfe;
      border-radius: var(--radius);
      padding: 7px 14px;
      margin-top: 8px;
      flex-shrink: 0;
    }

    .instruction-text {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      border: none;
      border-radius: 7px;
      padding: 7px 13px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-reveal {
      background: #0f766e;
      color: #ffffff;
    }

    .btn-reveal:hover {
      background: #115e59;
    }

    .btn-reset {
      background: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-reset:hover {
      background: var(--bg-subtle);
    }

    .score-pill {
      background: #ffffff;
      border: 1px solid #93c5fd;
      color: var(--primary-dark);
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 0.92rem;
    }

    /* =====================================================================
       MAIN CONTENT AREA (2-COLUMN WIDESCREEN GRID FOR 6 ITEMS)
       ===================================================================== */
    .task-panel {
      display: none;
      flex: 1;
      margin-top: 8px;
      min-height: 0;
    }

    .task-panel.active {
      display: flex;
      flex-direction: column;
    }

    .items-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      flex: 1;
      min-height: 0;
    }

    @media (min-width: 900px) {
      .items-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(3, 1fr);
      }
    }

    .item-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 7px;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .item-card.solved {
      border-color: var(--success-border);
      background: #f0fdf4;
    }

    .item-card.wrong-attempt {
      border-color: var(--danger-border);
    }

    .item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .item-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .item-status {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .status-ok {
      background: var(--success-bg);
      color: var(--success);
    }

    .status-err {
      background: var(--danger-bg);
      color: var(--danger);
    }

    /* =====================================================================
       TASK 1 & 3: CLICKABLE WORDS + FIX INPUT
       ===================================================================== */
    .sentence-tokens {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      font-size: 1.12rem;
      font-weight: 600;
    }

    .word-btn {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      padding: 4px 8px;
      font-family: inherit;
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .word-btn:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: var(--primary);
    }

    .word-btn.selected {
      background: var(--warn-bg);
      border-color: #d97706;
      color: #92400e;
      box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.25);
    }

    .word-btn.fixed-word {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
      text-decoration: none;
    }

    .word-btn:disabled {
      cursor: default;
    }

    .punct-mark {
      font-size: 1.15rem;
      font-weight: 700;
      margin-left: -2px;
    }

    .fix-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      min-height: 36px;
    }

    .fix-prompt {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .fix-input {
      border: 2px solid var(--primary);
      border-radius: 6px;
      padding: 5px 9px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      width: 120px;
      color: var(--text-main);
      background: #ffffff;
    }

    .fix-input:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.2);
    }

    .btn-check {
      background: var(--primary);
      color: #ffffff;
      padding: 6px 12px;
      font-size: 0.9rem;
    }

    .btn-check:hover {
      background: var(--primary-dark);
    }

    /* =====================================================================
       TASK 2: LISTENING / READING PROMPT + 3-OPTION MCQ
       ===================================================================== */
    .prompt-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 10px;
    }

    .audio-btn {
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .audio-btn:hover {
      background: var(--primary-dark);
    }

    .audio-btn.speaking {
      background: #0f766e;
    }

    .mcq-options {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .mcq-btn {
      text-align: left;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .mcq-btn:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: var(--primary);
    }

    .mcq-btn.correct-choice {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
      font-weight: 700;
    }

    .mcq-btn.wrong-choice {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .mcq-btn:disabled {
      cursor: default;
    }

    /* =====================================================================
       TASK 3: EXAM DIALOGUE SPOTTER (CORRECT VS HAS A MISTAKE)
       ===================================================================== */
    .speaker-tag {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 5px;
      background: #e0e7ff;
      color: #1e3a8a;
    }

    .speaker-tag.examiner {
      background: #fef3c7;
      color: #92400e;
    }

    .choice-pair {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-choice {
      background: #f8fafc;
      border: 1.5px solid var(--border);
      color: var(--text-main);
      padding: 5px 11px;
      font-size: 0.9rem;
    }

    .btn-choice:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: var(--primary);
    }

    .btn-choice.active-mistake {
      background: var(--warn-bg);
      border-color: #d97706;
      color: #92400e;
    }

    /* =====================================================================
       FOOTER: TEACHER NOTE (9PX) & ATIN CREDIT
       ===================================================================== */
    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 6px;
