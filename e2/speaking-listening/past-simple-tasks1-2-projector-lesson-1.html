<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>E2 Past Simple – Speaking Tasks 1 & 2 – Projector Lesson</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: projector stage. Fixed header (where we are), big centre stage (one step), footer controls (show / timer / next). */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --ink:#141D28; --muted:#4F5B69; --line:#D3D9E0;
  --accent:#0E6B6B; --accent-ink:#FFFFFF; --accent-soft:#DCEFEE;
  --mark:#E3A008; --mark-soft:#FCEFCC;
  --learn:#2F5DA8; --learn-soft:#E2EAF7; --prac:#0E6B6B; --prac-soft:#DCEFEE; --talk:#A3461F; --talk-soft:#F7E4DA;
  --good:#1D7A3A; --good-soft:#DDF1E3; --bad:#B3261E;
  --display:"Lexend","Segoe UI",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151B; --surface:#19212A; --ink:#EEF2F6; --muted:#A2ADBA; --line:#2B3642;
  --accent:#4FB8B3; --accent-ink:#08201F; --accent-soft:#163533;
  --mark:#F0B940; --mark-soft:#3A2F14;
  --learn:#86A8E6; --learn-soft:#1C2A42; --prac:#4FB8B3; --prac-soft:#163533; --talk:#EE9A74; --talk-soft:#3B2318;
  --good:#5FCB82; --good-soft:#163222; --bad:#F08A82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151B; --surface:#19212A; --ink:#EEF2F6; --muted:#A2ADBA; --line:#2B3642;
  --accent:#4FB8B3; --accent-ink:#08201F; --accent-soft:#163533;
  --mark:#F0B940; --mark-soft:#3A2F14;
  --learn:#86A8E6; --learn-soft:#1C2A42; --prac:#4FB8B3; --prac-soft:#163533; --talk:#EE9A74; --talk-soft:#3B2318;
  --good:#5FCB82; --good-soft:#163222; --bad:#F08A82; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(18px,1.9vw,30px);line-height:1.45}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:12px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.hrow{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;max-width:min(100%,2200px);margin:0 auto}
.where{display:flex;gap:12px;align-items:center;min-width:0}
.tag{font:700 .62em/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:.5em .7em;border-radius:6px;white-space:nowrap}
.tag.learn{background:var(--learn-soft);color:var(--learn)}
.tag.prac{background:var(--prac-soft);color:var(--prac)}
.tag.talk{background:var(--talk-soft);color:var(--talk)}
.stitle{font:700 1em/1.2 var(--display);margin:0;min-width:0}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;cursor:pointer}
.dot.done{background:var(--line)}
.dot.now{background:var(--accent);border-color:var(--accent)}
main{overflow:auto;padding-block:24px}
.stage{max-width:min(100%,2200px);margin:0 auto;display:flex;flex-direction:column;gap:.9em}
.who{display:flex;gap:.6em;align-items:center;flex-wrap:wrap;font:700 .9em/1.2 var(--display)}
.who .badge{background:var(--ink);color:var(--bg);padding:.35em .7em;border-radius:8px}
.who .how{color:var(--muted);font-weight:500}
h2{font:700 clamp(1.6em,3.4vw,2.4em)/1.1 var(--display);margin:0;text-wrap:balance}
p{margin:0}
.lead{font-size:1.15em;max-width:42em}
.ex{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:.7em 1em;font-size:1.05em}
.ex b{color:var(--accent)}
.grid{display:grid;gap:.7em}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.box{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:.7em 1em;min-width:0}
.box h3{font:700 1.05em/1.2 var(--display);margin:0 0 .25em}
.box .big{font:700 1.5em/1.15 var(--display)}
.box.hl{border-color:var(--accent);background:var(--accent-soft)}
.rv{transition:opacity .25s}
.rv.off{opacity:0;pointer-events:none}
.ans{color:var(--accent);font-weight:700}
table.t{border-collapse:collapse;font-size:1.05em;background:var(--surface)}
table.t th,table.t td{border:2px solid var(--line);padding:.35em .8em;text-align:left}
table.t th{background:var(--accent-soft);font-family:var(--display)}
.tw{overflow-x:auto}
/* cards */
.card{background:var(--surface);border:3px solid var(--accent);border-radius:18px;padding:1em;display:flex;flex-direction:column;align-items:center;gap:.4em;text-align:center;min-height:7.5em;justify-content:center}
.card .q{font:700 clamp(1.6em,4.4vw,3em)/1.15 var(--display);text-wrap:balance}
.card .a{font:700 clamp(1.4em,3.6vw,2.5em)/1.15 var(--display);color:var(--accent);text-wrap:balance}
.card .note{color:var(--muted);font-size:.9em}
.count{color:var(--muted);font:700 .85em var(--display);font-variant-numeric:tabular-nums;text-align:center}
.lines{display:grid;gap:.5em}
.ln{display:flex;gap:.7em;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.5em .8em}
.ln .k{flex:0 0 1.8em;height:1.8em;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 .9em var(--display)}
.side2{display:grid;gap:1em}
.side2>div{min-width:0;align-content:start}
@media (min-width:1000px) and (min-aspect-ratio:4/3){
  .side2{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.6em;align-items:start}
  .lines.dragl{display:grid;grid-template-columns:1fr}
  #model{max-width:none}
}
.dl{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;align-items:center}
.dl .grip{color:var(--muted);font-size:1.2em}
.dl.dragging{opacity:.35;border-style:dashed;border-color:var(--accent)}
.dl.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 10px 28px rgba(0,0,0,.25);border-color:var(--accent);margin:0}
.dl.ok{border-color:var(--good);background:var(--good-soft)}
.dl.bad{border-color:var(--bad);background:var(--bad-soft,transparent)}
#model .w,#model .verb{cursor:pointer;border-radius:4px;padding:0 .08em}
#model .w:hover,#model .verb:hover{background:var(--accent-soft)}
#model .verb.found{background:var(--good-soft);box-shadow:0 0 0 2px var(--good);color:var(--good)}
#model .w.miss{background:var(--mark-soft);box-shadow:0 0 0 2px var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.order{font:700 1.6em var(--display);color:var(--accent);letter-spacing:.1em}
.verb{border-radius:4px;transition:background .3s}
.show-verbs .verb{background:var(--mark-soft);box-shadow:0 0 0 2px var(--mark)}
.steps{display:grid;gap:.5em;counter-reset:s}
.steps li{list-style:none;display:flex;gap:.6em;align-items:flex-start}
.steps li::before{counter-increment:s;content:counter(s);flex:0 0 1.6em;height:1.6em;border-radius:50%;background:var(--talk);color:var(--surface);display:grid;place-items:center;font:700 .85em var(--display)}
.steps{margin:0;padding:0}
.topic{font:700 clamp(1.5em,3.6vw,2.4em)/1.15 var(--display);color:var(--talk);text-wrap:balance}
.check{display:grid;gap:.5em}
.check div{display:flex;justify-content:space-between;gap:1em;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.5em .9em;align-items:center}
.check span:last-child{white-space:nowrap;font-size:1.2em}
/* footer */
footer{border-top:1px solid var(--line);background:var(--surface);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.frow{max-width:min(100%,2200px);margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fgroup{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:700 .85em/1 var(--display);padding:.75em 1.1em;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:48px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.mark{background:var(--mark);border-color:var(--mark);color:#1b1400}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.dot:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.clock{font:700 1.5em/1 var(--display);font-variant-numeric:tabular-nums;min-width:3.3em;text-align:center}
.clock.run{color:var(--accent)}
.clock.end{color:var(--bad);animation:fl .5s 6}
@keyframes fl{50%{opacity:.2}}
.timeup{position:fixed;inset:auto 0 auto 0;top:30%;text-align:center;pointer-events:none}
.timeup span{display:inline-block;background:var(--bad);color:#fff;font:700 clamp(2em,6vw,4em)/1 var(--display);padding:.4em .8em;border-radius:20px}
.tnote{background:var(--mark-soft);border-radius:12px;padding:.6em .9em;font-size:.8em}
.keys{color:var(--muted);font-size:.7em}
@media (prefers-reduced-motion:reduce){.clock.end{animation:none}.rv{transition:none}}
@media (max-width:760px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}.keys{display:none}.dots{display:none}}
</style>

<div class="app">
  <header class="pad">
    <div class="hrow">
      <div class="where"><span class="tag" id="h-tag">Learn</span><p class="stitle" id="h-title">Start</p></div>
      <div class="dots" id="dots" aria-label="Lesson steps"></div>
    </div>
  </header>
  <main class="pad"><div class="stage" id="stage"></div></main>
  <footer class="pad">
    <div class="frow">
      <div class="fgroup">
        <button class="btn ghost" id="back" type="button">← Back</button>
        <button class="btn ghost" id="retry" type="button">↺ Try again</button>
        <button class="btn mark" id="show" type="button">Show answer</button>
      </div>
      <div class="fgroup">
        <span class="clock" id="clock" aria-live="off" hidden>0:00</span>
        <button class="btn ghost" id="tbtn" type="button" hidden>Start timer</button>
        <button class="btn ghost" id="note" type="button">Teacher note</button>
        <span class="keys">Space = next · ← back · T timer</span>
      </div>
      <div class="fgroup">
        <button class="btn" id="next" type="button">Next →</button>
      </div>
    </div>
  </footer>
</div>
<div class="timeup" id="timeup" hidden><span>Time's up!</span></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const who=(badge,how)=>`<div class="who"><span class="badge">${badge}</span><span class="how">${how}</span></div>`;

/* Slide kinds:
   html: static content; elements with class rv are revealed one by one by "Show".
   cards: a deck of [prompt, answer, note]; Show reveals answer, Next moves card, then slide. */
const S=[
 {type:'learn',title:'Talking about the past',html:`
   <h2>Talking about the past</h2>
   <p class="lead">ESB Entry 2 Speaking and Listening. Today we practise the past for two parts of the exam.</p>
   <div class="grid g2">
     <div class="box"><h3>Task 1: Questions</h3>You ask and answer questions. <b>What did you do last weekend?</b></div>
     <div class="box"><h3>Task 2: My talk</h3>You talk about one past event. You have one minute to plan.</div>
   </div>
   <p class="lead">Press <b>Next</b> to start. The screen tells you what to do.</p>`,
   note:'Learners can drive: hand the clicker or mouse to a learner. Space moves on; it shows answers first.'},

 {type:'talk',title:'Warm-up',timer:120,html:`
   ${who('Pairs','2 minutes')}
   <h2>What did you do yesterday?</h2>
   <p class="lead">Tell your partner. Say three things.</p>
   <div class="ex">"Yesterday I <b>went</b> to college. Then I <b>cooked</b> rice. In the evening I <b>phoned</b> my brother."</div>
   <p class="lead">Press <b>Start timer</b>.</p>`,
   note:'Monitor and note 3–4 past-tense errors to board later. Do not correct now.'},

 {type:'learn',title:'Regular verbs: -ed',html:`
   ${who('Everyone','read')}
   <h2>Regular verbs: add -ed</h2>
   <div class="grid g2">
     <div class="box rv off"><h3>Most verbs: + ed</h3><span class="big">walk → walk<span class="ans">ed</span></span></div>
     <div class="box rv off"><h3>Ends in e: + d</h3><span class="big">live → live<span class="ans">d</span></span></div>
     <div class="box rv off"><h3>Consonant + y → ied</h3><span class="big">study → stud<span class="ans">ied</span></span></div>
     <div class="box rv off"><h3>Short verb: double</h3><span class="big">stop → stop<span class="ans">ped</span></span></div>
   </div>
   <p class="lead">Press <b>Show</b> to see each rule.</p>`},

 {type:'prac',title:'Say the past',who:['Everyone','say it together, then check'],cards:[
   ['cook','cooked'],['phone','phoned'],['study','studied'],['stop','stopped'],['play','played'],
   ['live','lived'],['carry','carried'],['shop','shopped'],['wait','waited'],['try','tried']],shuffle:true},

 {type:'learn',title:'Three -ed sounds',html:`
   ${who('Everyone','listen to your teacher, then say it')}
   <h2>-ed has three sounds</h2>
   <div class="grid g3">
     <div class="box hl"><h3>1 finger = t</h3><span class="big">walked</span><br>cooked · watched</div>
     <div class="box hl"><h3>2 fingers = d</h3><span class="big">played</span><br>phoned · cleaned</div>
     <div class="box hl"><h3>3 fingers = id</h3><span class="big">wanted</span><br>needed · visited</div>
   </div>
   <div class="ex rv off">We only say <b>id</b> after <b>t</b> or <b>d</b>: wan<b>t</b>ed, nee<b>d</b>ed.</div>`,
   note:'Model each sound. Learners hold up 1, 2 or 3 fingers on the next screen.'},

 {type:'prac',title:'Which sound?',who:['Everyone','say the word, show 1, 2 or 3 fingers'],cards:[
   ['watched','1 finger · t'],['cleaned','2 fingers · d'],['visited','3 fingers · id'],['helped','1 finger · t'],
   ['stayed','2 fingers · d'],['needed','3 fingers · id'],['washed','1 finger · t'],['phoned','2 fingers · d'],
   ['started','3 fingers · id'],['looked','1 finger · t'],['lived','2 fingers · d'],['waited','3 fingers · id']],shuffle:true},

 {type:'learn',title:'Irregular verbs',html:`
   ${who('Everyone','read and remember')}
   <h2>Irregular verbs: no -ed!</h2>
   <div class="grid g4">
     ${[['go','went'],['have','had'],['eat','ate'],['buy','bought'],['take','took'],['see','saw'],['meet','met'],['make','made'],['get','got'],['come','came'],['do','did'],['feel','felt']]
       .map(([a,b])=>`<div class="box"><span class="big">${a}</span> → <span class="ans rv off">${b}</span></div>`).join('')}
   </div>
   <p class="lead">Say the past together. Press <b>Show</b> to check each one.</p>`},

 {type:'prac',title:'Fast verbs',who:['Everyone','say it fast!'],cards:[
   ['go','went'],['have','had'],['eat','ate'],['buy','bought'],['take','took'],['see','saw'],['meet','met'],['make','made'],
   ['get','got'],['come','came'],['do','did'],['feel','felt'],['sleep','slept'],['leave','left'],['find','found'],
   ['say','said'],['give','gave'],['drink','drank'],['write','wrote'],['speak','spoke']],shuffle:true},

 {type:'learn',title:'was / were',html:`
   ${who('Everyone','read')}
   <h2>was / were</h2>
   <div class="tw"><table class="t">
     <tr><th></th><th>Yes</th><th>No</th><th>Question</th></tr>
     <tr><td>I / he / she / it</td><td><b>was</b></td><td>wasn't</td><td>Was it …?</td></tr>
     <tr><td>you / we / they</td><td><b>were</b></td><td>weren't</td><td>Were you …?</td></tr>
   </table></div>
   <div class="ex rv off">"How <b>was</b> your weekend?" "It <b>was</b> great because I saw my friends."</div>`},

 {type:'prac',title:'was or were?',who:['Everyone','say the missing word'],cards:[
   ['The bus ____ very busy.','was'],['My children ____ at school.','were'],['____ you at home last night?','Were'],
   ['I ____ tired yesterday.','was'],['The shops ____ open. They were closed.',"weren't"],['How ____ your weekend?','was'],
   ['We ____ late for college.','were'],['It ____ cold. It was hot!',"wasn't"]]},

 {type:'learn',title:'Questions with did',html:`
   ${who('Everyone','read')}
   <h2>Questions: did + verb</h2>
   <div class="grid g3">
     <div class="box"><h3>Question</h3><b>Did</b> you <b>go</b> out?<br>Where <b>did</b> you <b>go</b>?</div>
     <div class="box"><h3>Short answer</h3>Yes, I did.<br>No, I didn't.</div>
     <div class="box"><h3>No</h3>I <b>didn't go</b> out.</div>
   </div>
   <div class="ex rv off">After <b>did</b> and <b>didn't</b>, the verb is <b>not</b> past.<br>✗ Did you <s>went</s>? &nbsp; ✓ Did you <b>go</b>?</div>`},

 {type:'prac',title:'Right or wrong?',who:['Pairs','is it right? If wrong, say the correct sentence'],cards:[
   ['Did you went to the market?','Wrong → Did you go to the market?'],
   ['I didn’t see my friend.','Right ✓'],
   ['Where you went on Saturday?','Wrong → Where did you go on Saturday?'],
   ['She goed to Dalston.','Wrong → She went to Dalston.'],
   ['What did you ate for lunch?','Wrong → What did you eat for lunch?'],
   ['Did you like the film?','Right ✓'],
   ['We didn’t went to college.','Wrong → We didn’t go to college.'],
   ['I came to London two years ago.','Right ✓']],shuffle:true},

 {type:'prac',title:'Make the question',who:['Pairs','write the question on paper'],cards:[
   ['where / you / go / last weekend?','Where did you go last weekend?'],
   ['what / you / eat / last night?','What did you eat last night?'],
   ['who / you / meet / yesterday?','Who did you meet yesterday?'],
   ['you / watch / TV / last night?','Did you watch TV last night?'],
   ['how / you / come / to college today?','How did you come to college today?'],
   ['how / be / your weekend?','How was your weekend?']],cardTimer:30},

 {type:'learn',title:'Answer + one more thing',html:`
   ${who('Everyone','read')}
   <h2>Answer + one more thing</h2>
   <p class="lead">In the exam, short answers are not enough.</p>
   <div class="grid g2">
     <div class="box"><h3>✗ Too short</h3>"Did you go out at the weekend?"<br>"Yes."</div>
     <div class="box hl rv off"><h3>✓ Good</h3>"Yes, I did. I went to Ridley Road Market. It was very busy."</div>
   </div>
   <div class="ex rv off">Then your partner asks one more question: <b>Why? Who with? How was it? What did you buy?</b></div>`},

 {type:'talk',title:'Ask your partner',timer:240,html:`
   ${who('Pairs','4 minutes · A asks, then swap')}
   <h2>Ask and answer</h2>
   <div class="grid g2">
     <div class="box">Where did you go last weekend?</div>
     <div class="box">What did you eat yesterday?</div>
     <div class="box">How did you come to college today?</div>
     <div class="box">Who did you talk to yesterday?</div>
     <div class="box">What did you do last night?</div>
     <div class="box">How was your weekend?</div>
   </div>
   <p class="lead"><b>Answer + one more thing.</b> Then ask one more question.</p>`,
   note:'Swap roles at 2 minutes. Listen for did + base verb in the follow-up questions.'},

 {type:'learn',title:'Telling a story',html:`
   ${who('Everyone','read')}
   <h2>Put your talk in order</h2>
   <div class="grid g4">
     <div class="box hl"><span class="big">First,</span></div>
     <div class="box hl"><span class="big">Then</span></div>
     <div class="box hl"><span class="big">After that,</span></div>
     <div class="box hl"><span class="big">Finally,</span></div>
   </div>
   <div class="ex rv off"><b>First,</b> I got up. <b>Then</b> I had breakfast. <b>After that,</b> I took the bus. <b>Finally,</b> I arrived at college.</div>`},

 {type:'prac',title:'Story order',timer:120,html:`
   ${who('Pairs','2 minutes · put the story in order')}
   <h2>Ana's Saturday</h2>
   <p class="lead">Drag the sentences into the right order. Then press <b>Check order</b>.</p>
   <div class="lines dragl" id="dragl" data-answer="CEADB">
     <div class="ln dl" data-k="A"><span class="grip" aria-hidden="true">⠿</span><span class="k">A</span><span>Then we walked to London Fields and had a picnic.</span></div>
     <div class="ln dl" data-k="B"><span class="grip" aria-hidden="true">⠿</span><span class="k">B</span><span>Finally, we took the bus home. We were tired but happy.</span></div>
     <div class="ln dl" data-k="C"><span class="grip" aria-hidden="true">⠿</span><span class="k">C</span><span>Last Saturday I went to Broadway Market with my daughter.</span></div>
     <div class="ln dl" data-k="D"><span class="grip" aria-hidden="true">⠿</span><span class="k">D</span><span>After that, my daughter played in the playground.</span></div>
     <div class="ln dl" data-k="E"><span class="grip" aria-hidden="true">⠿</span><span class="k">E</span><span>First, we bought some bread and fruit.</span></div>
   </div>
   <div class="grid g3" style="max-width:40em"><button class="btn" type="button" id="chk">Check order</button><button class="btn ghost" type="button" id="mix">Mix again</button><p id="chkmsg" style="align-self:center;font-weight:700"></p></div>
   <p class="order rv off" data-act="sortlines">C · E · A · D · B</p>`},

 {type:'learn',title:'A model talk',cls:'',html:`
   ${who('Everyone','click the past verbs')}
   <h2>Tomasz: my last birthday</h2>
   <p class="lead">Click every past verb. Found: <b id="vfound">0</b> / 12 <span id="vmsg" class="ans"></span></p>
   <div class="ex" id="model">"My last birthday <span class="verb">was</span> in June. In the morning I <span class="verb">went</span> to college and my classmates <span class="verb">sang</span> Happy Birthday. I <span class="verb">was</span> very surprised! <b>First,</b> I <span class="verb">met</span> my brother and we <span class="verb">went</span> to a Turkish restaurant on Mare Street. <b>Then</b> we <span class="verb">walked</span> to London Fields and <span class="verb">sat</span> on the grass. <b>After that,</b> my brother <span class="verb">gave</span> me a present. It <span class="verb">was</span> a new watch. <b>Finally,</b> I <span class="verb">phoned</span> my mum. I <span class="verb">felt</span> very happy."</div>
   <div class="rv off" data-act="verbs"></div>
   <div class="box rv off"><h3>His plan (1 minute)</h3>June · college · classmates · brother · restaurant · London Fields · watch · mum · happy</div>
   <p class="lead">Stuck? Press <b>Show</b> to see all the verbs, then his plan.</p>`},

 {type:'talk',title:'My talk (Task 2)',talk:true,html:`
   ${who('Pairs','A talks, B listens. Then swap.')}
   <h2>Your turn</h2>
   <div class="side2"><div class="grid">
   <div class="grid g2">
     <div class="box"><h3>Student A</h3><p class="topic" id="topicA"></p></div>
     <div class="box"><h3>Student B</h3><p class="topic" id="topicB"></p></div>
   </div>
   <div class="fgroup"><span id="setno" class="who"><span class="how"></span></span><button class="btn ghost" type="button" id="newtopic">Next set →</button></div>
   </div><div class="grid">
   <ol class="steps">
     <li><span><b>Plan · 1 minute.</b> Write words, not sentences: when, where, who with, what, how you felt.</span></li>
     <li><span><b>A talks · 2 minutes.</b> Use First, Then, After that, Finally.</span></li>
     <li><span><b>B asks two questions · 1 minute.</b> What did you …? Why did you …? How was …?</span></li>
     <li><span><b>Swap.</b> B plans and talks.</span></li>
   </ol>
   <div class="grid g3">
     <button class="btn" type="button" data-t="60">Plan 1:00</button>
     <button class="btn" type="button" data-t="120">Talk 2:00</button>
     <button class="btn" type="button" data-t="60">Questions 1:00</button>
   </div></div></div>`,
   note:'Each set has a different topic for Student A and Student B. Press Next set for new topics. Swap after step 3.'},

 {type:'learn',title:'Check yourself',html:`
   ${who('Everyone','thumbs up or thumbs down')}
   <h2>I can …</h2>
   <div class="check">
     <div><span>say regular and irregular verbs in the past</span><span>👍 / 👎</span></div>
     <div><span>say -ed three ways: t, d, id</span><span>👍 / 👎</span></div>
     <div><span>ask questions with did: Where did you go?</span><span>👍 / 👎</span></div>
     <div><span>answer + one more thing</span><span>👍 / 👎</span></div>
     <div><span>plan in one minute and talk about a past event</span><span>👍 / 👎</span></div>
   </div>
   <p class="lead">Well done! On exam day: use your thinking minute, and look at your partner.</p>`}
];

const SETS=[
 ["Tell me what you did last weekend.","Tell me what you did yesterday."],
 ["Tell me about a special day or celebration.","Tell me about your last birthday."],
 ["Tell me about a day out in London.","Tell me about a trip or a holiday."],
 ["Tell me about your first day at this college.","Tell me about a meal you cooked for other people."]];
let setIdx=0;

let cur=0, st={};
const typeName={learn:'Learn',prac:'Practise',talk:'Talk'};

function dots(){
  $('dots').innerHTML=S.map((s,i)=>`<button class="dot ${i<cur?'done':''} ${i===cur?'now':''}" data-i="${i}" type="button" aria-label="Step ${i+1}: ${esc(s.title)}"></button>`).join('');
  $('dots').querySelectorAll('.dot').forEach(d=>d.addEventListener('click',()=>go(+d.dataset.i)));
}

function render(){
  const s=S[cur];stopTimer();$('timeup').hidden=true;
  $('h-tag').textContent=typeName[s.type];$('h-tag').className='tag '+s.type;$('h-title').textContent=(cur+1)+' / '+S.length+' · '+s.title;
  dots();
  const stage=$('stage');
  if(s.cards){
    const list=s.shuffle?shuffle(s.cards):s.cards.slice();
    st={kind:'cards',list,i:0,shown:false};
    stage.innerHTML=`${who(s.who[0],s.who[1])}<h2>${esc(s.title)}</h2>
      <div class="card"><div class="q" id="cq"></div><div class="a rv off" id="ca"></div></div>
      <p class="count" id="cc"></p>`;
    drawCard();
  } else {
    stage.innerHTML=s.html;st={kind:'html',rv:[...stage.querySelectorAll('.rv.off')]};
    initDrag();initVerbs();
    if(s.talk){
      const showSet=()=>{const [a,b]=SETS[setIdx];$('topicA').textContent=a;$('topicB').textContent=b;$('setno').querySelector('.how').textContent='Set '+(setIdx+1)+' of '+SETS.length;};
      showSet();$('newtopic').addEventListener('click',()=>{setIdx=(setIdx+1)%SETS.length;showSet();});
      stage.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>startTimer(+b.dataset.t)));
    }
  }
  const t=s.timer||s.cardTimer;
  $('clock').hidden=!t;$('tbtn').hidden=!t;if(t){$('clock').textContent=fmt(t);$('clock').className='clock';}
  $('note').hidden=!s.note;
  updateButtons();stage.scrollTop=0;document.querySelector('main').scrollTop=0;fit();
}

/* Drag-and-drop story lines */
function initDrag(){
  const list=$('dragl');if(!list)return;
  const msg=$('chkmsg');
  const clear=()=>{list.querySelectorAll('.dl').forEach(l=>l.classList.remove('ok','bad'));msg.textContent='';};
  list.addEventListener('pointerdown',e=>{
    const li=e.target.closest('.dl');if(!li||e.button>0)return;e.preventDefault();clear();
    const r=li.getBoundingClientRect(),g=li.cloneNode(true);g.classList.add('ghost');
    Object.assign(g.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px'});document.body.appendChild(g);
    li.classList.add('dragging');const dy=e.clientY-r.top,dx=e.clientX-r.left,id=e.pointerId;
    const mv=ev=>{if(ev.pointerId!==id)return;g.style.left=(ev.clientX-dx)+'px';g.style.top=(ev.clientY-dy)+'px';
      const t=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.dl');if(!t||t===li||t.parentElement!==list)return;
      const tr=t.getBoundingClientRect();if(ev.clientY<tr.top+tr.height/2)t.before(li);else t.after(li);};
    const up=ev=>{if(ev.pointerId!==id)return;g.remove();li.classList.remove('dragging');
      window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);};
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  });
  $('chk').addEventListener('click',()=>{const ans=list.dataset.answer;let n=0;
    [...list.children].forEach((l,i)=>{const ok=l.dataset.k===ans[i];if(ok)n++;l.classList.toggle('ok',ok);l.classList.toggle('bad',!ok);});
    msg.textContent=n===ans.length?'Perfect!':n+' of '+ans.length+' are right. Try again.';});
  $('mix').addEventListener('click',()=>{clear();const k=[...list.children];for(let i=k.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[k[i],k[j]]=[k[j],k[i]];}k.forEach(x=>list.appendChild(x));});
}
function initVerbs(){
  const m=$('model');if(!m)return;
  const walk=n=>{[...n.childNodes].forEach(c=>{
    if(c.nodeType===3){const f=document.createDocumentFragment();
      c.textContent.split(/(\s+)/).forEach(t=>{if(!t)return;if(/^\s+$/.test(t)){f.appendChild(document.createTextNode(t));return;}
        const sp=document.createElement('span');sp.className='w';sp.textContent=t;f.appendChild(sp);});
      c.replaceWith(f);}
    else if(c.nodeType===1&&!c.classList.contains('verb'))walk(c);});};
  walk(m);
  const total=m.querySelectorAll('.verb').length;
  m.addEventListener('click',e=>{
    const v=e.target.closest('.verb');
    if(v){v.classList.add('found');}
    else{const w=e.target.closest('.w');if(!w)return;w.classList.remove('miss');void w.offsetWidth;w.classList.add('miss');setTimeout(()=>w.classList.remove('miss'),900);}
    const n=m.querySelectorAll('.verb.found').length;$('vfound').textContent=n;
    $('vmsg').textContent=n===total?' · All found!':'';
  });
}
function sortLines(){const list=$('dragl');if(!list)return;const ans=list.dataset.answer;
  [...ans].forEach(k=>list.appendChild(list.querySelector('[data-k="'+k+'"]')));list.querySelectorAll('.dl').forEach(l=>{l.classList.remove('bad');l.classList.add('ok');});}
/* Fit each step to one screen on wide monitors: start large, shrink until nothing scrolls */
function fit(){
  const m=document.querySelector('main'),st=$('stage');st.style.fontSize='';
  if(window.innerWidth<1000)return;
  let fs=Math.min(window.innerWidth*0.0185,window.innerHeight*0.038,38);
  st.style.fontSize=fs+'px';
  while(m.scrollHeight>m.clientHeight+1&&fs>13){fs-=0.5;st.style.fontSize=fs+'px';}
}
let fitT=0;window.addEventListener('resize',()=>{clearTimeout(fitT);fitT=setTimeout(fit,120);});
function drawCard(){
  const [q,a,n]=st.list[st.i];$('cq').textContent=q;$('ca').textContent=a;$('ca').classList.add('off');st.shown=false;
  $('cc').textContent='Card '+(st.i+1)+' of '+st.list.length;fit();
  const s=S[cur];if(s.cardTimer){$('clock').textContent=fmt(s.cardTimer);$('clock').className='clock';stopTimer();}
  updateButtons();
}
function pending(){return st.kind==='cards'?!st.shown:st.rv.length>0;}
function updateButtons(){
  $('show').disabled=!pending();
  $('show').textContent=st.kind==='cards'?'Show answer':'Show';
  $('back').disabled=cur===0&&!(st.kind==='cards'&&st.i>0);
  const lastCard=st.kind!=='cards'||st.i===st.list.length-1;
  $('next').textContent=st.kind==='cards'&&!lastCard?'Next card →':(cur===S.length-1?'Finish':'Next →');
  $('next').disabled=cur===S.length-1&&lastCard;
}
function show(){
  if(st.kind==='cards'){if(!st.shown){$('ca').classList.remove('off');st.shown=true;stopTimer();}}
  else if(st.rv.length){const el=st.rv.shift();el.classList.remove('off');if(el.dataset.act==='verbs'){$('model').querySelectorAll('.verb').forEach(v=>v.classList.add('found'));$('vfound').textContent=$('model').querySelectorAll('.verb').length;}if(el.dataset.act==='sortlines')sortLines();}
  updateButtons();
}
function next(){
  if(st.kind==='cards'&&st.i<st.list.length-1){st.i++;drawCard();return;}
  if(cur<S.length-1)go(cur+1);
}
function back(){
  if(st.kind==='cards'&&st.i>0){st.i--;drawCard();return;}
  if(cur>0)go(cur-1);
}
function go(i){cur=i;render();}

/* Timer */
let tm=null,end=0,dur=0;
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function startTimer(sec){
  const s=S[cur];dur=sec||s.timer||s.cardTimer;if(!dur)return;stopTimer();
  $('clock').hidden=false;$('clock').className='clock run';$('timeup').hidden=true;end=Date.now()+dur*1000;$('tbtn').textContent='Stop timer';
  tm=setInterval(()=>{const left=(end-Date.now())/1000;$('clock').textContent=fmt(left);
    if(left<=0){clearInterval(tm);tm=null;$('clock').className='clock end';$('tbtn').textContent='Start timer';
      $('timeup').hidden=false;setTimeout(()=>{$('timeup').hidden=true;},3000);}},250);
}
function stopTimer(){if(tm){clearInterval(tm);tm=null;}$('tbtn').textContent='Start timer';if($('clock').classList.contains('run'))$('clock').className='clock';}
$('tbtn').addEventListener('click',()=>{if(tm)stopTimer();else startTimer();});

/* Teacher note: shown in-page, not a dialog */
$('note').addEventListener('click',()=>{
  const ex=$('stage').querySelector('.tnote');if(ex){ex.remove();return;}
  const d=document.createElement('p');d.className='tnote';d.textContent='Teacher: '+S[cur].note;$('stage').appendChild(d);
});

document.addEventListener('click',e=>{const b=e.target.closest('footer button');if(b)setTimeout(()=>b.blur(),0);});
$('show').addEventListener('click',show);
$('next').addEventListener('click',next);
$('back').addEventListener('click',back);
$('retry').addEventListener('click',()=>{stopTimer();render();});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea'))return;
  if(e.key===' '||e.key==='Enter'||e.key==='PageDown'){if(e.target.closest('button')&&e.key!=='PageDown')return;e.preventDefault();pending()?show():next();}
  else if(e.key==='ArrowRight'){e.preventDefault();pending()?show():next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();back();}
  else if(e.key==='t'||e.key==='T'){if(!$('tbtn').hidden)$('tbtn').click();}
});
render();
})();
</script>
