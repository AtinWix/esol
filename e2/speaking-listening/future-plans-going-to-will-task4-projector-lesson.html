<script>const S=[{"tag": "learn", "title": "1 · This morning", "html": "<h2>Morning: finish Task 4, then plans and the future</h2><div class=\"grid g4\"><div class=\"box\"><h3>1</h3>Hangman Paragraphs</div><div class=\"box\"><h3>2</h3>Task 4a: listen twice (worksheet E)</div><div class=\"box\"><h3>3</h3>Task 4b: group discussion (worksheet F)</div><div class=\"box\"><h3>4</h3>going to or will? Vote, then your own plans</div></div><p class=\"muted\">You need: the Exam Practice worksheet (section E and F), the new handout, a pen.</p>", "note": "Learners keep the Tasks 1–4 worksheet from 12 Nov. Hand out the new handout (2 sides) at slide 9, not before. Say: \"Good morning. Last time we did sections A to D of the worksheet. Today we finish sections E and F, then we talk about plans.\""}, {"tag": "learn", "title": "2 · Settle in: Hangman", "html": "<h2>Hangman Paragraphs: guess the letters</h2><p class=\"lead\">Put your hand up and say one letter. When the paragraph is finished, read it with me.</p><p><a class=\"linkbtn\" href=\"https://atinwix.github.io/Hangman-Paragraphs-Game/?p=TmV4dCB3ZWVrZW5kIGlzIGdvaW5nIHRvIGJlIGJ1c3kgZm9yIFRhcmlxLiBPbiBTYXR1cmRheSBtb3JuaW5nIGhlIGlzIGdvaW5nIHRvIHBsYXkgZm9vdGJhbGwgd2l0aCBoaXMgZnJpZW5kcyBpbiBIYWNrbmV5IE1hcnNoZXMuIEluIHRoZSBhZnRlcm5vb24gaGUgaXMgZ29pbmcgdG8gY2xlYW4gaGlzIHJvb20gYmVjYXVzZSBpdCBpcyB2ZXJ5IGRpcnR5LiBPbiBTdW5kYXkgaGUgaXMgbWVldGluZyBoaXMgc2lzdGVyIGF0IERhbHN0b24gSnVuY3Rpb24gYXQgZWxldmVuIG8nY2xvY2suIFRoZXkgYXJlIGdvaW5nIHRvIGhhdmUgbHVuY2ggaW4gYSBUdXJraXNoIHJlc3RhdXJhbnQuIEluIHRoZSBldmVuaW5nIGhlIGlzIGdvaW5nIHRvIHBob25lIGhpcyBtb3RoZXIgaW4gSXN0YW5idWwuIEhlIHRoaW5rcyBzaGUgd2lsbCBiZSB2ZXJ5IGhhcHB5Lg\" target=\"_blank\" rel=\"noopener\">Open Hangman ▶</a></p><div class=\"ex rv\"><b>Check:</b> Who is going to play football? <span class=\"ans\">Tariq</span> · Why is he going to clean his room? <span class=\"ans\">It is very dirty.</span> · When is he meeting his sister? <span class=\"ans\">On Sunday at eleven o'clock, at Dalston Junction.</span></div>", "note": "Open the loaded link. Say: \"While I do the register, look at the board. Put your hand up and say one letter.\" When it is solved: \"Who is going to play football on Saturday?\" \"Why is he going to clean his room?\" \"He is meeting his sister. When? Where?\" \"Look at 'is going to'. What word comes after it?\" (a verb: play, clean, have, phone). Read-aloud text, if you want to read it yourself: https://atinwix.github.io/esol/e2/speaking-listening/future-plans-hangman-paragraph-read-aloud-text.html (do not project that page).", "reveal": true}, {"tag": "learn", "title": "3 · Task 4a: how it works", "html": "<h2>Worksheet, section E: Task 4a</h2><ol class=\"steps\"><li>Read the questions <b>before</b> you listen (one minute).</li><li>First listening: what is it about? Circle <b>A, B or C</b>.</li><li>Second listening: answer the six questions. Short answers are OK.</li><li>Check with your partner.</li></ol>", "note": "Say: \"Today we finish the worksheet. Find section E, Task 4a. I play a recording two times. First listening: what is it about? Circle A, B or C. Second listening: answer the six questions. Short answers are fine. Read the questions now, before you listen.\" Give one minute.", "timer": 60}, {"tag": "prac", "title": "4 · Task 4a: listen twice", "html": "<h2>Task 4a: Free activities at a library</h2><p><a class=\"linkbtn\" href=\"https://atinwix.github.io/esol/e2/speaking-listening/audio/superlatives-task4/index.html\" target=\"_blank\" rel=\"noopener\">Play Script A (audio page) ▶</a></p><div data-step></div><div class=\"grid g2\"><div class=\"box\"><h3>First listening: what is it about?</h3><p class=\"rv ans\">B – free activities at a library</p></div><div class=\"box\"><h3>1. Which days can adults learn about computers?</h3><p class=\"rv ans\">Mondays and Wednesdays</p></div><div class=\"box\"><h3>2. Who is the Tuesday activity for?</h3><p class=\"rv ans\">Children</p></div><div class=\"box\"><h3>3. What should adults take to the computer class?</h3><p class=\"rv ans\">A USB stick</p></div><div class=\"box\"><h3>4. What time does the conversation club begin?</h3><p class=\"rv ans\">Half past six (6.30)</p></div><div class=\"box\"><h3>5. How much do the activities cost?</h3><p class=\"rv ans\">Nothing – they are free</p></div><div class=\"box\"><h3>6. How can you get a place? Give one way.</h3><p class=\"rv ans\">Phone the library OR ask at the front desk</p></div></div>", "note": "Say: \"First listening. What is it about? Circle A, B or C.\" Play Script A once. Say: \"Second listening. Answer the six questions.\" Play it again. Say: \"Compare with your partner.\" (2 minutes) Then click Show answer one question at a time: \"Number one. Which days can adults learn about computers?\" Ask a different learner for each answer and say: \"Say it in a full sentence: 'Adults can learn about computers on Mondays and Wednesdays.'\" Script A is in the day plan if you prefer to read it aloud at natural speed, twice.", "reveal": true}, {"tag": "learn", "title": "5 · Task 4b: how it works", "html": "<h2>Worksheet, section F: Task 4b group discussion</h2><div class=\"grid g3\"><div class=\"box\"><h3>Give your opinion</h3>I think … because …<br>In my opinion, …</div><div class=\"box\"><h3>Agree or disagree</h3>I agree with … because …<br>I'm not sure. Maybe …</div><div class=\"box\"><h3>Bring other people in</h3>What do you think, …?<br>Do you agree, …?<br>Can I add something?</div></div><p class=\"lead\">Groups of three. About three minutes each topic. Everybody speaks at least three times and asks one question.</p>", "note": "Say: \"Task 4b is a group discussion. Three people, one topic. Look at the phrases. Say them after me.\" Read each phrase and let the class repeat. Say: \"Everybody speaks at least three times. Everybody asks one question. Listen to each other.\""}, {"tag": "talk", "title": "6 · Task 4b: discussion", "html": "<h2>Discuss in threes</h2><div class=\"box hl\"><h3>Topic 1</h3><div class=\"big\">What can people do in London in their free time without spending much money?</div></div><div class=\"box hl rv\"><h3>Topic 2 (new groups)</h3><div class=\"big\">What is a good plan for a free weekend in London? Use <b>going to</b> for your plans.</div></div>", "note": "Say: \"Topic one. What can people do in London in their free time without spending much money? Eight minutes. Start.\" Start the timer. Listen and note three good sentences and three mistakes (no names). At the end: \"Stop. Change groups.\" Click Show answer for topic two and say: \"New topic. What is a good plan for a free weekend in London? Use going to for your plans. Eight minutes.\" Start the timer again. Afterwards put the three good sentences and three mistakes on the board and ask the class to correct the mistakes.", "timer": 480, "reveal": true}, {"tag": "learn", "title": "7 · going to or will?", "html": "<h2>Two ways to talk about the future</h2><div class=\"grid g2\"><div class=\"box hl\"><h3>going to</h3><ul class=\"l\"><li><b>A plan</b> you made before now:<br>I'm going to visit my cousin on Saturday.</li><li><b>You can see it now:</b><br>Look at those clouds. It's going to rain.</li></ul></div><div class=\"box\"><h3>will</h3><ul class=\"l\"><li><b>A decision now:</b> The phone is ringing. I'll answer it.</li><li><b>An offer:</b> I'll carry your bag.</li><li><b>A promise:</b> I'll call you tonight.</li><li><b>Your opinion:</b> I think the exam will be easy.</li></ul></div></div><p class=\"muted\">An arranged plan with a time can also use the present continuous: I'm meeting my sister at eleven on Sunday.</p>", "note": "Say: \"There are two main ways to talk about the future. Plans: 'I'm going to visit my cousin on Saturday.' I decided before now. Also, when I can see it now: 'Look at those clouds. It's going to rain.' Decisions now: 'The phone is ringing. I'll answer it.' Offers: 'I'll carry your bag.' Promises: 'I'll call you tonight.' Opinions: 'I think the exam will be easy.'\" Concept checks: \"'I'm going to study nursing.' Plan, or a decision now?\" (plan) \"'I'll help you with your bag.' Plan, or offer?\" (offer) \"'Look at those clouds. It's going to rain.' How do I know?\" (I can see the clouds). Drill the six example sentences chorally, then in pairs."}, {"tag": "prac", "title": "8 · Vote: going to or will?", "html": "<h2>Vote: A going to or B will?</h2><div data-step></div><div class=\"grid g2\"><div><p class=\"lead\">Scan the QR code. Vote <b>A</b> for <b>going to</b> and <b>B</b> for <b>will</b>.</p><span class=\"qrbox\" style=\"display:inline-block;background:#fff;padding:6px;border-radius:10px;line-height:0;width:150px\"><svg width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"segno\"><path transform=\"scale(4)\" class=\"qrline\" stroke=\"#000\" d=\"M2 2.5h7m2 0h1m3 0h5m1 0h5m1 0h3m2 0h7m-37 1h1m5 0h1m2 0h1m7 0h2m1 0h1m2 0h1m1 0h4m1 0h1m5 0h1m-37 1h1m1 0h3m1 0h1m3 0h2m3 0h1m1 0h2m1 0h1m6 0h1m2 0h1m1 0h3m1 0h1m-37 1h1m1 0h3m1 0h1m3 0h3m1 0h2m3 0h1m6 0h2m2 0h1m1 0h3m1 0h1m-37 1h1m1 0h3m1 0h1m2 0h1m1 0h1m2 0h5m2 0h1m1 0h1m2 0h2m2 0h1m1 0h3m1 0h1m-37 1h1m5 0h1m1 0h2m1 0h1m1 0h1m1 0h2m1 0h4m2 0h1m2 0h1m2 0h1m5 0h1m-37 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-28 1h2m3 0h1m1 0h3m1 0h4m2 0h3m-29 1h1m2 0h1m1 0h2m1 0h1m1 0h2m1 0h1m5 0h1m1 0h1m2 0h4m1 0h1m1 0h1m-32 1h1m1 0h2m1 0h1m2 0h2m2 0h1m1 0h2m4 0h1m1 0h1m2 0h2m1 0h4m1 0h1m2 0h1m-36 1h1m2 0h3m2 0h1m1 0h1m1 0h2m1 0h1m2 0h4m1 0h1m3 0h1m1 0h1m1 0h2m1 0h2m-36 1h1m6 0h3m1 0h4m2 0h2m1 0h2m1 0h2m1 0h3m-30 1h1m3 0h1m1 0h1m1 0h3m1 0h2m2 0h2m2 0h2m2 0h2m1 0h1m1 0h2m2 0h1m1 0h2m-36 1h3m1 0h1m5 0h1m1 0h1m2 0h2m1 0h4m1 0h1m5 0h2m2 0h3m-36 1h1m1 0h2m1 0h2m2 0h1m1 0h1m1 0h1m2 0h2m1 0h1m2 0h2m1 0h1m4 0h2m1 0h1m1 0h1m-36 1h1m1 0h1m3 0h1m3 0h1m2 0h1m2 0h3m1 0h1m2 0h2m1 0h1m4 0h1m2 0h1m-36 1h1m1 0h2m2 0h1m1 0h2m2 0h2m3 0h1m1 0h6m2 0h1m1 0h3m1 0h3m-32 1h1m2 0h1m1 0h3m2 0h4m3 0h1m1 0h2m1 0h1m2 0h2m1 0h2m1 0h2m-37 1h5m1 0h3m1 0h1m1 0h1m2 0h2m7 0h1m1 0h1m1 0h4 ing to, B for will. Number one.\" Read each sentence aloud, say \"blank\" for the gap, give 10 seconds, then click Show answer and ask why (reasons: 1 Evidence now: It is going to rain.; 2 A plan: I'm going to see my cousin.; 3 An offer: I'll carry it for you.; 4 A decision now: I'll answer it.; 5 A promise: I'll call you.; 6 A plan: She's going to study.; 7 My opinion: I think … will.; 8 Evidence now: It's going to fall.). Read: 1. \"Look at the sky. It blank rain.\" 2. \"I've got a ticket for Saturday. I blank see my cousin in Manchester.\" 3. \"That bag is heavy. I blank carry it for you.\" 4. \"The phone is ringing. I blank answer it.\" 5. \"I promise I blank call you tonight.\" 6. \"My sister wants to be a nurse. She blank study at college next year.\" 7. \"I think the exam blank be easy.\" 8. \"The glass is on the edge of the table. It blank fall!\" Every sentence can be answered with A or B only.", "reveal": true}, {"tag": "prac", "title": "9 · Handout Task 1: check", "html": "<h2>Handout side 1, Task 1: check</h2><div data-step></div><ol class=\"l\" style=\"margin:0\"><li>Look at that queue! We (will / are going to) be late. <span class=\"rv ans\">→ are going to (evidence now)</span></li><li>A: The bus is late. B: Don't worry. I (will / am going to) give you a lift. <span class=\"rv ans\">→ will (offer)</span></li><li>My brother has saved some money. He (will / is going to) buy a bicycle. <span class=\"rv ans\">→ is going to (plan)</span></li><li>I promise I (will / am going to) bring your book tomorrow. <span class=\"rv ans\">→ will (promise)</span></li><li>I think Hackney (will / is going to) be very busy on Saturday. <span class=\"rv ans\">→ will (opinion)</span></li><li>We have booked a table. We (will / are going to) have dinner in a restaurant. <span class=\"rv ans\">→ are going to (plan)</span></li><li>A: I can't open this jar. B: Give it to me. I (will / am going to) open it. <span class=\"rv ans\">→ will (offer / decision now)</span></li><li>Maria has decided to look for a job. She (will / is going to) start next week. <span class=\"rv ans\">→ is going to (plan)</span></li></ol>", "note": "Say: \"Handout, side 1, Task 1. Circle going to or will. Work alone. Five minutes.\" Then click Show answer one at a time: \"Number one. Which one?\" and ask why (plan, offer, promise, opinion, evidence now). Numbers on the screen are the numbers on the handout.", "timer": 300, "reveal": true}, {"tag": "talk", "title": "10 · Task 2: My plans", "html": "<h2>Task 2: My plans for next weekend</h2><ol class=\"steps\"><li><b>1 minute:</b> write notes (handout side 1, Task 2). Words only.</li><li><b>Partner A talks</b> for one minute.</li><li>Partner B asks <b>two questions</b>: What are you going to …? Are you going to …?</li><li>Change roles.</li></ol><div class=\"ex\">Use: <b>I'm going to …</b> · <b>I'm not going to …</b> · <b>I'm meeting … at … o'clock.</b> · <b>I think … will …</b></div>", "note": "Say: \"Handout side 1, Task 2. You have one minute to plan. Write words only, not sentences.\" Start the 1-minute timer. Then: \"Partner A, talk for one minute: what are you going to do next weekend? Partner B, listen and ask two questions.\" Swap after two minutes: \"Now change.\" If time: two volunteers speak to the class. Listen for going to with be (am, is, are), and the verb after to.", "timer": 60}, {"tag": "learn", "title": "11 · This afternoon", "html": "<h2>PC room: practise, write, listen, speak</h2><div class=\"grid g4\"><div class=\"box\"><h3>1</h3>Online practice: A, B, C</div><div class=\"box\"><h3>2</h3>Write in Teams: yesterday, now, tomorrow</div><div class=\"box\"><h3>3</h3>Task 4a listening</div><div class=\"box\"><h3>4</h3>Referee Interviews, then Kahoot</div></div><p><a class=\"linkbtn\" href=\"https://atinwix.github.io/esol/e2/speaking-listening/future-plans-going-to-will-choose-build-find-interactive-practice.html\" target=\"_blank\" rel=\"noopener\">Online practice</a> <a class=\"linkbtn\" href=\"https://atinwix.github.io/esol/e2/speaking-listening/questions-articles-plurals-referee-interviews-speaking-wheels.html\" target=\"_blank\" rel=\"noopener\">Referee Interviews</a></p>", "note": "Post the Online practice link in Teams General before the lesson, and have the new handout (side 2) ready. Say: \"Log in. Open Teams, then General. Click the link for the online practice.\""}, {"tag": "prac", "title": "12 · Online practice: A, B, C", "html": "<h2>Online practice: going to or will?</h2><p class=\"lead\">Part A: choose <b>going to</b> or <b>will</b> (12). Part B: put the words in order (6). Part C: choose the correct sentence (8).</p><p><a class=\"linkbtn\" href=\"https://atinwix.github.io/esol/e2/speaking-listening/future-plans-going-to-will-choose-build-find-interactive-practice.html\" target=\"_blank\" rel=\"noopener\">Open the practice ▶</a></p><p>Phone version: <span class=\"qrbox\" style=\"display:inline-block;background:#fff;padding:6px;border-radius:10px;line-height:0;width:130px\"><svg width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"segno\"><path transform=\"scale(4)\" class=\"qrline\" stroke=\"#000\" d=\"M2 2.5h7m2 0h1m1 0h1m1 0h5m3 0h1m1 0h2m5 0h2m1 0h1m1 0h2m3 0h1m1 0h7m-49 1h1m5 0h1m2 0h1m2 0h1m1 0h2m3 0h2m1 0h4m1 0h1m1 0h2m5 0h1m1 0h3m1 0h1m5 0h1m-49 1h1m1 0h3m1 0h1m1 0h1m4 0h3m1 0h2m3 0h3m2 0h2m1 0h1m1 0h1m1 0h1m4 0h2m1 0h1m1 0h3m1 0h1m-49 1h1m1 0h3m1 0h1m1 0h4m2 0h1m1 0h1m2 0h1m1 0h2m1 0h3m6 0h5m1 0h1m2 0h1m1 0h3m1 0h1m-49 1h1m1 0h3m1 0h1m1 0h1m3 0h3m2 0h1m3 0h8m1 0h1m5 0h2m4 0h1m1 0h3m1 0h1m-49 1h1m5 0h1m1 0h2m1 0h1m2 0h2m2 0h2m2 0h1m3 0h2m3 0h1m1 0h3m2 0h1m3 0h1m5 0h1m-49 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-41 1h1m1 0h1m1 0h2m4 0h1m3 0h1m3 0h4m2 0h1m4 0h1m-38 1h1m1 0h5m3 0h1m1 0h1m1 0h5m1 0h8m1 0h2m2 0h5m1 0h1m2 0h5m-44 1h2m4 0h1m1 0h1m2 0h1m1 0h4m3 0h3m2 0h4m3 0h1m1 0h1m1 0h1m1 0h2m2 0h2m-47 1h2m4 0h2m2 0h2m1 0h4m2 0h1m1 0h2m1 0h1m1 0h2m1 0h1m1 0h1m2 0h2m2 0h2m1 0h ><li><b>Tomorrow</b> (a plan): Tomorrow I'm going to …</li><li><b>A prediction</b> (your opinion): I think … will …</li><li><b>An offer</b> to a friend: I'll …</li></ol><div class=\"ex rv\">Example: <b>Yesterday I went to the market. Now I'm sitting in the PC room. Tomorrow I'm going to visit my cousin. I think it will be cold at the weekend. I'll help my friend carry her shopping.</b></div>", "note": "Say: \"Handout side 2, Task 3. Write each time word in the correct column: past, now or future.\" Five minutes, then Show answer. Then say: \"Open Teams, General. Write five sentences. One about yesterday. One about now. One plan for tomorrow with going to. One opinion about the weekend with 'I think … will'. One offer to a friend with 'I'll'.\" Start the 15-minute timer. Show the example (Show answer, second click) only if learners are stuck. Check going to has am/is/are before it, and the verb after to has no -s or -ing.", "timer": 900, "reveal": true}, {"tag": "talk", "title": "14 · Share and correct", "html": "<h2>Read one sentence. Which tense is it?</h2><p class=\"lead\">The class says: <b>past</b>, <b>now</b>, <b>plan</b>, <b>opinion</b> or <b>offer</b>.</p>", "note": "Choose four or five posts from Teams and show them on the projector. Say: \"Read one sentence. Class, is it past, now, a plan, an opinion or an offer?\" Correct mistakes on the board, for example 'I going to' to 'I'm going to', 'I'll to help' to 'I'll help'.", "timer": 900}, {"tag": "prac", "title": "15 · Task 4a-style listening", "html": "<h2>Handout side 2, Task 4: A weekend plan</h2><p><a class=\"linkbtn\" href=\"https://atinwix.github.io/esol/e2/speaking-listening/audio/future-plans-listening/index.html\" target=\"_blank\" rel=\"noopener\">Play Script B (audio page) ▶</a></p><div data-step></div><div class=\"grid g2\"><div class=\"box\"><h3>What is it about?</h3><p class=\"rv ans\">A – a plan for Saturday</p></div><div class=\"box\"><h3>1. Where are Joe and Ben going to meet?</h3><p class=\"rv ans\">At Hackney Central station</p></div><div class=\"box\"><h3>2. What time are they going to meet?</h3><p class=\"rv ans\">Ten o'clock</p></div><div class=\"box\"><h3>3. How are they going to get to the park?</h3><p class=\"rv ans\">By bus</p></div><div class=\"box\"><h3>4. What is Joe going to bring?</h3><p class=\"rv ans\">The sandwiches and the drinks</p></div><div class=\"box\"><h3>5. What does Joe ask Marta to bring?</h3><p class=\"rv ans\">Some fruit</p></div><div class=\"box\"><h3>6. When must Marta call Joe back?</h3><p class=\"rv ans\">Before nine o'clock tonight</p></div></div>", "note": "Say: \"Handout side 2, Task 4. Read the questions first. One minute.\" Then: \"First listening. What is it about? Circle A, B or C.\" Play Script B. \"Second listening. Answer the six questions.\" Play it again. Check with Show answer, one at a time. Ask for full sentences: \"They are going to meet at Hackney Central station.\" Script B is in the day plan if you prefer to read it.", "reveal": true, "timer": 60}, {"tag": "talk", "title": "16 · Referee Interviews", "html": "<h2>Referee Interviews: Build, Say, Check</h2><p class=\"lead\">Groups of three: A asks, B answers in full sentences, C is the referee. Change roles every three minutes.</p><p><a class=\"linkbtn\" href=\"https://atinwix.github.io/esol/e2/speaking-listening/questions-articles-plurals-referee-interviews-speaking-wheels.html\" target=\"_blank\" rel=\"noopener\">Open the speaking wheels ▶</a></p><p>Phone version: <span class=\"qrbox\" style=\"display:inline-block;background:#fff;padding:6px;border-radius:10px;line-height:0;width:130px\"><svg width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"segno\"><path transform=\"scale(4)\" class=\"qrline\" stroke=\"#000\" d=\"M2 2.5h7m2 0h6m2 0h1m2 0h2m1 0h2m5 0h2m1 0h1m1 0h2m3 0h1m1 0h7m-49 1h1m5 0h1m4 0h4m5 0h1m1 0h4m1 0h1m1 0h2m5 0h1m1 0h3m1 0h1m5 0h1m-49 1h1m1 0h3m1 0h1m1 0h1m6 0h1m1 0h4m2 0h2m2 0h2m1 0h3m1 0h1m4 0h2m1 0h1m1 0h3m1 0h1m-49 1h1m1 0h3m1 0 (function(){
const $=id=>document.getElementById(id);let i=0,shown=false,left=0,tick=null,noteOn=false;
const TAGS={learn:'Learn',prac:'Practise',talk:'Speak'};
function dots(){$('dots').innerHTML='';S.forEach((s,k)=>{const b=document.createElement('button');b.type='button';b.className='dot'+(k<i?' done':'')+(k===i?' now':'');b.setAttribute('aria-label','Step '+(k+1)+': '+s.title);b.onclick=()=>go(k);$('dots').appendChild(b);});}
function stop(){clearInterval(tick);tick=null;$('clock').classList.remove('run');}
function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0');}
function go(k){i=Math.max(0,Math.min(S.length-1,k));const s=S[i];shown=false;noteOn=false;stop();
 $('h-tag').className='tag '+s.tag;$('h-tag').textContent=TAGS[s.tag];$('h-title').textContent=s.title;
 $('stage').innerHTML=s.html+(s.note?'<div class="tnote" id="tn" hidden><b>Teacher note:</b> '+s.note+'</div>':'');
 $('stage').querySelectorAll('.rv').forEach(e=>e.classList.add('off'));
 $('show').hidden=!s.reveal;$('show').textContent='Show answer';$('note').hidden=!s.note;
 const t=s.timer||0;$('clock').hidden=!t;$('tbtn').hidden=!t;left=t;$('clock').textContent=fmt(t);$('clock').className='clock';$('tbtn').textContent='Start timer';
 $('back').disabled=i===0;$('next').disabled=i===S.length-1;dots();$('stage').parentElement.scrollTop=0;}
function reveal(){const r=[...$('stage').querySelectorAll('.rv.off')];if(!r.length){$('stage').querySelectorAll('.rv').forEach(e=>e.classList.add('off'));$('show').textContent='Show answer';return;}
 const step=$('stage').querySelector('[data-step]')?1:r.length;r.slice(0,step).forEach(e=>e.classList.remove('off'));if(r.length<=step)$('show').textContent='Hide answers';}
function timer(){if(tick){stop();$('tbtn').textContent='Start timer';return;}if(left<=0)left=S[i].timer;$('clock').classList.add('run');$('clock').classList.remove('end');$('tbtn').textContent='Pause';
 tick=setInterval(()=>{left--;$('clock').textContent=fmt(left);if(left<=0){stop();$('clock').classList.add('end');$('tbtn').textContent='Start timer';$('timeup').hidden=false;setTimeout(()=>$('timeup').hidden=true,2500);}},1000);}
$('next').onclick=()=>go(i+1);$('back').onclick=()=>go(i-1);$('show').onclick=reveal;$('tbtn').onclick=timer;
$('note').onclick=()=>{const n=$('tn');if(n)n.hidden=!n.hidden;};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key===' '||e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(i+1);}else if(e.key==='ArrowLeft'||e.key==='PageUp')go(i-1);else if(e.key==='t'||e.key==='T'){if(S[i].timer)timer();}else if(e.key==='a'||e.key==='A'){if(S[i].reveal)reveal();}});
go(0);})();
</script>
</body></html>
