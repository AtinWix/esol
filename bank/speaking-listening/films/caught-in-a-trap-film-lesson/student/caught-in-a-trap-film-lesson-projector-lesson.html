  r:function(){ var l=L(); var o='<div class="model" id="mdl"><b>'+h(l.mtitle)+'</b> <span style="font-size:18px;color:#555">(find the 5 mistakes on your handout, then tap them here)</span><br>'; l.mod.forEach(function(s){ if(s.length===1){ s[0].split(' ').forEach(function(w){ if(w) o+='<span class="wd" onclick="erMiss(this)">'+h(w)+'</span> '; }); } else { o+='<span class="wd" data-r="'+h(s[1])+'" data-w="'+h(s[0])+'" onclick="erTap(this)">'+h(s[0])+'</span> '; } }); o+='</div><div style="margin-top:10px"><span id="erc" style="font-size:26px;font-weight:bold;color:#1e3a6e">Found 0 / '+l.mod.filter(function(s){return s.length>1;}).length+'</span> <button class="btn" onclick="erAll()">Show all corrections</button></div><div style="margin-top:14px;font-size:22px"><b>Then write your own text. Check:</b> '+l.check.map(h).join(' \u00b7 ')+'</div>'; return o; }},
 {t:'Task 5 – Speaking: choose a topic card', look:'Learners: look at the board only. No handout for this task.', note:'Each pair chooses a different card (or give each pair a number). Tap a card to show it big. One minute to plan, then Student A talks for one minute and Student B asks two questions. Swap and choose a new card. At the end, 2 or 3 volunteers repeat their talk to the class.', lvl:true,
  r:function(){ var l=L(); var o='<div style="font-size:21px;color:#555;margin-bottom:8px">Each pair: choose a different card. Plan for 1 minute, talk for 1 minute. Your partner asks 2 questions. Then swap and choose a new card.</div><div id="cards" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">'; l.cards.forEach(function(c,i){ o+='<button class="mb" style="min-height:118px;text-align:left" onclick="cardBig('+i+')"><span style="font-size:30px;font-weight:bold;color:#c0392b">'+(i+1)+'</span> <b style="font-size:24px;color:#1e3a6e">'+h(c[0])+'</b><i style="font-size:19px">'+h(c[1])+'</i></button>'; }); o+='</div><div class="s" style="margin-top:10px"><span class="timer" id="tm">1:00</span><button class="btn" onclick="tStart()">Start</button><button class="btn" onclick="tReset()">Reset</button><button class="btn" onclick="render()">All cards</button><span style="font-size:19px;color:#555;flex:1">'+h(l.extra)+'</span></div>'; return o; }},
 {t:'Kahoot', look:'Learners: look at the board and your phone.', note:'Optional review (20 questions). Before the lesson, import the Kahoot Excel file from the library into your Kahoot account once. Then press Open Kahoot and start it.', r:function(){ return '<div class="kah">Kahoot review quiz<br><span style="font-size:28px;color:#555">Take out your phones. The teacher starts the quiz.</span><br><a class="btn" style="text-decoration:none;display:inline-block;margin-top:24px;font-size:24px" target="_blank" href="https://create.kahoot.it/my-library/kahoots/all">Open Kahoot</a></div>'; }}
];

var MSEL=-1, MDONE=0;
function cardBig(i){ var c=L().cards[i]; document.getElementById('cards').outerHTML='<div id="cards" class="card" style="font-size:44px">'+(i+1)+'. '+h(c[0])+'<div style="font-size:30px;font-weight:normal;margin-top:10px">'+h(c[1])+'</div></div>'; }
function filmBox(){ return '<div id="fb" style="width:700px;height:394px;background:#101a33;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;border-radius:10px;text-align:center">Press a Play button.<br>The film starts here.</div>'; }
function filmPlay(s,e){ var u='https://www.youtube.com/embed/'+D.film+'?autoplay=1&rel=0&modestbranding=1'+(s?'&start='+s:'')+(e?'&end='+e:''); document.getElementById('fb').innerHTML='<iframe width="700" height="394" src="'+u+'" frameborder="0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen style="border-radius:10px"></iframe>'; }
function gTap(i){ var g=D.gist[i], e=document.getElementById('gt'+i); e.classList.remove('sel','ok','bad'); e.classList.add(g[1]?'ok':'bad'); e.textContent=g[0]+(g[1]?'  \u2713 in the film':'  \u2717 not in the film'); }
function wPick(i,v){ var w=D.warmup[i], row=document.getElementById('w'+i), a=document.getElementById('wa'+i);
  if(v===w.a){ row.style.background='#e1f5e6'; a.textContent=' '+w.a+' – '+w.n; a.classList.remove('hid'); row.querySelectorAll('.tf').forEach(function(x){x.disabled=true;}); }
  else { row.style.background='#fde2e0'; setTimeout(function(){ row.style.background=''; },700); } }
function mSel(i){ var e=document.getElementById('mw'+i); if(e.classList.contains('ok')) return; if(MSEL>=0) document.getElementById('mw'+MSEL).classList.remove('sel'); MSEL=i; e.classList.add('sel'); }
function mPick(j){ if(MSEL<0) return; var m=document.getElementById('mm'+j); if(m.classList.contains('ok')) return; var w=document.getElementById('mw'+MSEL);
  if(j===MSEL){ w.classList.remove('sel'); w.classList.add('ok'); m.classList.add('ok'); m.innerHTML=m.innerHTML+'<i>'+h(D.vocab[j].e)+'</i>'; MDONE++; MSEL=-1; document.getElementById('mscore').textContent=MDONE+' / '+D.vocab.length; }
  else { m.classList.add('bad'); setTimeout(function(){ m.classList.remove('bad'); },600); } }
function tlAll(show){ D.timeline.forEach(function(t,i){ var e=document.getElementById('ev'+i); if(e){ if(show) e.classList.remove('hid'); else e.classList.add('hid'); } }); }

var OSEQ=[]; var ORD=[5,2,7,0,6,3,1,4];
function setLevel(c){ LEVEL=c; render(); }
function erCount(){ var t=document.querySelectorAll('#mdl .wd[data-r]'), f=document.querySelectorAll('#mdl .wd.fixed'); var c=document.getElementById('erc'); if(c) c.textContent='Found '+f.length+' / '+t.length; }
function erTap(e){ e.textContent=e.getAttribute('data-r'); e.classList.add('fixed'); erCount(); }
function erMiss(e){ e.classList.add('no'); setTimeout(function(){ e.classList.remove('no'); },500); }
function erAll(){ document.querySelectorAll('#mdl .wd[data-r]').forEach(function(e){ e.textContent=e.getAttribute('data-r'); e.classList.add('fixed'); }); erCount(); }
function oTap(i){ var k=OSEQ.indexOf(i); if(k>=0){ OSEQ.splice(k,1); } else { OSEQ.push(i); } oApply(); }
function oLet(i){ return 'ABCDEFGH'.charAt(ORD.indexOf(i)); }
function oApply(){ for(var j=0;j<D.timeline.length;j++){ var e=document.getElementById('ob'+j); if(!e) continue; var p=OSEQ.indexOf(j); e.textContent = p>=0 ? (p+1) : ''; document.getElementById('oe'+j).classList.toggle('sel', p>=0); }
  var l=document.getElementById('oline'); if(l) l.textContent = OSEQ.length ? 'Order so far: '+OSEQ.map(oLet).join(', ') : ''; }
function oCheck(){ var good=0; for(var j=0;j<D.timeline.length;j++){ var b=document.getElementById('oe'+j); var p=OSEQ.indexOf(j); b.classList.remove('sel','ok','bad'); document.getElementById('oy'+j).textContent=D.timeline[j][0]; if(p===j){ b.classList.add('ok'); good++; } else b.classList.add('bad'); document.getElementById('ob'+j).textContent=(j+1); }
  var cor=[]; for(var k=0;k<D.timeline.length;k++) cor.push(oLet(k)); document.getElementById('oline').textContent='Correct order: '+cor.join(', '); document.getElementById('omsg').textContent = good+' / '+D.timeline.length+' in the right place.'; }
var TM = 60, tid = null;
function tFmt(){ var m=Math.floor(TM/60), s=TM%60; return m+':'+(s<10?'0':'')+s; }
function tStart(){ if(tid) return; tid = setInterval(function(){ TM--; var e=document.getElementById('tm'); if(e) e.textContent=tFmt(); if(TM<=0){ clearInterval(tid); tid=null; } },1000); }
function tReset(){ clearInterval(tid); tid=null; TM=60; var e=document.getElementById('tm'); if(e) e.textContent=tFmt(); }
function render(){
  var s = SL[IDX];
  document.getElementById('title').textContent = (IDX+1)+'. '+s.t;
  document.getElementById('body').innerHTML = s.r();
  if(SL[IDX].order) oApply();
  document.getElementById('look').textContent = s.look;
  document.getElementById('pg').textContent = (IDX+1)+' / '+SL.length;
  document.getElementById('tnote').style.display='none';
  document.getElementById('tnote').textContent = s.note;
  var lv = document.getElementById('lv'); lv.innerHTML='';
  if(IDX>0){ var sp=document.createElement('button'); sp.className='lvtag'; sp.textContent='Level '+LEVEL; sp.title='Change level on page 1'; sp.onclick=function(){ IDX=0; render(); }; lv.appendChild(sp); }
  TM=60; clearInterval(tid); tid=null;
}
function fit(){ var st=document.getElementById('stage'), w=document.getElementById('wrap'); var sc=Math.min(w.clientWidth/1280, w.clientHeight/720); st.style.transform='scale('+sc+')'; }
window.addEventListener('resize', fit); fit();
document.getElementById('next').onclick=function(){ if(IDX<SL.length-1){IDX++;render();} };
document.getElementById('prev').onclick=function(){ if(IDX>0){IDX--;render();} };
document.getElementById('tb').onclick=function(){ var n=document.getElementById('tnote'); n.style.display = n.style.display==='block'?'none':'block'; };
document.addEventListener('keydown', function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown') document.getElementById('next').click();
  else if(e.key==='ArrowLeft'||e.key==='PageUp') document.getElementById('prev').click();
  else if(e.key==='t'||e.key==='T'){ TEACHER=!TEACHER; document.body.classList.toggle('teacher',TEACHER); }
});
render();
</script></body></html>
