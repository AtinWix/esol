*{box-sizing:border-box}html,body{height:100%;margin:0}

.grid{display:grid;gap:.7em}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:.05em;width:1.6em;height:1.6em;border-radius:50%;background:var(--talk);color:var(--surface);display:grid;place-items:center;font:700 .85em var(--display)}
.tw{overflow-x:auto}table.t{border-collapse:collapse;background:var(--surface)}

.linkbtn{display:inline-block;font:700 .9em/1.2 var(--display);padding:.6em 1em;border-radius:12px;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.scale{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.4em}

footer{border-top:1px solid var(--line);background:var(--surface);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.frow{max-width:1500px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fgroup{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:700 .85em/1 var(--display);padding:.75em 1.1em;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:48px}
.btn.ghost{background:transparent;color:var(--accent)}.btn.mark{background:var(--mark);border-color:var(--mark);color:#1b1400}

<script>const S=[{"tag": "learn", "title": "1 · This morning", "look": "Learners look at: the projector.", "html": "<h2>Morning: plans, Task 4 and a mock exam</h2><div class=\"grid g4\"><div class=\"box\"><h3>1</h3>going to or will? Vote on your phone</div><div class=\"box\"><h3>2</h3>Task 2: my plans for next weekend</div><div class=\"box\"><h3>3</h3>Task 4a listening and Task 4b discussion</div><div class=\"box\"><h3>4</h3>Mock exam: Tasks 1–4 in groups of four</div></div><p class=\"muted\">You need: Handout 1 (2 sides), the Exam Practice worksheet (sections E and F), a pen, your phone.</p>", "note": "Say: \"Good morning. Today we practise going to and will, finish the listening and discussion tasks, and then you do a mock exam in groups of four.\" Learners keep the Exam Practice worksheet from the earlier Tasks 1–4 lesson (sections E and F). Hand out Handout 1 at slide 4, not before."}, {"tag": "learn", "title": "2 · going to or will?", "html": "<h2>Two ways to talk about the future</h2><div class=\"grid g2\"><div class=\"box hl\"><h3>going to</h3><ul class=\"l\"><li><b>A plan</b> you made before now:<br>I'm going to visit my cousin on Saturday.</li><li><b>You can see it now:</b><br>Look at those clouds. It's going to rain.</li></ul></div><div class=\"box\"><h3>will</h3><ul class=\"l\"><li><b>A decision now:</b> The phone is ringing. I'll answer it.</li><li><b>An offer:</b> I'll carry your bag.</li><li><b>A promise:</b> I'll call you tonight.</li><li><b>Your opinion:</b> I think the exam will be easy.</li></ul></div></div><p class=\"muted\">An arranged plan with a time can also use the present continuous: I'm meeting my sister at eleven on Sunday.</p>", "note": "Say: \"There are two main ways to talk about the future. Plans: 'I'm going to visit my cousin on Saturday.' I decided before now. Also, when I can see it now: 'Look at those clouds. It's going to rain.' Decisions now: 'The phone is ringing. I'll answer it.' Offers: 'I'll carry your bag.' Promises: 'I'll call you tonight.' Opinions: 'I think the exam will be easy.'\" Concept checks: \"'I'm going to study nursing.' Plan, or a decision now?\" (plan) \"'I'll help you with your bag.' Plan, or offer?\" (offer) \"'Look at those clouds. It's going to rain.' How do I know?\" (I can see the clouds). Drill the six example sentences chorally, then in pairs.", "look": "Learners look at: the projector."}, {"tag": "prac", "title": "3 · Vote: going to or will?", "html": "<h2>Vote A or B: which is better here?</h2><div data-step></div><div class=\"grid g2\"><div><p class=\"lead\">Scan the QR code. Each sentence has two answers, <b>A</b> and <b>B</b>. Vote for the better one.</p><span class=\"qrbox\" style=\"display:inline-block;background:#fff;padding:6px;border-radius:10px;line-height:0;width:150px\"><svg width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"segno\"><path transform=\"scale(4)\" class=\"qrline\" stroke=\"#000\" d=\"M2 2.5h7m1 0h4m2 0h1m1 0h4m1 0h1m1 0h1m2 0h3m1 0h7m-37 1h1m5 0h1m3 0h2m1 0h3m4 0h3m5 0h1m1 0h1m5 0h1m-37 1h1m1 0h3m1 0h1m6 0h1m3 0h5m2 0h1m3 0h1m1 0h1m1 0h3m1 0h1m-37 1h1m1 0h3m1 0h1m1 0h3m1 0h1m1 0h1m1 0h1m1 0h2m2 0h1m2 0h4m1 0h1m1 0h3m1 0h1m-37 1h1m1 0h3m1 0h1m1 0h5m1 0h2m2 0h1m2 0h1m1 0h1m1 0h3m2 0h1m1 0h3m1 0h1m-37 1h1m5 0h1m1 0h2m1 0h4m1 0h1m1 0h2m2 0h1m2 0h2m3 0h1m5 0h1m-37 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-29 1h3m2 0h1m1 0h4m2 0h1m1 0h1m2 0h3m-29 1h1m3 0h1m1 0h3m1 0h1m1 0h1m1 0h2m2 0h6m3 0h1m1 0h5m2 0h1m-37 1h1m4 0h1m3 0h1m3 0h1m2 0h1m2 0h3m1 0h3m1 0h2m2 0h5m-34 1h2m2 0h1m1 0h2m1 0h1m1 0h1m2 0h3m4 0h1m1 0h3m1 0h1m-30 1h5m3 0h5m4 0h2m2 0h1m1 0h2m1 0h2m3 0h2m1 0h2m-33 1h1m1 0h2m1 0h1m1 0h3m2 0h3m1 0h6m2 0h5m2 0h3m-37 1h1m3 0h1m5 0h1m1 0h6m3 0h1m1 0h1m1 0h5m2 0h2m-34 1h1m1 0h5m4 0h2m2 0h1m2 0h1m1 0h1m2 0h1m1 0h1m1 0h1m2 0h5m-33 1h2m1 0h1m1 0h5m1 0h1m2 0h1m2 0h3m2 0h1m2 0h2m2 0h2m1 0h1m1 0h1m-36 1h2m3 0h1m1 0h2m1 0h1m1 0h2m1 0h1m2 0h6m2 0h1m1 0h3m1 0h3m-36 1h1m2 0h1m4 0h6m4 0h3m2 0h1m2 0h2m1 0h1m2 0h4m-33 1h1m1 0h3m1 0h1m1 0h1m2 0h2m5 0h1m1 0h2m2 0h1m3 0h2m1 0h1m-32 1h3m1 0h1m5 0h1m1 0h5m1 0h1m1 0h2m1 0h2m1 0h1m1 0h5m-33 1h2m1 0h2m1 0h1m2 0h3m1 0h9m4 0h3m2 0h1m-35 1h1m2 0h1m1 0h1m2 0h1m2 0h1m1 0h1m1 0h2m1 0h1m3 0h4m1 0h2m2 0h2m-33 1h4m1 0h2m5 0h2m1 0h1m1 0h1m2 0h2m1 0h1m2 0h2m3 0h4m-34 1h1m1 0h1m3 0h5m2 0h9m6 0h4m1 0h3m-37 1h1m2 0h4m3 0h1m1 0h1m1 0h1m3 0h1m1 0h3m1 0h1m1 0h1m2 0h3m1 0h2m1 0h1m-37 1h2m3 0h1m2 0h2m1 0h1m1 0h2m1 0h2m5 0h1m1 0h4m3 0h3m-33 1h2m2 0h4m1 0h2m3 0h1m1 0h1m1 0h1m1 0h2m2 0h7m1 0h1m-23 1h1m4 0h2m2 0h1m1 0h2m2 0h1m3 0h2m1 0h3m-37 1h2m1 0h1m1 0h2m1 0h1m1 0h2m3 0h1m1 0h1m1 0h4m1 0h1m3 0h7m-27 1h1m1 0h2m1 0h6m1 0h1m2 0h1m2 0h3m3 0h1m2 0h1m-36 1h7m1 0h2m2 0h5m1 0h1m2 0h1m1 0h4m1 0h1m1 0h1m1 0h1m-33 1h1m5 0h1m4 0h2m2 0h1m4 0h2m1 0h2m3 0h1m3 0h3m1 0h1m-37 1h1m1 0h3m1 0h1m1 0h1m1 0h2m2 0h3m3 0h2m6 0h7m1 0h1m-37 1h1m1 0h3m1 0h1m2 0h1m1 0h4m3 0h1m2 0h3m2 0h1m1 0h4m1 0h1m2 0h1m-37 1h1m1 0h3m1 0h1m3 0h2m3 0h1m4 0h1m2 0h1m5 0h2m2 0h2m-35 1h1m5 0h1m3 0h1m2 0h1m1 0h4m1 0h2m1 0h1m6 0h1m1 0h1m1 0h2m-36 1h7m1 0h2m1 0h1m2 0h1m2 0h1m2 0h4m3 0h1m1 0h1m1 0h1m2 0h3\"/></svg></span></div><ol class=\"l votab\" style=\"margin:0;font-size:.8em\"><li>Look at the sky. <span class=\"opt\"><b>A</b> It's going to rain.</span> <span class=\"opt\"><b>B</b> It'll rain.</span> <span class=\"rv ans\">→ A going to</span></li><li>I've got a ticket for Saturday. <span class=\"opt\"><b>A</b> I'm going to see my cousin in Manchester.</span> <span class=\"opt\"><b>B</b> I'll see my cousin in Manchester.</span> <span class=\"rv ans\">→ A going to</span></li><li>That bag is heavy. <span class=\"opt\"><b>A</b> I'm going to carry it for you.</span> <span class=\"opt\"><b>B</b> I'll carry it for you.</span> <span class=\"rv ans\">→ B will</span></li><li>The phone is ringing. <span class=\"opt\"><b>A</b> I'm going to answer it.</span> <span class=\"opt\"><b>B</b> I'll answer it.</span> <span class=\"rv ans\">→ B will</span></li><li>\"Can you call me tonight?\" <span class=\"opt\"><b>A</b> \"Yes, I promise I'm going to call you.\"</span> <span class=\"opt\"><b>B</b> \"Yes, I promise I'll call you.\"</span> <span class=\"rv ans\">→ B will</span></li><li>My sister wants to be a nurse. She has a place. <span class=\"opt\"><b>A</b> She's going to study at college next year.</span> <span class=\"opt\"><b>B</b> She'll study at college next year.</span> <span class=\"rv ans\">→ A going to</span></li><li>\"I'm thirsty.\" <span class=\"opt\"><b>A</b> \"I'm going to get you some water.\"</span> <span class=\"opt\"><b>B</b> \"I'll get you some water.\"</span> <span class=\"rv ans\">→ B will</span></li><li>The glass is on the edge of the table. <span class=\"opt\"><b>A</b> It's going to fall!</span> <span class=\"opt\"><b>B</b> It'll fall!</span> <span class=\"rv ans\">→ A going to</span></li></ol></div>", "note": "Learners scan the QR code (Vote Card, A / B). Say: \"Scan the code. Each sentence has two answers, A and B. Which is better? Number one.\" Read the first words and both answers aloud, give 10 seconds, then click Show answer and ask why (reasons: 1 Evidence now: It is going to rain.; 2 A plan: I'm going to see my cousin.; 3 An offer: I'll carry it for you.; 4 A decision now: I'll answer it.; 5 A promise: I'll call you.; 6 A plan: She's going to study.; 7 An offer: I'll get you some water.; 8 Evidence now: It's going to fall.). Every sentence shows its two answers, A and B, on the slide.", "reveal": true, "look": "Learners look at: the projector and their phones (Vote Card)."}, {"tag": "prac", "title": "4 · Handout 1, Task 1: check", "html": "<h2>Handout 1, side 1, Task 1: check</h2><div data-step></div><ol class=\"l\" style=\"margin:0\"><li>Look at that queue! We (will / are going to) be late. <span class=\"rv ans\">→ are going to (evidence now)</span></li><li>A: The bus is late. B: Don't worry. I (will / am going to) give you a lift. <span class=\"rv ans\">→ will (offer)</span></li><li>My brother has saved some money. He (will / is going to) buy a bicycle. <span class=\"rv ans\">→ is going to (plan)</span></li><li>I promise I (will / am going to) bring your book tomorrow. <span class=\"rv ans\">→ will (promise)</span></li><li>I think Hackney (will / is going to) be very busy on Saturday. <span class=\"rv ans\">→ will (opinion)</span></li><li>We have booked a table. We (will / are going to) have dinner in a restaurant. <span class=\"rv ans\">→ are going to (plan)</span></li><li>A: I can't open this jar. B: Give it to me. I (will / am going to) open it. <span class=\"rv ans\">→ will (offer / decision now)</span></li><li>Maria has decided to look for a job. She (will / is going to) start next week. <span class=\"rv ans\">→ is going to (plan)</span></li></ol>", "note": "Say: \"Handout, side 1, Task 1. Circle going to or will. Work alone. Five minutes.\" Then click Show answer one at a time: \"Number one. Which one?\" and ask why (plan, offer, promise, opinion, evidence now). Numbers on the screen are the numbers on the handout.", "timer": 300, "reveal": true, "look": "Learners look at: Handout 1, side 1, Task 1."}, {"tag": "talk", "title": "5 · Task 2: My plans", "html": "<h2>Task 2: My plans for next weekend</h2><ol class=\"steps\"><li><b>1 minute:</b> write notes (handout side 1, Task 2). Words only.</li><li><b>Partner A talks</b> for one minute.</li><li>Partner B asks <b>two questions</b>: What are you going to …? Are you going to …?</li><li>Change roles.</li></ol><div class=\"ex\">Use: <b>I'm going to …</b> · <b>I'm not going to …</b> · <b>I'm meeting … at … o'clock.</b> · <b>I think … will …</b></div>", "note": "Say: \"Handout 1, side 1, Task 2. You have one minute to plan. Write words only, not sentences.\" Start the 1-minute timer. Then: \"Partner A, talk for one minute: what are you going to do next weekend? Partner B, listen and ask two questions.\" Swap after two minutes: \"Now change.\" If time: two volunteers speak to the class. Listen for going to with be (am, is, are), and the verb after to.", "timer": 60, "look": "Learners look at: Handout 1, side 1, Task 2, then their partner."}, {"tag": "learn", "title": "6 · Task 4a: how it works", "html": "<h2>Worksheet, section E: Task 4a</h2><ol class=\"steps\"><li>Read the questions <b>before</b> you listen (one minute).</li><li>First listening: what is it about? Circle <b>A, B or C</b>.</li><li>Second listening: answer the six questions. Short answers are OK.</li><li>Check with your partner.</li></ol>", "note": "Say: \"Today we finish the worksheet. Find section E, Task 4a. I play a recording two times. First listening: what is it about? Circle A, B or C. Second listening: answer the six questions. Short answers are fine. Read the questions now, before you listen.\" Give one minute.", "timer": 60, "look": "Learners look at: the worksheet, section E."}, {"tag": "prac", "title": "7 · Task 4a: listen twice", "html": "<h2>Task 4a: Free activities at a library</h2><p><a class=\"linkbtn\" href=\"https://atinwix.github.io/esol/e2/speaking-listening/audio/superlatives-task4/index.html\" target=\"_blank\" rel=\"noopener\">Play Script A (audio page) ▶</a></p><div data-step></div><div class=\"grid g2\"><div class=\"box\"><h3>First listening: what is it about?</h3><p class=\"rv ans\">B – free activities at a library</p></div><div class=\"box\"><h3>1. Which days can adults learn about computers?</h3><p class=\"rv ans\">Mondays and Wednesdays</p></div><div class=\"box\"><h3>2. Who is the Tuesday activity for?</h3><p class=\"rv ans\">Children</p></div><div class=\"box\"><h3>3. What should adults take to the computer class?</h3><p class=\"rv ans\">A USB stick</p></div><div class=\"box\"><h3>4. What time does the conversation club begin?</h3><p class=\"rv ans\">Half past six (6.30)</p></div><div class=\"box\"><h3>5. How much do the activities cost?</h3><p class=\"rv ans\">Nothing – they are free</p></div><div class=\"box\"><h3>6. How can you get a place? Give one way.</h3><p class=\"rv ans\">Phone the library OR ask at the front desk</p></div></div>", "note": "Say: \"First listening. What is it about? Circle A, B or C.\" Play Script A once. Say: \"Second listening. Answer the six questions.\" Play it again. Say: \"Compare with your partner.\" (2 minutes) Then click Show answer one question at a time: \"Number one. Which days can adults learn about computers?\" Ask a different learner for each answer and say: \"Say it in a full sentence: 'Adults can learn about computers on Mondays and Wednesdays.'\" Script A is in the day plan if you prefer to read it aloud at natural speed, twice.", "reveal": true, "look": "Learners look at: the worksheet, section E; the teacher plays the audio."}, {"tag": "learn", "title": "8 · Task 4b: how it works", "html": "<h2>Worksheet, section F: Task 4b group discussion</h2><div class=\"grid g3\"><div class=\"box\"><h3>Give your opinion</h3>I think … because …<br>In my opinion, …</div><div class=\"box\"><h3>Agree or disagree</h3>I agree with … because …<br>I'm not sure. Maybe …</div><div class=\"box\"><h3>Bring other people in</h3>What do you think, …?<br>Do you agree, …?<br>Can I add something?</div></div><p class=\"lead\">Groups of three. About three minutes each topic. Everybody speaks at least three times and asks one question.</p>", "note": "Say: \"Task 4b is a group discussion. Three people, one topic. Look at the phrases. Say them after me.\" Read each phrase and let the class repeat. Say: \"Everybody speaks at least three times. Everybody asks one question. Listen to each other.\"", "look": "Learners look at: the worksheet, section F."}, {"tag": "talk", "title": "9 · Task 4b: discussion", "html": "<h2>Discuss in threes</h2><div class=\"box hl\"><h3>Topic 1</h3><div class=\"big\">What can people do in London in their free time without spending much money?</div></div><div class=\"box hl rv\"><h3>Topic 2 (new groups)</h3><div class=\"big\">What is a good plan for a free weekend in London? Use <b>going to</b> for your plans.</div></div>", "note": "Say: \"Topic one. What can people do in London in their free time without spending much money? Eight minutes. Start.\" Start the timer. Listen and note three good sentences and three mistakes (no names). At the end: \"Stop. Change groups.\" Click Show answer for topic two and say: \"New topic. What is a good plan for a free weekend in London? Use going to for your plans. Eight minutes.\" Start the timer again. Afterwards put the three good sentences and three mistakes on the board and ask the class to correct the mistakes. Do Topic 1 only unless there is time; if short of time, go straight to slide 10.", "timer": 480, "reveal": true, "look": "Learners look at: their group."}, {"tag": "learn", "title": "10 · The mock exam: how it works", "look": "Learners look at: the projector, then Handout 2 and Handout 3.", "html": "<h2>Mock exam: four tasks, four jobs</h2><div class=\"grid g4\"><div class=\"box hl\"><h3>Task 1 · 3 min</h3>Questions about you</div><div class=\"box hl\"><h3>Task 2 · 6 min</h3>One-minute talk, then two questions</div><div class=\"box hl\"><h3>Task 3 · 4 min</h3>Two pictures: see, compare, prefer</div><div class=\"box hl\"><h3>Task 4 · 6 min</h3>Listen twice, then discuss</div></div><div class=\"grid g4\"><div class=\"box\"><h3>Candidate 1</h3>Does the tasks</div><div class=\"box\"><h3>Candidate 2</h3>Does the tasks</div><div class=\"box\"><h3>Assessor</h3>Reads the card, keeps time</div><div class=\"box\"><h3>Observer</h3>Ticks Handout 2</div></div><p class=\"muted\">If you need help: <b>Sorry, can you say that again, please?</b> · <b>Sorry, what does … mean?</b> · <b>I don't know the word, but …</b></p>", "note": "Say: \"In the real exam you speak to a partner and an assessor. Today you are in groups of four: two candidates, an assessor and an observer. In the afternoon you swap.\" Say the three help phrases and let the class repeat. Give each group of four one Handout 3 (assessor's card, Set A side) and each learner Handout 2. Tip for each task: Task 1, a full sentence plus one more thing. Task 2, notes in words, not sentences. Task 3, say what you see, compare, then choose. Task 4, listen for the main idea first."}, {"tag": "talk", "title": "11 · Task 3 pictures: round one", "look": "Learners look at: the projector (the assessor tells the candidate which pair).", "html": "<h2>Task 3 pictures</h2><div class=\"grid g2\"><div class=\"box\"><h3>Pair 1</h3><div class=\"grid g2\"><figure style=\"margin:0\"><div style=\"border:2px solid var(--line);border-radius:10px;overflow:hidden\"><svg viewBox=\"0 0 400 260\" role=\"img\" aria-label=\"A quiet park with trees, a bench and two people\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"400\" height=\"260\" fill=\"#bfe3f5\" rx=\"0\"/><circle cx=\"330\" cy=\"45\" r=\"22\" fill=\"#ffd23f\"/><circle cx=\"90\" cy=\"40\" r=\"14\" fill=\"#fff\"/><circle cx=\"106\" cy=\"44\" r=\"12\" fill=\"#fff\"/><circle cx=\"76\" cy=\"45\" r=\"11\" fill=\"#fff\"/><rect x=\"0\" y=\"150\" width=\"400\" height=\"110\" fill=\"#7cc576\" rx=\"0\"/><rect x=\"55.2\" y=\"134.0\" width=\"9.6\" height=\"36.0\" fill=\"#7a4b25\" rx=\"0\"/><circle cx=\"60\" cy=\"116.0\" r=\"28.799999999999997\" fill=\"#2e8b4f\"/><circle cx=\"43.2\" cy=\"131.6\" r=\"18.0\" fill=\"#37a05c\"/><rect x=\"325.6\" y=\"142.0\" width=\"8.8\" height=\"33.0\" fill=\"#7a4b25\" rx=\"0\"/><circle cx=\"330\" cy=\"125.5\" r=\"26.400000000000002\" fill=\"#2e8b4f\"/><circle cx=\"314.6\" cy=\"139.8\" r=\"16.5\" fill=\"#37a05c\"/><circle cx=\"140\" cy=\"160\" r=\"14\" fill=\"#2f8f4e\"/><circle cx=\"154\" cy=\"163\" r=\"11\" fill=\"#3aa35b\"/><rect x=\"170\" y=\"175\" width=\"50\" height=\"6\" fill=\"#7a4b25\" rx=\"0\"/><rect x=\"174\" y=\"181\" width=\"5\" height=\"14\" fill=\"#5b3a1c\" rx=\"0\"/><rect x=\"211\" y=\"181\" width=\"5\" height=\"14\" fill=\"#5b3a1c\" rx=\"0\"/><rect x=\"170\" y=\"161\" width=\"50\" height=\"5\" fill=\"#7a4b25\" rx=\"0\"/><circle cx=\"190\" cy=\"134\" r=\"7\" fill=\"#e0b48a\"/><rect x=\"183\" y=\"141\" width=\"14\ d one target.</li></ol><p class=\"muted\">About 20 minutes for the tasks, then 5 minutes for feedback.</p>", "note": "Say: \"Round one. Groups of four. Assessor, you read only what is on the card.\" Start the 30-minute timer. Circulate; do not interrupt. Note about eight language errors (no names) for slide 13. Join a group for Task 4 if the assessor is not a confident reader and read the texts yourself."}, {"tag": "learn", "title": "13 · Feedback and exam day", "look": "Learners look at: the projector, then their observer sheet.", "reveal": true, "html": "<h2>Feedback: where do we need more practice?</h2><div class=\"grid g2\"><div class=\"box\"><h3>Your observer sheet</h3><p>Which task has the fewest ticks? Put your hand up: Task 1? Task 2? Task 3? Task 4?</p></div><div class=\"box\"><h3>On exam day</h3><ul class=\"l\"><li>Listen carefully to the assessor.</li><li>You can ask: <b>Can you say that again, please?</b></li><li>Speak to your partner as well as the assessor.</li><li>Write notes, not sentences, in your planning minute.</li></ul></div></div><div class=\"ex rv\">Task 4: read the options first, listen for the main idea, then listen again for the detail.</div>", "note": "Say: \"Look at your observer sheet. Which task had the fewest ticks?\" Take a show of hands for each task. Board eight sentences you noted, without names; pairs correct them; check together. Reteach the weakest task for five minutes with the tip on the slide (Show answer) and one quick round in pairs. Then: \"On exam day you can ask the assessor to repeat. Speak to your partner as well.\""}];

(function(){
const $=id=>document.getElementById(id);let i=0,shown=false,left=0,tick=null,noteOn=false;
const TAGS={learn:'Learn',prac:'Practise',talk:'Speak'};
function dots(){$('dots').innerHTML='';S.forEach((s,k)=>{const b=document.createElement('button');b.type='button';b.className='dot'+(k<i?' done':'')+(k===i?' now':'');b.setAttribute('aria-label','Step '+(k+1)+': '+s.title);b.onclick=()=>go(k);$('dots').appendChild(b);});}
function stop(){clearInterval(tick);tick=null;$('clock').classList.remove('run');}
function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0');}
function go(k){i=Math.max(0,Math.min(S.length-1,k));const s=S[i];shown=false;noteOn=false;stop();
 $('h-tag').className='tag '+s.tag;$('h-tag').textContent=TAGS[s.tag];$('h-title').textContent=s.title;
 $('stage').innerHTML=s.html+(s.look?'<div class="look9">'+s.look+'</div>':'')+(s.note?'<div class="tnote" id="tn" hidden><b>Teacher note:</b> '+s.note+'</div>':'');
 $('stage').querySelectorAll('.rv').forEach(e=>e.classList.add('off'));
 $('show').hidden=!s.reveal;$('show').textContent='Show answer';$('note').hidden=!s.note;
 const t=s.timer||0;$('clock').hidden=!t;$('tbtn').hidden=!t;left=t;$('clock').textContent=fmt(t);$('clock').className='clock';$('tbtn').textContent='Start timer';
 $('back').disabled=i===0;$('next').disabled=i===S.length-1;dots();$('stage').parentElement.scrollTop=0;}
function reveal(){const r=[...$('stage').querySelectorAll('.rv.off')];if(!r.length){$('stage').querySelectorAll('.rv').forEach(e=>e.classList.add('off'));$('show').textContent='Show answer';return;}
 const step=$('stage').querySelector('[data-step]')?1:r.length;r.slice(0,step).forEach(e=>e.classList.remove('off'));if(r.length<=step)$('show').textContent='Hide answers';}
function timer(){if(tick){stop();$('tbtn').textContent='Start timer';return;}if(left<=0)left=S[i].timer;$('clock').classList.add('run');$('clock').classList.remove('end');$('tbtn').textContent='Pause';
 tick=setInterval(()=>{left--;$('clock').textContent=fmt(left);if(left<=0){stop();$('clock').classList.add('end');$('tbtn').textContent='Start timer';$('timeup').hidden=false;setTimeout(()=>$('timeup').hidden=true,2500);}},1000);}
$('next').onclick=()=>go(i+1);$('back').onclick=()=>go(i-1);$('show').onclick=reveal;$('tbtn').onclick=timer;
$('note').onclick=()=>{const n=$('tn');if(n)n.hidden=!n.hidden;};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key===' '||e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(i+1);}else if(e.key==='ArrowLeft'||e.key==='PageUp')go(i-1);else if(e.key==='t'||e.key==='T'){if(S[i].timer)timer();}else if(e.key==='a'||e.key==='A'){if(S[i].reveal)reveal();}});
go(0);})();
</script>
