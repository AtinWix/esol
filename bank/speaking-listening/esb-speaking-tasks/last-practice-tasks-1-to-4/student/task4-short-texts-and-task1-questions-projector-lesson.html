<script>
const S=[{"tag": "learn", "title": "Today", "html": "<h2>Task 4 and Task 1</h2><p class=\"lead\">Today we <b>listen</b> to short texts and answer questions. Then we practise the <b>Task 1 questions</b>.</p><ol class=\"flow\"><li>Task 4: eight short texts (two sets of four)</li><li>Task 1: which question?</li><li>Spell it. Say the number.</li><li>Task 1: ask and answer with a friend</li><li>Kahoot</li></ol>", "look": "Learners look at the projector.", "note": "Say: “Good morning. Today we practise Task 4: you listen and answer questions. We also practise the questions in Task 1. This afternoon is the last practice in the PC room.” Point to each step on the screen. No handouts today.", "timer": 0, "steps": null, "reveal": false}, {"tag": "prac", "title": "Task 4: four short texts (1)", "html": "<p class=\"lead t4i\">Listen twice. <b>First time:</b> yes or no. <b>Second time:</b> one thing. Tell your partner.</p><div class=\"t4\"><div class=\"r\"><div class=\"pl\"><span class=\"num\">1</span><div class=\"player\"><span class=\"slab\">College</span><button class=\"btn play\" type=\"button\" data-play=\"script-b\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div></div><div class=\"qq\"><b>Yes or no?</b>Is Hana a new student?<span class=\"rv ans\">Yes, she is.</span></div><div class=\"qq\"><b>One thing</b>Which room is her class in?<span class=\"rv ans\">Room 6.</span></div></div><div class=\"r\"><div class=\"pl\"><span class=\"num\">2</span><div class=\"player\"><span class=\"slab\">Doctor</span><button class=\"btn play\" type=\"button\" data-play=\"script-c\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div></div><div class=\"qq\"><b>Yes or no?</b>Does the man have a headache?<span class=\"rv ans\">No, he doesn’t (he has a cough).</span></div><div class=\"qq\"><b>One thing</b>How many times a day is the medicine?<span class=\"rv ans\">Two times a day.</span></div></div><div class=\"r\"><div class=\"pl\"><span class=\"num\">3</span><div class=\"player\"><span class=\"slab\">Market</span><button class=\"btn play\" type=\"button\" data-play=\"script-e\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div></div><div class=\"qq\"><b>Yes or no?</b>Is Sara going to college?<span class=\"rv ans\">No, she isn’t.</span></div><div class=\"qq\"><b>One thing</b>What does Sara want to buy?<span class=\"rv ans\">Fish and rice.</span></div></div><div class=\"r\"><div class=\"pl\"><span class=\"num\">4</span><div class=\"player\"><span class=\"slab\">Home</span><button class=\"btn play\" type=\"button\" data-play=\"script-f\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div></div><div class=\"qq\"><b>Yes or no?</b>Does he live in a big house?<span class=\"rv ans\">No, he doesn’t (a small flat).</span></div><div class=\"qq\"><b>One thing</b>Who does he live with?<span class=\"rv ans\">His brother.</span></div></div></div>", "look": "Learners look at the projector and listen. Notebook for notes.", "note": "Say: “Listen to the first text. Listen for yes or no.” Press Play. The track plays twice with a short gap. First time: the class listens for the yes/no answer. Second time: listen for one thing. Say: “Tell your partner your two answers.” Do all four texts one after another, then press Show answer once for each answer (eight clicks). Ask for full sentences: “Yes, she is.” “Her class is in Room 6.” If a text is too hard, press Show answer, then play it again. Texts: 1 College (Hana, Room 6, upstairs), 2 Doctor (cough, medicine two times a day), 3 Market (Sara is going to the market, fish and rice), 4 Home (a small flat, lives with his brother).", "timer": 0, "steps": null, "reveal": true}, {"tag": "prac", "title": "Task 4: four short texts (2)", "html": "<p class=\"lead t4i\">Listen twice. <b>First time:</b> yes or no. <b>Second time:</b> one thing. Tell your partner.</p><div class=\"t4\"><div class=\"r\"><div class=\"pl\"><span class=\"num\">1</span><div class=\"player\"><span class=\"slab\">Shop</span><button class=\"btn play\" type=\"button\" data-play=\"script-h\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div></div><div class=\"qq\"><b>Yes or no?</b>Does the shop have milk?<span class=\"rv ans\">Yes, it does.</span></div><div class=\"qq\"><b>One thing</b>How much is the milk?<span class=\"rv ans\">£1.20 (one pound twenty).</span></div></div><div class=\"r\"><div class=\"pl\"><span class=\"num\">2</span><div class=\"player\"><span class=\"slab\">Bus stop</span><button class=\"btn play\" type=\"button\" data-play=\"script-i\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div></div><div class=\"qq\"><b>Yes or no?</b>Is this the bus to the station?<span class=\"rv ans\">No, it isn’t.</span></div><div class=\"qq\"><b>One thing</b>Which bus goes to the station?<span class=\"rv ans\">The number twelve.</span></div></div><div class=\"r\"><div class=\"pl\"><span class=\"num\">3</span><div class=\"player\"><span class=\"slab\">College message</span><button class=\"btn play\" type=\"button\" data-play=\"script-j\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div></div><div class=\"qq\"><b>Yes or no?</b>Is the English class in Room six?<span class=\"rv ans\">No, it isn’t (Room eight).</span></div><div class=\"qq\"><b>One thing</b>What time does the class start?<span class=\"rv ans\">Ten o’clock.</span></div></div><div class=\"r\"><div class=\"pl\"><span class=\"num\">4</span><div class=\"player\"><span class=\"slab\">Picnic message</span><button class=\"btn play\" type=\"button\" data-play=\"script-g\">▶ Play twice</button><span class=\"pstat\" aria-live=\"polite\"></span></div></div><div class=\"qq\"><b>Yes or no?</b>Is the picnic on Saturday?<span class=\"rv ans\">No, it isn’t (Sunday).</span></div><div class=\"qq\"><b>One thing</b>Where do they meet?<span class=\"rv ans\">At the park.</span></div></div></div>", "look": "Learners look at the projector and listen. Notebook for notes.", "note": "Say: “Four more texts. Same steps. First time yes or no. Second time one thing.” Play each text, let pairs compare, then press Show answer. After the eighth answer ask: “Which text was the hardest? Why?” Texts: 1 Shop (milk, £1.20), 2 Bus stop (the number twelve), 3 College message (Room eight, ten o’clock, bring a pen), 4 Picnic message (Sunday, the park, twelve o’clock). If short of time, do texts 2 and 3 only.", "timer": 0, "steps": null, "reveal": true}, {"tag": "prac", "title": "Task 1: which question?", "html": "<p class=\"lead t4i\">Read the answer. Say the question to your partner. Then check.</p><div class=\"t4b\"><div class=\"r2\"><div class=\"aa\">“My sister and my brother.”</div><div class=\"qq2 rv\">Who do you live with?</div></div><div class=\"r2\"><div class=\"aa\">“In Hackney.”</div><div class=\"qq2 rv\">Where do you live?</div></div><div class=\"r2\"><div class=\"aa\">“It’s K-H-A-N.”</div><div class=\"qq2 rv\">How do you spell your name?</div></div><div class=\"r2\"><div class=\"aa\">“At seven o’clock.”</div><div class=\"qq2 rv\">What time do you get up? <small>(or: When do you get up?)</small></div></div><div class=\"r2\"><div class=\"aa\">“I’m a cleaner.”</div><div class=\"qq2 rv\">What do you do?</div></div><div class=\"r2\"><div class=\"aa\">“Yes, I do. I like tea.”</div><div class=\"qq2 rv\">Do you like tea?</div></div><div class=\"r2\"><div class=\"aa\">“It’s 07700 900461.”</div><div class=\"qq2 rv\">What’s your phone number?</div></div><div class=\"r2\"><div class=\"aa\">“Two sisters.”</div><div class=\"qq2 rv\">How many sisters do you have?</div></div></div>", "look": "Learners look at the projector; pairs say the questions aloud.", "note": "Say: “In Task 1 the assessor asks you questions. Look at the answer. What is the question? Say it to your partner.” Give pairs about 30 seconds for the first two, then press Show answer for each one, one click at a time. Class says ea div><h2>Task 1: answer the teacher</h2><p class=\"lead\">The teacher asks you. Answer with one full sentence.</p><div class=\"stepq\" id=\"stepq\"></div><div class=\"stepa rv\" id=\"stepa\"></div></div><div class=\"side\"><div class=\"ex\"><p><b>Not clear? Say:</b></p><p>Sorry, can you repeat that, please?</p></div></div></div>", "look": "Learners look at the projector and answer the teacher.", "note": "You are the assessor, as in the exam. The screen shows the questions from the last slide, one at a time. Ask the question to one learner by name; they answer with one full sentence about themselves. Ask two or three learners each question, then press Show answer for an example answer and Next sentence for the next question. Once or twice, ask very fast so that a learner uses: “Sorry, can you repeat that, please?” Listen for the verb after I (I live, I get up, I have).", "timer": 660, "steps": [{"q": "Where do you live?", "a": "I live in Hackney."}, {"q": "Who do you live with?", "a": "I live with my family."}, {"q": "How do you spell your name?", "a": "K-H-A-N."}, {"q": "What’s your phone number?", "a": "It’s 07700 900461."}, {"q": "What time do you get up?", "a": "I get up at seven o’clock."}, {"q": "What do you do?", "a": "I’m a cleaner. <small>(or: I don’t work.)</small>"}, {"q": "Do you like football?", "a": "Yes, I do. <small>(or: No, I don’t.)</small>"}, {"q": "How many sisters do you have?", "a": "I have two sisters."}], "reveal": true}, {"tag": "prac", "title": "Kahoot", "html": "<div class=\"split\"><div><h2>Kahoot: 20 questions</h2><p class=\"lead\">Places · the texts · Task 1 questions · Task 4 steps</p><p class=\"lead\">Go to <b>kahoot.it</b> on your phone. Type the PIN.</p></div><div class=\"side\"><div class=\"ex\"><p><b>Teacher:</b> open the Kahoot and press Start.</p></div></div></div>", "look": "Learners look at the projector and use their phones.", "note": "Open the Kahoot (already in your Kahoot library) and start Classic. Say: “Take out your phone const AUD={"script-a": "One. Your class is in Room 6. Two. What is the problem? Three. How much are the apples? Four. Dinner is ready. Five. Take this medicine. Six. Two kilos of rice, please. Seven. Open your books. Eight. Sit on the sofa.", "script-b": "Hello. Are you a new student? Yes, I am. My name is Hana. Welcome, Hana. Your class is in Room 6. Thank you. Is it upstairs? Yes, it is.", "script-c": "Good morning. What is the problem? I have a bad cough. Take this medicine two times a day. Thank you, doctor.", "script-d": "Number one. K, H, A, N. Khan. Number two. G, R, A, C, E. Grace. Number three. My phone number is oh seven seven double oh, nine double oh, four six one.", "script-e": "Hi Sara. Where are you going? I'm going to the market. What do you want to buy? Fish and rice.", "script-f": "I live in a small flat. I live with my brother. He is a bus driver. On Sunday we cook together. I like Sunday.", "script-g": "Hello, Sam. This is Anna. The picnic is on Sunday. We meet at the park at twelve o'clock. Bring some food and a drink. See you there!", "script-h": "Excuse me. Do you have milk? Yes, we do. It's by the door. How much is it? It's one pound twenty. Thank you.", "script-i": "Excuse me. Is this the bus to the station? No, it isn't. This is the bus to the market. Which bus goes to the station? The number twelve. Thank you.", "script-j": "Hello, this is Hackney College. Your English class is in Room eight. It starts at ten o'clock. Please bring a pen. Thank you."}, AUDL={"script-a": [["Ann", "One. Your class is in Room 6."], ["Ben", "Two. What is the problem?"], ["Ann", "Three. How much are the apples?"], ["Ben", "Four. Dinner is ready."], ["Ann", "Five. Take this medicine."], ["Ben", "Six. Two kilos of rice, please."], ["Ann", "Seven. Open your books."], ["Ben", "Eight. Sit on the sofa."]], "script-b": [["Ann", "Hello. Are you a new student?"], ["Ben", "Yes, I am. My name is Hana."], ["Ann", "Welcome, Hana. Your class is in Room 6."], ["Ben", "Thank you. Is it upstairs?"], ["Ann", "Yes, it is."]], "script-c": [["Ann", "Good morning. What is the problem?"], ["Ben", "I have a bad cough."], ["Ann", "Take this medicine two times a day."], ["Ben", "Thank you, doctor."]], "script-d": [["Ann", "Number one. K, H, A, N. Khan."], ["Ann", "Number two. G, R, A, C, E. Grace."], ["Ann", "Number three. My phone number is oh seven seven double oh, nine double oh, four six one."]], "script-e": [["Ben", "Hi Sara. Where are you going?"], ["Ann", "I'm going to the market."], ["Ben", "What do you want to buy?"], ["Ann", "Fish and rice."]], "script-f": [["Ben", "I live in a small flat. I live with my brother. He is a bus driver. On Sunday we cook together. I like Sunday."]], "script-g": [["Ann", "Hello, Sam. This is Anna. The picnic is on Sunday. We meet at the park at twelve o'clock. Bring some food and a drink. See you there!"]], "script-h": [["Ben", "Excuse me. Do you have milk?"], ["Ann", "Yes, we do. It's by the door."], ["Ben", "How much is it?"], ["Ann", "It's one pound twenty."], ["Ben", "Thank you."]], "script-i": [["Ben", "Excuse me. Is this the bus to the station?"], ["Ann", "No, it isn't. This is the bus to the market."], ["Ben", "Which bus goes to the station?"], ["Ann", "The number twelve."], ["Ben", "Thank you."]], "script-j": [["Ann", "Hello, this is Hackney College. Your English class is in Room eight. It starts at ten o'clock. Please bring a pen. Thank you."]]}, HANG="";
(function(){
const $=id=>document.getElementById(id);
function wireOrder(){$('stage').querySelectorAll('.ord').forEach(d=>{if(d.dataset.on)return;d.dataset.on=1;const ws=d.dataset.words.split('|'),ans=d.dataset.ans;let sel=[];const sh=ws.slice().sort(()=>Math.random()-.5);
 d.innerHTML='<div class="ol"></div><div class="ow"></div><div class="oa"><button class="chk" type="button">Check</button><button class="rs" type="button">Again</button></div><div class="ores"></div>';
 const ol=d.querySelector('.ol'),ow=d.querySelector('.ow'),or=d.querySelector('.ores');
 sh.forEach(w=>{const b=document.createElement('button');b.type='button';b.textContent=w;b.onclick=()=>{sel.push(w);b.disabled=true;ol.textContent=sel.join(' ');or.textContent='';};ow.appendChild(b);});
 d.querySelector('.chk').onclick=()=>{const g=sel.join(' ').toLowerCase().replace(/[?.]/g,'');const t=ans.toLowerCase().replace(/[?.]/g,'');if(sel.length<ws.length){or.className='ores no';or.textContent='Use all the words.';}else if(g===t){or.className='ores ok';or.textContent='✓ '+ans;}else{or.className='ores no';or.textContent='Not yet.';}};
 d.querySelector('.rs').onclick=()=>{sel=[];ol.textContent='';or.textContent='';ow.querySelectorAll('button').forEach(b=>b.disabled=false);};});}
let i=0,left=0,tick=null,si=0;
const TAGS={learn:'Learn',prac:'Practise',talk:'Speak'};
function qrs(root){root.querySelectorAll('.qr[data-url]').forEach(q=>{if(q.dataset.done)return;q.dataset.done=1;const sz=+q.dataset.size||160;try{new QRCode(q,{text:q.dataset.url,width:sz,height:sz,correctLevel:QRCode.CorrectLevel.M});}catch(e){q.innerHTML='<a href="'+q.dataset.url+'">'+q.dataset.url+'</a>';}});}
function dots(){$('dots').innerHTML='';S.forEach((s,k)=>{const b=document.createElement('button');b.type='button';b.className='dot'+(k<i?' done':'')+(k===i?' now':'');b.setAttribute('aria-label','Step '+(k+1)+': '+s.title);b.onclick=()=>go(k);$('dots').appendChild(b);});}
function stop(){clearInterval(tick);tick=null;$('clock').classList.remove('run');}
function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0');}
function showStep(){const st=S[i].steps;if(!st)return;const s=st[si];$('stepq').innerHTML='<small>'+(si+1)+' of '+st.length+'</small>'+s.q;$('stepa').innerHTML=s.a;$('stepa').classList.add('off');$('show').textContent='Show answer';$('snext').disabled=si>=st.length-1;}
function go(k){stopAudio();i=Math.max(0,Math.min(S.length-1,k));const s=S[i];si=0;stop();
 $('h-tag').className='tag '+s.tag;$('h-tag').textContent=TAGS[s.tag];$('h-title').textContent=s.title;
 $('stage').innerHTML=s.html+(s.look?'<div class="lk">'+s.look+'</div>':'')+(s.note?'<div class="tnote" id="tn" hidden><b>Teacher note:</b> '+s.note+'</div>':'');
 $('stage').querySelectorAll('.rv').forEach(e=>e.classList.add('off'));
 $('show').hidden=!s.reveal;$('show').textContent='Show answer';$('note').hidden=!s.note;$('snext').hidden=!s.steps;
 const t=s.timer||0;$('clock').hidden=!t;$('tbtn').hidden=!t;left=t;$('clock').textContent=fmt(t);$('clock').className='clock';$('tbtn').textContent='Start timer';
 $('back').disabled=i===0;$('next').disabled=i===S.length-1;dots();qrs($('stage'));wire();showStep();$('stage').parentElement.scrollTop=0;}
function reveal(){if(S[i].steps){const a=$('stepa');const off=a.classList.toggle('off');$('show').textContent=off?'Show answer':'Hide answer';return;}
 const r=[...$('stage').querySelectorAll('.rv.off')];if(!r.length){$('stage').querySelectorAll('.rv').forEach(e=>e.classList.add('off'));$('show').textContent='Show answer';return;}
 r[0].classList.remove('off');r[0].scrollIntoView({block:'nearest',behavior:'smooth'});$('show').textContent=r.length<=1?'Hide answers':'Show next answer';}
function timer(){if(tick){stop();$('tbtn').textContent='Start timer';return;}if(left<=0)left=S[i].timer;$('clock').classList.add('run');$('clock').classList.remove('end');$('tbtn').textContent='Pause';
 tick=setInterval(()=>{left--;$('clock').textContent=fmt(left);if(left<=0){stop();$('clock').classList.add('end');$('tbtn').textContent='Start timer';$('timeup').hidden=false;setTimeout(()=>$('timeup').hidden=true,2500);}},1000);}
/* audio: MP3 from the lesson audio page, or the browser's own voice if the MP3 isn't there */
let cur=null;
function voices(){const v=speechSynthesis.getVoices().filter(x=>/^en(-|_)GB/i.test(x.lang));const all=v.length?v:speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));
 const f=all.find(x=>/female|libby|sonia|maisie|hazel|kate|serena|susan/i.test(x.name))||all[0];const m=all.find(x=>/male|ryan|thomas|george|daniel|oliver/i.test(x.name)&&x!==f)||all[1]||all[0];return{Ann:f,Ben:m};}
function stopAudio(){if(cur){cur.stop();cur=null;}}
function makePlayer(id,btn,stat){let a=new Audio('https://atinwix.github.io/esol/e1/speaking-listening/audio/short-conversations/'+id+'.mp3');let useTTS=false,round=0,paused=false,active=false,gapT=null,q=[],qi=0;
 a.addEventListener('error',()=>{useTTS=true;});
 function setBtn(){btn.textContent=active?(paused?'▶ Carry on':'⏸ Pause'):'▶ Play twice';}
 function done(){if(round===1){round=2;stat.textContent='Again in 3 seconds…';gapT=setTimeout(()=>{stat.textContent='Second time';playOnce();},3000);}else{active=false;round=0;stat.textContent='Finished';setBtn();}}
 function speakNext(){if(qi>=q.length){done();return;}const [w,t]=q[qi++];const u=new SpeechSynthesisUtterance(t);const v=voices();if(v[w])u.voice=v[w];u.lang='en-GB';u.rate=0.9;u.onend=()=>{if(active&&!paused)setTimeout(speakNext,350);};speechSynthesis.speak(u);}
 function playOnce(){if(useTTS||!a.src){q=AUDL[id];qi=0;speechSynthesis.cancel();speakNext();}else{a.currentTime=0;a.play().catch(()=>{useTTS=true;playOnce();});}}
 a.addEventListener('ended',()=>{if(active)done();});
 return{toggle(){if(!active){stopAudio();cur=this;active=true;paused=false;round=1;stat.textContent='First time';playOnce();setBtn();return;}
   if(paused){paused=false;if(useTTS){speechSynthesis.resume();if(!speechSynthesis.speaking)speakNext();}else a.play();}else{paused=true;clearTimeout(gapT);if(useTTS)speechSynthesis.pause();else a.pause();}setBtn();},
  stop(){active=false;paused=false;round=0;clearTimeout(gapT);a.pause();speechSynthesis.cancel();stat.textContent='';setBtn();}};}
function wire(){wireOrder();$('stage').querySelectorAll('[data-play]').forEach(b=>{const p=makePlayer(b.dataset.play,b,b.parentElement.querySelector('.pstat'));b.onclick=()=>p.toggle();});
 const r=$('hgRead');if(r){let on=false;r.onclick=()=>{if(on){speechSynthesis.cancel();on=false;r.textContent='▶ Read the text aloud';return;}stopAudio();on=true;r.textContent='⏹ Stop';let n=0;const say=()=>{const u=new SpeechSynthesisUtterance(HANG);const v=voices();if(v.Ann)u.voice=v.Ann;u.lang='en-GB';u.rate=0.85;u.onend=()=>{n++;if(on&&n<2)setTimeout(say,2500);else{on=false;r.textContent='▶ Read the text aloud';}};speechSynthesis.speak(u);};speechSynthesis.cancel();say();};
  $('hgCopy').onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(HANG):Promise.reject()).then(()=>$('hgMsg').textContent='Copied ✓',()=>$('hgMsg').textContent='Copy not allowed here – use the read-aloud page');};}}
$('next').onclick=()=>go(i+1);$('back').onclick=()=>go(i-1);$('show').onclick=reveal;$('tbtn').onclick=timer;
$('snext').onclick=()=>{const st=S[i].steps;if(st&&si<st.length-1){si++;showStep();}};
$('note').onclick=()=>{const n=$('tn');if(n)n.hidden=!n.hidden;};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,button'))return;if(e.key===' '||e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(i+1);}else if(e.key==='ArrowLeft'||e.key==='PageUp')go(i-1);else if(e.key==='t'||e.key==='T'){if(S[i].timer)timer();}else if(e.key==='a'||e.key==='A'){if(S[i].reveal)reveal();}});
if('speechSynthesis' in window)speechSynthesis.getVoices();
qrs(document.querySelector('header'));go(0);})();
