<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E3 Reading – First Conditional – Choose the Form and if or unless – Phone Practice</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Verdana,Arial,sans-serif;font-size:18px;line-height:1.4;color:#1d2433;background:#f4f6fa}
main{max-width:34em;margin:0 auto;padding:14px 14px 90px}h1{font-size:1.25em;margin:.2em 0 .4em}h2{font-size:1.1em;margin:.8em 0 .3em}
.big{display:block;width:100%;font:inherit;font-weight:700;font-size:1.15em;padding:.85em;margin:.6em 0;border-radius:14px;border:3px solid #1f5fbf;background:#fff;color:#1f5fbf;text-align:left}
.big .sub{display:block;font-weight:400;font-size:.75em;color:#5b6474}
button{font:inherit;cursor:pointer}ol{padding:0;margin:0;list-style:none;counter-reset:n}
li{counter-increment:n;background:#fff;border-radius:12px;padding:10px 12px;margin:10px 0;border:2px solid #dde3ec}
li .q::before{content:counter(n) ". ";font-weight:700}
.os{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.o{padding:.45em .9em;border-radius:10px;border:2px solid #9ab;background:#fff;color:#1d2433;font-size:.95em}
.o.ok{background:#dafbe1;border-color:#1a7f37;font-weight:700}.o.no{background:#ffebe9;border-color:#cf222e}
li.done .o{pointer-events:none}
.full{display:block;margin-top:8px;font-weight:700;color:#1a7f37}.full[hidden]{display:none}
.gap{display:inline-block;min-width:3.5em;border-bottom:2px solid #1f5fbf}
.rule{background:#fff3b0;border-radius:10px;padding:8px 12px;margin:.4em 0}
.score{position:sticky;top:0;background:#1f5fbf;color:#fff;border-radius:0 0 12px 12px;padding:6px 12px;font-weight:700;z-index:2}
.end{background:#fff;border:3px solid #1a7f37;border-radius:14px;padding:12px;margin-top:14px}.end[hidden]{display:none}
.small{font-size:.8em;color:#5b6474}.sw{background:none;border:0;color:#1f5fbf;text-decoration:underline;padding:0;font-size:.85em}
.logo{position:fixed;left:6px;bottom:6px;color:#1F3A5F;background:rgba(255,255,255,.92);border:1px solid #C9D3DF;border-radius:8px;padding:3px 5px;line-height:0}.logo svg{width:64px;height:50px}
[hidden]{display:none!important}
</style></head><body><main>
<section id="pick"><h1>First conditional – practise on your phone</h1><p>Which task?</p>
<button class="big" data-t="E" type="button">Task E · Choose the right form<span class="sub">8 sentences · if + present simple, will + verb</span></button>
<button class="big" data-t="F" type="button">Task F · if or unless?<span class="sub">8 sentences · unless = if … not</span></button>
<p class="small">Work on your own. Read the whole sentence, think, then tap your answer. Then check with the class on the board.</p></section>
<section id="task" hidden><div class="score" id="sc"></div><h1 id="th"></h1><div id="rule"></div><ol id="list"></ol>
<div class="end" id="end" hidden><p id="endmsg" style="font-weight:700;margin:.2em 0"></p><p class="small">Say each sentence quietly to yourself. Then wait for the class check on the board.</p>
<button class="big" id="again" type="button">Try again</button><button class="big" id="other" type="button"></button></div>
<p><button class="sw" id="back" type="button">← Choose a task</button></p></section>
<div class="logo" aria-label="Made by Atin"><svg viewBox="104 28 172 134" width="64" height="50" role="img" aria-hidden="true">
<text x="139" y="112" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="72" fill="currentColor">A</text>
<rect x="177" y="83" width="24" height="6" rx="1" fill="currentColor"/>
<path d="M216 66 L216 106 A25 7 0 0 0 266 106 L266 66" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
<ellipse cx="241" cy="66" rx="25" ry="7" fill="none" stroke="currentColor" stroke-width="3"/>
<line x1="216" y1="80" x2="266" y2="80" stroke="currentColor" stroke-width="1.5"/>
<line x1="216" y1="94" x2="266" y2="94" stroke="currentColor" stroke-width="1.5"/>
<ellipse cx="241" cy="47" rx="23" ry="5" fill="none" stroke="currentColor" stroke-width="3"/>
<line x1="114" y1="128" x2="266" y2="128" stroke="currentColor" stroke-width="1"/>
<text x="190" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="2" fill="currentColor">made by Atin</text>
</svg></div>
<script>
(function(){var D=document,DATA={"E": [{"s": "If the bus ___ late tomorrow, I will walk to college.", "o": ["will be", "is", "was"], "c": 1, "fill": "is"}, {"s": "If you hurry now, you ___ the 8:15 train.", "o": ["will catch", "catch", "caught"], "c": 0, "fill": "will catch"}, {"s": "If it rains tomorrow, we ___ a taxi.", "o": ["take", "will take", "took"], "c": 1, "fill": "will take"}, {"s": "If she studies hard, she ___ the exam next week.", "o": ["will pass", "passes", "passed"], "c": 0, "fill": "will pass"}, {"s": "If you do not save money, you ___ a car next year.", "o": ["will not buy", "do not buy", "would not buy"], "c": 0, "fill": "will not buy"}, {"s": "If it ___ sunny on Saturday, we will go to Victoria Park.", "o": ["is", "was", "will be"], "c": 0, "fill": "is"}, {"s": "If the library opens in the evening next term, I ___ there after work.", "o": ["will study", "study", "studied"], "c": 0, "fill": "will study"}, {"s": "They ___ the match on Saturday if it snows.", "o": ["cancel", "cancelled", "will cancel"], "c": 2, "fill": "will cancel"}], "F": [{"s": "___ you hurry, you will miss the bus.", "o": ["if", "unless"], "c": 1, "fill": "Unless"}, {"s": "You will not pass the test ___ you study.", "o": ["if", "unless"], "c": 1, "fill": "unless"}, {"s": "I will phone you ___ I have time.", "o": ["if", "unless"], "c": 0, "fill": "if"}, {"s": "I will not call you ___ it is an emergency.", "o": ["if", "unless"], "c": 1, "fill": "unless"}, {"s": "Tell me ___ you need help.", "o": ["if", "unless"], "c": 0, "fill": "if"}, {"s": "___ it is cold tomorrow, I will wear my coat.", "o": ["if", "unless"], "c": 0, "fill": "If"}, {"s": "We will not go to the park ___ the weather is good.", "o": ["if", "unless"], "c": 1, "fill": "unless"}, {"s": "The shop will close early ___ there are no customers.", "o": ["if", "unless"], "c": 0, "fill": "if"}]};
var T={E:{h:"Task E · Choose the right form",r:"<p class=rule>Tap the right form. Remember: <b>if + present simple, will + verb</b>.</p>"},F:{h:"Task F · if or unless?",r:"<p class=rule>Tap <b>if</b> or <b>unless</b>. Remember: <b>unless = if … not</b>.</p>"}};
var cur=null,got=0,done=0;
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function sent(s,g){return esc(s).replace("___",g)}
function upd(){var n=DATA[cur].length;D.getElementById("sc").textContent="Score: "+got+" / "+n+"  ·  done "+done+" / "+n;
 if(done===n){var e=D.getElementById("end");e.hidden=false;D.getElementById("endmsg").textContent="You got "+got+" out of "+n+" right first time."+(got===n?" Excellent!":"");
 var o=cur==="E"?"F":"E";D.getElementById("other").textContent="Now do "+T[o].h;}}
function start(k){cur=k;got=0;done=0;D.getElementById("pick").hidden=true;D.getElementById("task").hidden=false;D.getElementById("end").hidden=true;
 D.getElementById("th").textContent=T[k].h;D.getElementById("rule").innerHTML=T[k].r;var L=D.getElementById("list");L.innerHTML="";
 DATA[k].forEach(function(it){var li=D.createElement("li");var q=D.createElement("span");q.className="q";q.innerHTML=sent(it.s,'<span class="gap"></span>');li.appendChild(q);
  var os=D.createElement("div");os.className="os";var full=D.createElement("span");full.className="full";full.hidden=true;
  var s=it.fill,txt=it.s.indexOf("___")===0?it.s.replace("___",s):it.s.replace("___",s);full.textContent="✓ "+txt;
  it.o.forEach(function(op,i){var b=D.createElement("button");b.type="button";b.className="o";b.textContent=op;
   b.onclick=function(){if(li.classList.contains("done"))return;
    if(i===it.c){b.classList.add("ok");if(!li.dataset.miss)got++;li.classList.add("done");done++;full.hidden=false;q.querySelector(".gap").textContent=it.fill;upd();}
    else{b.classList.add("no");b.disabled=true;li.dataset.miss="1";}};os.appendChild(b)});
  li.appendChild(os);li.appendChild(full);L.appendChild(li)});
 upd();window.scrollTo(0,0)}
[].forEach.call(D.querySelectorAll("#pick .big"),function(b){b.onclick=function(){start(b.dataset.t)}});
D.getElementById("again").onclick=function(){start(cur)};
D.getElementById("other").onclick=function(){start(cur==="E"?"F":"E")};
D.getElementById("back").onclick=function(){D.getElementById("task").hidden=true;D.getElementById("pick").hidden=false;window.scrollTo(0,0)};
var h=(location.hash||"").replace("#","").toUpperCase();if(h==="E"||h==="F")start(h);
})();
</script></body></html>
