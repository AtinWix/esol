<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coming Up – Lessons</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--fg:#1f2a24;--muted:#5c6b62;--line:#dde3dc;--accent:#1d6b54;--soft:#e3f0ea;--warn:#8a5300;--warnbg:#fbefdc}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1c2420;--fg:#e7ede9;--muted:#9fb0a6;--line:#2d3833;--accent:#5cc3a0;--soft:#1f3229;--warn:#f0b35a;--warnbg:#3a2c14;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Verdana,Arial,sans-serif}
main{max-width:900px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.6rem}
.sub{margin:2px 0 0;color:var(--muted)}
.sub a{color:var(--accent)}
.atin-logo{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.card.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}
.when{font-size:.85rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
h2{margin:0;font-size:1.15rem}
.row{display:grid;grid-template-columns:6.5em 1fr;gap:2px 10px;font-size:.95rem}
.row b{color:var(--muted);font-weight:600}
.prep{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:6px 10px;font-weight:600;font-size:.92rem}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:.9rem;padding:6px 12px;border-radius:999px;background:var(--soft);color:var(--fg);text-decoration:none;border:1px solid transparent}
.links a:hover,.links a:focus-visible{border-color:var(--accent)}
.empty{color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px}
summary{cursor:pointer;color:var(--muted);font-weight:600}
details .card{margin-top:10px}
</style></head><body><main>
<header><div><h1>Coming up</h1><p class="sub">Atin's next lessons and their materials. <a href="./">Back to the ESOL Library</a></p></div>
<div class="atin-logo" aria-label="Made by Atin">
<svg viewBox="104 28 172 134" width="64" height="50" role="img" aria-hidden="true">
<text x="139" y="112" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="72" fill="currentColor">A</text>
<rect x="177" y="83" width="24" height="6" rx="1" fill="currentColor"/>
<path d="M216 66 L216 106 A25 7 0 0 0 266 106 L266 66" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
<ellipse cx="241" cy="66" rx="25" ry="7" fill="none" stroke="currentColor" stroke-width="3"/>
<line x1="216" y1="80" x2="266" y2="80" stroke="currentColor" stroke-width="1.5"/>
<line x1="216" y1="94" x2="266" y2="94" stroke="currentColor" stroke-width="1.5"/>
<ellipse cx="241" cy="47" rx="23" ry="5" fill="none" stroke="currentColor" stroke-width="3"/>
<line x1="114" y1="128" x2="266" y2="128" stroke="currentColor" stroke-width="1"/>
<text x="190" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="2" fill="currentColor">made by Atin</text>
</svg>
</div>
<style>
.atin-logo{position:fixed;left:calc(6px + env(safe-area-inset-left,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:2147483000;pointer-events:none;color:#1F3A5F;background:rgba(255,255,255,.92);border:1px solid #C9D3DF;border-radius:8px;padding:3px 5px;line-height:0}
.atin-logo svg{display:block}
@media print{.atin-logo{position:fixed;left:auto;right:6mm;bottom:5mm;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></header>
<div id="up"><div class="empty">Loading…</div></div>
<details id="pastBox" hidden><summary>Recent lessons</summary><div id="past"></div></details>
</main>
<script>
(function(){
  var fmt=function(d){return new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})};
  var t=new Date(),today=t.getFullYear()+"-"+("0"+(t.getMonth()+1)).slice(-2)+"-"+("0"+t.getDate()).slice(-2);
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function card(x){
    var c=el("article","card"+(x.date===today?" today":""));
    c.appendChild(el("div","when",(x.date===today?"Today · ":"")+fmt(x.date)+" · "+(x.cls||"")));
    c.appendChild(el("h2",null,x.title||"Lessons"));
    var r=el("div","row");
    [["Morning",x.morning],["Afternoon",x.afternoon],["Print",x.print]].forEach(function(p){if(p[1]){r.appendChild(el("b",null,p[0]));r.appendChild(el("span",null,p[1]))}});
    c.appendChild(r);
    if(x.prep)c.appendChild(el("div","prep","Prep: "+x.prep));
    if(!(x.links&&x.links.filter(function(k){return k&&/^https:\/\//.test(k.url||"")}).length)&&x.date>=today)c.appendChild(el("div","prep","Materials not in the library yet"+(x.prep?"":" – ask Claude to file them")));
    if(x.links&&x.links.length){var l=el("div","links");x.links.forEach(function(k){if(!k||!/^https:\/\//.test(k.url||""))return;var a=el("a",null,k.label||"Link");a.href=k.url;l.appendChild(a)});c.appendChild(l)}
    return c}
  fetch("coming-up.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(all){
    all=(all||[]).filter(function(x){return x&&x.date}).sort(function(a,b){return a.date<b.date?-1:1});
    var up=document.getElementById("up");up.textContent="";
    var next=all.filter(function(x){return x.date>=today}),past=all.filter(function(x){return x.date<today}).reverse().slice(0,6);
    if(!next.length)up.appendChild(el("div","empty","Nothing built yet for the coming days."));
    next.forEach(function(x){up.appendChild(card(x))});
    up.style.display="flex";up.style.flexDirection="column";up.style.gap="12px";
    if(past.length){document.getElementById("pastBox").hidden=false;past.forEach(function(x){document.getElementById("past").appendChild(card(x))})}
  }).catch(function(){document.getElementById("up").innerHTML='<div class="empty">Could not load the lessons. Reload the page.</div>'});
})();
</script></body></html>
