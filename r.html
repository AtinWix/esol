<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report a problem – ESOL Library</title></head>
<body style="font:18px Verdana,Arial,sans-serif;padding:24px"><p id="m">Opening the problem report form…</p><script>
(function(){var f=(new URLSearchParams(location.search).get('f')||'').replace(/[^a-zA-Z0-9\/_.-]/g,'').slice(0,200);
var u='https://github.com/AtinWix/esol/issues/new?title='+encodeURIComponent('Problem: '+f)+'&labels=teacher-feedback&body='+encodeURIComponent('**File:** '+f+'\n\n**What is wrong?** (page, question number, what you saw)\n\n\n**What should it say?** (if you know)\n\n\nThanks! Atin and Claude will check this and fix it.');
document.getElementById('m').innerHTML='Teachers only: <a href="'+u+'">open the problem report form</a>.';location.replace(u);})();
</script></body></html>
