<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report a problem – ESOL Library</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#16243a;--muted:#55627a;--line:#d3dae5;--accent:#1f3a5f}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 Verdana,Arial,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;margin:0}
.file{font-family:Consolas,monospace;font-size:15px;background:var(--bg);padding:6px 10px;border-radius:6px;word-break:break-all}
a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:8px;text-align:center}
.small{font-size:15px;color:var(--muted)}
button{font:inherit;font-size:15px;padding:6px 12px;border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer}
</style></head>
<body><main>
<h1>Report a problem</h1>
<p>Found a mistake in one of Atin's materials? Send him a quick email.</p>
<p class="small">File:</p><p class="file" id="f">–</p>
<a class="btn" id="mail" href="mailto:Atin.wickham@ncclondon.ac.uk">Email Atin about this file</a>
<p class="small">If no email opens, write to <b id="addr">Atin.wickham@ncclondon.ac.uk</b> <button id="copy" type="button">Copy address</button> and include the file name above.</p>
</main>
<script>
(function(){
var f=(new URLSearchParams(location.search).get('f')||'').replace(/[^a-zA-Z0-9\/_. ()–-]/g,'').slice(0,200);
document.getElementById('f').textContent=f||'(not given)';
var sub='ESOL Library problem: '+(f||'a file');
var body='File: '+(f||'')+'\n\nWhat is wrong? (page, question number, what you saw)\n\n\nWhat should it say? (if you know)\n\n\nThanks!';
var u='mailto:Atin.wickham@ncclondon.ac.uk?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body);
document.getElementById('mail').href=u;
document.getElementById('copy').onclick=function(){var a=document.getElementById('addr').textContent;
  (navigator.clipboard?navigator.clipboard.writeText(a):Promise.reject()).then(function(){document.getElementById('copy').textContent='Copied'}).catch(function(){var r=document.createRange();r.selectNodeContents(document.getElementById('addr'));var s=getSelection();s.removeAllRanges();s.addRange(r)})};
})();
</script></body></html>
