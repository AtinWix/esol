<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESOL All Levels – Classroom Tool – Vote Card (A–D, 1–4, True/False, Yes/No)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;800&display=swap">
<style>
/* One screen on a phone. Mode tabs on top, big answer tiles below; tapping a tile fills the whole screen
   with that answer so the teacher can see it from the front. Open in a mode with ?mode=abcd|num|tf|yn. */
:root{
  color-scheme:dark;
  --ground:#15171d;--panel:#232733;--ink:#f4f5f7;--muted:#9aa0ad;
  --a:#e23d3d;--b:#2f6fe0;--c:#f2b707;--d:#1fa35b;--n:#f4f5f7;--n-ink:#15171d;
  --yes:#1fa35b;--no:#e23d3d;--true:#2f6fe0;--false:#f2b707;
  --font:"Lexend","Verdana","Arial",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden}
[hidden]{display:none!important}
.picker{height:100%;display:flex;flex-direction:column;gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px))}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--panel);border-radius:14px;padding:5px}
.tab{border:0;border-radius:10px;background:transparent;color:var(--muted);font:500 clamp(.8rem,3.6vw,1.05rem) var(--font);padding:.7em .2em;cursor:pointer;line-height:1.1}
.tab[aria-selected="true"]{background:var(--ink);color:var(--n-ink);font-weight:800}
.tab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.prompt{margin:0;font-size:1.05rem;font-weight:500;color:var(--muted);text-align:center}
.tiles{flex:1;display:grid;gap:12px;min-height:0}
.tiles.four{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}
.tiles.two{grid-template-columns:1fr;grid-template-rows:repeat(2,1fr)}
@media (min-aspect-ratio:1/1){
  .tiles.four{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr}
  .tiles.two{grid-template-columns:repeat(2,1fr);grid-template-rows:1fr}
}
.tile{border:0;border-radius:18px;font-family:var(--font);font-weight:800;line-height:1;cursor:pointer;color:#fff;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;transition:transform .08s ease}
.tile:active{transform:scale(.96)}
.tile:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.four .tile{font-size:clamp(2.6rem,12vmin,7rem)}
.two .tile{font-size:clamp(2.2rem,11vmin,6rem)}
.tile .sym{font-size:.8em}
.dark{color:#1d1600!important}
.bg-A{background:var(--a)}.bg-B{background:var(--b)}.bg-C{background:var(--c)}.bg-D{background:var(--d)}
.bg-num{background:var(--n)}.bg-num,.bg-num .sym{color:var(--n-ink)}
.bg-yes{background:var(--yes)}.bg-no{background:var(--no)}.bg-true{background:var(--true)}.bg-false{background:var(--false)}
.show{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;z-index:5;color:#fff}
.show .big{font-weight:800;line-height:1;text-align:center}
.show .big.short{font-size:88vmin}
.show .big.word{font-size:min(30vw,40vh)}
.show .sym{font-size:min(36vw,30vh);line-height:1;font-weight:800}
.hint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:.95rem;font-weight:500;opacity:.6}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
.atin-logo{flex:none;align-self:center;color:#1F3A5F;background:rgba(255,255,255,.92);border:1px solid #C9D3DF;border-radius:8px;padding:3px 5px;line-height:0;pointer-events:none}
.atin-logo svg{display:block;width:50px;height:39px}
</style>
</head>
<body>
<main class="picker" id="picker">
  <div class="tabs" role="tablist" aria-label="Answer type">
    <button class="tab" role="tab" data-mode="abcd">A–D</button>
    <button class="tab" role="tab" data-mode="num">1–4</button>
    <button class="tab" role="tab" data-mode="tf">True / False</button>
    <button class="tab" role="tab" data-mode="yn">Yes / No</button>
  </div>
  <p class="prompt">Tap your answer</p>
  <div class="tiles" id="tiles" role="group" aria-label="Answers"></div>
  <div class="atin-logo" aria-label="Made by Atin">
    <svg viewBox="104 28 172 134" role="img" aria-hidden="true">
      <text x="139" y="112" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="72" fill="currentColor">A</text>
      <rect x="177" y="83" width="24" height="6" rx="1" fill="currentColor"/>
      <path d="M216 66 L216 106 A25 7 0 0 0 266 106 L266 66" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="241" cy="66" rx="25" ry="7" fill="none" stroke="currentColor" stroke-width="3"/>
      <line x1="216" y1="80" x2="266" y2="80" stroke="currentColor" stroke-width="1.5"/>
      <line x1="216" y1="94" x2="266" y2="94" stroke="currentColor" stroke-width="1.5"/>
      <ellipse cx="241" cy="47" rx="23" ry="5" fill="none" stroke="currentColor" stroke-width="3"/>
      <line x1="114" y1="128" x2="266" y2="128" stroke="currentColor" stroke-width="1"/>
      <text x="190" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="2" fill="currentColor">made by Atin</text>
    </svg>
  </div>
</main>

<div class="show" id="show" hidden role="button" tabindex="0" aria-label="Tap to change answer">
  <span class="sym" id="sym" hidden></span>
  <span class="big" id="big"></span>
  <span class="hint">Tap to change</span>
</div>

<script>
(function(){
  var MODES={
    abcd:[{v:'A',c:'bg-A'},{v:'B',c:'bg-B'},{v:'C',c:'bg-C dark'},{v:'D',c:'bg-D'}],
    num:[{v:'1',c:'bg-num'},{v:'2',c:'bg-num'},{v:'3',c:'bg-num'},{v:'4',c:'bg-num'}],
    tf:[{v:'TRUE',s:'✓',c:'bg-true'},{v:'FALSE',s:'✗',c:'bg-false dark'}],
    yn:[{v:'YES',s:'✓',c:'bg-yes'},{v:'NO',s:'✗',c:'bg-no'}]
  };
  var KEYS={abcd:'ABCD',num:'1234',tf:'TF',yn:'YN'};
  var picker=document.getElementById('picker'),tiles=document.getElementById('tiles'),
      show=document.getElementById('show'),big=document.getElementById('big'),sym=document.getElementById('sym'),
      tabs=[].slice.call(document.querySelectorAll('.tab')),mode='abcd',lock=null;

  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
  function keepAwake(){try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request('screen').then(function(l){lock=l;}).catch(function(){});}catch(e){}}
  function goFull(){try{var el=document.documentElement,fn=el.requestFullscreen||el.webkitRequestFullscreen;
    if(fn&&!document.fullscreenElement){var p=fn.call(el);if(p&&p.catch)p.catch(function(){});}}catch(e){}}

  function setMode(m){
    if(!MODES[m])m='abcd';mode=m;store('voteMode',m);
    tabs.forEach(function(t){t.setAttribute('aria-selected',t.dataset.mode===m?'true':'false');});
    var list=MODES[m];tiles.className='tiles '+(list.length===4?'four':'two');tiles.innerHTML='';
    list.forEach(function(o){
      var b=document.createElement('button');b.type='button';b.className='tile '+o.c;
      b.innerHTML=(o.s?'<span class="sym">'+o.s+'</span>':'')+'<span>'+o.v+'</span>';
      b.addEventListener('click',function(){display(o);});tiles.appendChild(b);
    });
  }
  function display(o){
    big.textContent=o.v;big.className='big '+(o.v.length>1?'word':'short');
    sym.hidden=!o.s;sym.textContent=o.s||'';
    show.className='show '+o.c;show.hidden=false;picker.hidden=true;goFull();keepAwake();show.focus();
  }
  function back(){show.hidden=true;picker.hidden=false;}

  tabs.forEach(function(t){t.addEventListener('click',function(){setMode(t.dataset.mode);});});
  show.addEventListener('click',back);
  show.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '||e.key==='Escape'){e.preventDefault();back();}});
  document.addEventListener('keydown',function(e){
    if(!show.hidden)return;var k=e.key.toUpperCase(),i=KEYS[mode].indexOf(k);
    if(k.length===1&&i>=0)display(MODES[mode][i]);
  });
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!show.hidden)keepAwake();});

  var q=(location.search.match(/[?&]mode=([a-z]+)/i)||[])[1];
  setMode(q?q.toLowerCase():(store('voteMode')||'abcd'));
})();
</script>
</body>
</html>
