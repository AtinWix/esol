<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>E3 Reading – Text Types – Matching Activity</title>
<style>
/* Layout: one heading, a status line, then three equal-height card columns (picture / text type / meaning) that line up into rows as matches are made. */
:root{
  --bg:#eef2f9; --card:#ffffff; --ink:#14213a; --muted:#51607a; --line:#bcc8dc;
  --sel:#1d4ed8; --sel-bg:#dbe6ff; --good:#15803d; --good-bg:#dcfce7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --tile:#ffffff; --tin:#cfd6e0;
  --font: Arial, Verdana, Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1727; --card:#1b2538; --ink:#e9eef8; --muted:#a6b3c9; --line:#3b4862;
  --sel:#8fb2ff; --sel-bg:#1f3160; --good:#4ade80; --good-bg:#123a22; --bad:#f87171; --bad-bg:#4a1a1c; --tin:#8792a3;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1727; --card:#1b2538; --ink:#e9eef8; --muted:#a6b3c9; --line:#3b4862;
  --sel:#8fb2ff; --sel-bg:#1f3160; --good:#4ade80; --good-bg:#123a22; --bad:#f87171; --bad-bg:#4a1a1c; --tin:#8792a3;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.35}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 32px;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.6rem;margin:0;text-wrap:balance}
.how{margin:0;color:var(--muted);font-size:1.05rem}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.status{font-weight:bold;font-size:1.05rem;font-variant-numeric:tabular-nums}
.msg{min-height:1.5em;font-weight:bold;font-size:1.1rem;margin:0}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
.cols{display:grid;grid-template-columns:96px minmax(0,1fr) minmax(0,1.5fr);gap:8px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0;text-align:center}
.c{height:92px;width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;
  background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 8px;
  font:inherit;cursor:pointer;overflow-wrap:anywhere}
.c.word{font-weight:bold;font-size:1.15rem}
.c.meaning{font-size:1rem}
.c.pic{background:var(--tile);padding:4px}
.c.pic svg{height:76px;width:76px;display:block}
.c:hover:not(:disabled){border-color:var(--sel)}
.c:focus-visible,.btn:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.c.sel{border-color:var(--sel);border-width:4px;background:var(--sel-bg)}
.c.pic.sel{background:var(--tile)}
.c.done{border-color:var(--good);background:var(--good-bg);cursor:default}
.c.pic.done{background:var(--tile);border-width:4px}
.c.wrong{border-color:var(--bad);border-width:4px;background:var(--bad-bg);animation:shake .35s}
.c.pic.wrong{background:var(--tile)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.c.wrong{animation:none}}
.btn{font:inherit;font-weight:bold;font-size:1.05rem;padding:10px 18px;border-radius:10px;border:2px solid var(--sel);
  background:var(--sel);color:var(--card);cursor:pointer}
.btn.quiet{background:transparent;color:var(--sel)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
@media (max-width:480px){
  .cols{grid-template-columns:72px minmax(0,1fr) minmax(0,1.4fr);gap:6px}
  .c{height:100px;padding:4px 5px}
  .c.word{font-size:.95rem} .c.meaning{font-size:.85rem}
  .c.pic svg{height:58px;width:58px}
  h1{font-size:1.35rem}
}
.made{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;color:var(--muted);font-weight:bold;font-size:1rem}
.made svg{width:40px;height:48px;display:block}
.tin-metal{fill:var(--tin);stroke:var(--ink);stroke-width:3}
.tin-label{fill:var(--sel);stroke:var(--ink);stroke-width:3}
.tin-rib{stroke:var(--ink);stroke-width:2;fill:none;opacity:.55}
</style>
<div class="wrap">
  <h1>Text types: match the three</h1>
  <p class="how">Choose one picture, one text type and one meaning. All three must match.</p>
  <div class="bar">
    <div class="status" id="status"></div>
    <div class="actions">
      <button class="btn" id="next" type="button" hidden>Next round</button>
      <button class="btn quiet" id="restart" type="button">Start again</button>
    </div>
  </div>
  <p class="msg" id="msg" aria-live="polite"></p>
  <div class="cols">
    <div class="col" id="col-pic"><h2>Picture</h2></div>
    <div class="col" id="col-word"><h2>Text type</h2></div>
    <div class="col" id="col-meaning"><h2>Meaning</h2></div>
  </div>
</div>

cap=\"round\"/>\n<rect x=\"100\" y=\"142\" width=\"20\" height=\"20\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"3\"/>\n<text x=\"68\" y=\"158\" font-size=\"14\" fill=\"#222\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"bold\">Yes<\/text><text x=\"126\" y=\"158\" font-size=\"14\" fill=\"#222\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"bold\">No<\/text><\/svg>"}, {"id": "story", "word": "story", "meaning": "it tells you what happened to someone", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\" role=\"img\" aria-label=\"picture\"><path d=\"M100 50 Q60 25 15 40 V160 Q60 145 100 170 Z\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n<path d=\"M100 50 Q140 25 185 40 V160 Q140 145 100 170 Z\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n<line x1=\"32\" y1=\"70\" x2=\"84\" y2=\"70\" stroke=\"#888\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"32\" y1=\"88\" x2=\"84\" y2=\"88\" stroke=\"#888\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"32\" y1=\"106\" x2=\"84\" y2=\"106\" stroke=\"#888\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"32\" y1=\"124\" x2=\"84\" y2=\"124\" stroke=\"#888\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"116\" y1=\"70\" x2=\"168\" y2=\"70\" stroke=\"#888\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"116\" y1=\"88\" x2=\"168\" y2=\"88\" stroke=\"#888\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"116\" y1=\"106\" x2=\"168\" y2=\"106\" stroke=\"#888\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"116\" y1=\"124\" x2=\"168\" y2=\"124\" stroke=\"#888\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n<path d=\"M140 28 V70 L150 60 L160 70 V30\" fill=\"#dc2626\" stroke=\"#222\" stroke-width=\"3\" stroke-linejoin=\"round\"/><\/svg>"}];
const PER_ROUND = 5, KINDS = ['pic','word','meaning'];
const $ = id => document.getElementById(id);
let order, round, sel, doneCount, tries, totalDone, busy;

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function rounds(){ return Math.ceil(ITEMS.length/PER_ROUND); }

function newGame(){ order = shuffle(ITEMS); round = 0; tries = 0; totalDone = 0; startRound(); }

function startRound(){
  sel = {}; doneCount = 0; busy = false;
  const set = order.slice(round*PER_ROUND, (round+1)*PER_ROUND);
  KINDS.forEach(kind => {
    const col = $('col-'+kind);
    col.querySelectorAll('.c').forEach(n => n.remove());
    let mixed = shuffle(set);
    if (kind !== 'pic' && set.length > 1) { let n = 0; while (mixed.every((it,i) => it === set[i]) && n++ < 10) mixed = shuffle(set); }
    mixed.forEach(it => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'c ' + kind; b.dataset.id = it.id; b.dataset.kind = kind;
      if (kind === 'pic') b.innerHTML = it.svg; else b.textContent = it[kind];
      if (kind === 'pic') b.setAttribute('aria-label', 'picture');
      b.addEventListener('click', () => pick(b));
      col.appendChild(b);
    });
  });
  $('next').hidden = true;
  say('', '');
  status();
}

function status(){
  $('status').textContent = 'Round ' + (round+1) + ' of ' + rounds() + '   Matched: ' + totalDone + ' of ' + ITEMS.length + '   Tries: ' + tries;
}
function say(text, cls){ const m = $('msg'); m.textContent = text; m.className = 'msg ' + cls; }

function pick(b){
  if (busy || b.disabled) return;
  const kind = b.dataset.kind;
  if (sel[kind] === b) { b.classList.remove('sel'); delete sel[kind]; return; }
  if (sel[kind]) sel[kind].classList.remove('sel');
  sel[kind] = b; b.classList.add('sel');
  if (KINDS.every(k => sel[k])) check();
}

function check(){
  tries++;
  const chosen = KINDS.map(k => sel[k]);
  const ok = chosen.every(b => b.dataset.id === chosen[0].dataset.id);
  sel = {};
  if (ok) {
    chosen.forEach(b => {
      b.classList.remove('sel'); b.classList.add('done'); b.disabled = true;
      const col = b.parentNode, dones = col.querySelectorAll('.c.done');
      // move solved cards to the top so finished rows line up across the three columns
      const others = Array.from(dones).filter(n => n !== b);
      const after = others.length ? others[others.length-1] : col.querySelector('h2');
      after.after(b);
    });
    doneCount++; totalDone++;
    if (doneCount === PER_ROUND || totalDone === ITEMS.length) {
      if (round + 1 < rounds()) { say('Well done! Go to the next round.', 'good'); $('next').hidden = false; $('next').focus(); }
      else say('Finished! You matched all ' + ITEMS.length + ' in ' + tries + ' tries.', 'good');
    } else say('Correct!', 'good');
  } else {
    busy = true;
    chosen.forEach(b => { b.classList.remove('sel'); b.classList.add('wrong'); });
    say('Not a match. Try again.', 'bad');
    setTimeout(() => { chosen.forEach(b => b.classList.remove('wrong')); busy = false; }, 800);
  }
  status();
}

$('next').addEventListener('click', () => { round++; startRound(); });
$('restart').addEventListener('click', newGame);
newGame();
</script>
