<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESOL All Levels – Classroom Wheel and Picker – Projector Tool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1F3A5F;--line:#C9D3DF;--bg:#F7F9FC;--go:#1B7F4B;--no:#B3261E;--hi:#FFD54A}
html,body{height:100%}
body{font-family:Verdana,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);
 display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:#fff;border-bottom:2px solid var(--line)}
h1{font-size:clamp(14px,1.6vw,20px);margin-right:auto}
h1 span{font-weight:400;opacity:.65}
button{font:inherit;cursor:pointer;border:2px solid var(--line);background:#fff;color:var(--ink);
 border-radius:8px;padding:6px 12px;font-size:clamp(12px,1.2vw,16px)}
button:hover{border-color:var(--ink)}
button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.big{font-weight:700;background:var(--ink);color:#fff;border-color:var(--ink);padding:10px 22px}
.big:hover{background:#15406e}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 14px 0;min-height:0}
.pane{display:none;width:100%;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.pane.on{display:flex}
/* WHEEL */
.wheelwrap{display:flex;gap:min(4vw,40px);align-items:center;justify-content:center;width:100%;height:100%;flex-wrap:wrap}
#wheel{width:min(42vh,42vw,380px);height:min(42vh,42vw,380px);flex:0 0 auto}
#wheel g{transition:transform 4s cubic-bezier(.17,.67,.12,1)}
.ptr{font-size:22px;color:var(--no)}
.result{flex:1 1 320px;min-width:260px;background:#fff;border:3px solid var(--ink);border-radius:14px;
 padding:16px 20px;font-size:clamp(18px,2.6vw,38px);font-weight:700;line-height:1.3;min-height:1.4em;text-align:center}
.result.empty{font-weight:400;opacity:.5;font-size:clamp(14px,1.6vw,22px)}
/* ORDER */
.orderwrap{display:flex;gap:14px;width:100%;height:100%;padding-bottom:4px}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
.col h2{font-size:clamp(12px,1.3vw,17px);margin-bottom:5px}
.bank,.slots{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px;
 background:#fff;border:2px dashed var(--line);border-radius:10px}
.slots{border-style:solid}
.card{text-align:left;line-height:1.35;padding:8px 10px;font-size:clamp(11px,1.15vw,15px);white-space:normal}
.slots .card{counter-increment:s;display:flex;gap:9px;align-items:flex-start}
.slots .card::before{content:counter(s);font-weight:700;background:var(--ink);color:#fff;
 border-radius:5px;min-width:1.5em;text-align:center;flex:0 0 auto}
.slots{counter-reset:s}
.card.ok{border-color:var(--go);background:#EAF6EE}
.card.bad{border-color:var(--no);background:#FDECEA}
.card.ex{border-color:var(--ink);background:#FFF8DC}
/* PICKER */
.pickface{font-size:clamp(28px,9vw,120px);font-weight:700;text-align:center;line-height:1.1;
 background:#fff;border:4px solid var(--ink);border-radius:18px;padding:20px 32px;min-width:min(70vw,620px)}
.left{font-size:clamp(11px,1.1vw,14px);opacity:.7}
/* custom list */
dialog{border:3px solid var(--ink);border-radius:12px;padding:16px;max-width:min(92vw,560px);font:inherit;color:var(--ink)}
dialog h2{font-size:17px;margin-bottom:8px}
textarea{width:100%;height:34vh;font:14px/1.45 Verdana,Arial,sans-serif;padding:8px;
 border:2px solid var(--line);border-radius:8px;resize:vertical}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
#qrbox{position:fixed;right:10px;bottom:10px;background:#fff;border:2px solid var(--line);
 border-radius:10px;padding:8px;text-align:center;font-size:11px;z-index:5;display:none}
#qrbox.on{display:block}
#qrbox svg{width:118px;height:118px;display:block;margin-bottom:3px}
.tnote{background:#fff;border-top:2px solid var(--line);padding:3px 10px 4px;font-size:9px;line-height:1.35}
.tnote b{font-size:9px}
@media (max-width:760px){
 h1{font-size:13px;width:100%}
 .orderwrap{flex-direction:column}
 .wheelwrap{flex-direction:column;gap:12px}
 #wheel{width:min(54vw,250px);height:min(54vw,250px)}
 .result{font-size:20px;flex:0 0 auto;width:100%}
}
</style></head><body>

<header>

    <button class="big" id="pick">Pick one</button>
    <button id="preset2">Put them all back</button>
   </div>
   <div class="left" id="pleft"></div>

 </section>
</main>

ock. I pick up my children from their after-school club.", "Then I go home and cook dinner. I prepare vegetables and meat and cook on the stove.", "My family sits down and we eat together and talk about our day. Then I clean the kitchen and wash the dishes.", "Sometimes I read a story before they go to bed.", "Then I go to bed at eleven o'clock."]}}};
const $ = s => document.querySelector(s);
let cur = null, items = [], live = [], order = [], shown = 0, mode = 'wheel';
const COL = ['#1F3A5F','#2E6DA4','#1B7F4B','#4A7C2F','#8A6D1F','#A9471B','#7A2E6B','#3E4A8A'];

function setMode(m){
  mode = m;
  ['wheel','order','pick'].forEach(k => $('#p-'+k).classList.toggle('on', k===m));
}
function loadPreset(key){
  cur = key;
  const p = P[key];
  document.querySelectorAll('.pre').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p===key)));
  $('#sub').textContent = '– ' + p.label + ' (' + p.level + ')';
  $('#tn').textContent = p.note;
  if (p.sets){
    const names = Object.keys(p.sets);
    let i = (P[key]._i || 0) % names.length;
    P[key]._i = i;
    $('#slotsh').textContent = names[i];
    items = p.sets[names[i]].slice();
    setMode('order'); buildOrder(key==='leila');
  } else {
    items = p.items.slice();
    setMode(p.mode); live = items.slice(); drawWheel(); resetFace();
  }
}
/* ---------- WHEEL ---------- */
function drawWheel(){
  const g = $('#wg'); g.innerHTML = ''; g.style.transform = 'rotate(0deg)';
  const n = live.length;
  if (!n){ g.innerHTML = '<text y="4" text-anchor="middle" font-size="11" fill="#1F3A5F">All used</text>';
           $('#wleft').textContent = ''; return; }
  const step = 360/n;
  live.forEach((t,i) => {
    const a0 = i*step-90, a1 = (i+1)*step-90, r = 100;
    const rad = d => d*Math.PI/180;
    const x0 = r*Math.cos(rad(a0)), y0 = r*Math.sin(rad(a0));
    const x1 = r*Math.cos(rad(a1)), y1 = r*Math.sin(rad(a1));
    const pa = document.createElementNS('http://www.w3.org/2000/svg','path');
    pa.setAttribute('d', `M0 0 L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${step>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`);
    pa.setAttribute('fill', COL[i%COL.length]); pa.setAttribute('stroke','#fff'); pa.setAttribute('stroke-width','1.2');
    g.appendChild(pa);
    const tx = document.createElementNS('http://www.w3.org/2000/svg','text');
    const mid = a0+step/2;
    tx.setAttribute('transform', `rotate(${mid.toFixed(2)}) translate(58,0) rotate(${mid>90&&mid<270?180:0})`);
    tx.setAttribute('text-anchor','middle'); tx.setAttribute('dominant-baseline','middle');
    tx.setAttribute('font-size', n>8?'6':'7.5'); tx.setAttribute('fill','#fff');
    const w = t.split(' '); let s = t;
    if (s.length > 22) s = w.slice(0,3).join(' ') + '…';
    tx.textContent = s;
    g.appendChild(tx);
  });
  $('#wleft').textContent = live.length + ' of ' + items.length + ' left on the wheel';
}
let spinning = false, turns = 0;
$('#spin').onclick = () => {
  if (spinning || !live.length) return;
  spinning = true;
  const n = live.length, step = 360/n, k = Math.floor(Math.random()*n);
  turns += 4 + Math.floor(Math.random()*3);
  const target = turns*360 - (k*step + step/2);
  $('#wg').style.transform = 'rotate(' + target.toFixed(2) + 'deg)';
  setTimeout(() => {
    const pickd = live[k];
    const r = $('#wres'); r.textContent = pickd; r.classList.remove('empty');
    if ($('#wdrop').getAttribute('aria-pressed') === 'true'){
      live.splice(k,1);
      setTimeout(() => { $('#wg').style.transition='none'; drawWheel();
        requestAnimationFrame(()=>{ $('#wg').style.transition=''; turns=0; }); }, 900);
    }
    spinning = false;
  }, 4050);
};
$('#wdrop').onclick = e => { const b = e.currentTarget;
  b.setAttribute('aria-pressed', b.getAttribute('aria-pressed')==='true' ? 'false' : 'true'); };
$('#wreset').onclick = () => { live = items.slice(); $('#wg').style.transition='none'; turns=0;
  drawWheel(); requestAnimationFrame(()=>{ $('#wg').style.transition=''; });
  const r=$('#wres'); r.textContent='Press Spin'; r.classList.add('empty'); };
/* ---------- ORDER ---------- */
function buildOrder(example){
  order = []; shown = example ? 1 : 0;
  const bank = $('#bank'), slots = $('#slots');
  bank.innerHTML = ''; slots.innerHTML = '';
  let pool = items.map((t,i) => ({t, i}));
  for (let i = pool.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  if (example){
    const first = pool.findIndex(o => o.i === 0);
    const ex = pool.splice(first,1)[0];
    order.push(ex); addSlot(ex, true);
  }
  pool.forEach(o => {
    const b = document.createElement('button');
    b.className = 'card'; b.textContent = o.t; b.dataset.i = o.i;
    b.onclick = () => { b.remove(); order.push(o); addSlot(o,false); countLeft(); };
    bank.appendChild(b);
  });
  countLeft();
}
function addSlot(o, isEx){
  const s = document.createElement('button');
  s.className = 'card' + (isEx ? ' ex' : ''); s.textContent = o.t; s.dataset.i = o.i;
  if (!isEx) s.onclick = () => {
    const at = order.indexOf(o); if (at > -1) order.splice(at,1);
    s.remove();
    const b = document.createElement('button');
    b.className='card'; b.textContent=o.t; b.dataset.i=o.i;
    b.onclick = () => { b.remove(); order.push(o); addSlot(o,false); countLeft(); };
    $('#bank').appendChild(b); countLeft();
  };
  $('#slots').appendChild(s);
}
function countLeft(){ $('#oleft').textContent = $('#bank').children.length + ' left'; }
$('#check').onclick = () => {
  [...$('#slots').children].forEach((el,idx) => {
    el.classList.remove('ok','bad');
    if (el.classList.contains('ex')) return;
    el.classList.add(Number(el.dataset.i) === idx ? 'ok' : 'bad');
  });
};
$('#showone').onclick = () => {
  if (shown >= items.length) return;
  const slots = $('#slots');
  const want = items[shown];
  let el = [...slots.children][shown];
  if (!el || el.textContent !== want){
    const fromBank = [...$('#bank').children].find(b => b.textContent === want);
    const fromSlot = [...slots.children].find(b => b.textContent === want);
    const src = fromBank || fromSlot; if (!src) return;
    src.remove();
    const s = document.createElement('button');
    s.className = 'card ok'; s.textContent = want; s.dataset.i = shown;
    slots.insertBefore(s, slots.children[shown] || null);
    order = [...slots.children].map(c => ({t: c.textContent, i: Number(c.dataset.i)}));
  } else el.classList.add('ok');
  shown++; countLeft();
};
$('#oreset').onclick = () => {
  const p = P[cur];
  if (p && p.sets){ const names = Object.keys(p.sets); p._i = ((p._i||0)+1) % names.length;
    $('#slotsh').textContent = names[p._i]; items = p.sets[names[p._i]].slice(); }
  buildOrder(cur === 'leila');
};
/* ---------- PICKER ---------- */
function resetFace(){ $('#face').textContent = 'Ready'; $('#pleft').textContent = live.length + ' left'; }
$('#pick').onclick = () => {
  if (!live.length){ $('#face').textContent = 'All used'; return; }
  const k = Math.floor(Math.random()*live.length);
  $('#face').textContent = live[k];
  live.splice(k,1); $('#pleft').textContent = live.length + ' left';
};
$('#preset2').onclick = () => { live = items.slice(); resetFace(); };
/* ---------- custom list ---------- */
$('#mine').onclick = () => { $('#ta').value = items.join('\n'); $('#dlg').showModal(); };
$('#close').onclick = () => $('#dlg').close();
function takeList(){ return $('#ta').value.split('\n').map(s => s.trim()).filter(Boolean); }
function useCustom(m){
  const l = takeList();
  if (l.length < 2){ alert('Please type at least two lines.'); return; }
  items = l; live = l.slice(); cur = null;
  document.querySelectorAll('.pre').forEach(b => b.setAttribute('aria-pressed','false'));
  $('#sub').textContent = '– my own list';
  $('#tn').textContent = 'Learners look at the BOARD.';
  $('#dlg').close(); setMode(m);
  if (m === 'wheel') drawWheel();
  if (m === 'order'){ $('#slotsh').textContent = 'In order'; buildOrder(false); }
  if (m === 'pick') resetFace();
}
$('#useWheel').onclick = () => useCustom('wheel');
$('#useOrder').onclick = () => useCustom('order');
$('#usePick').onclick  = () => useCustom('pick');
/* ---------- wiring ---------- */
document.querySelectorAll('.pre').forEach(b => b.onclick = () => loadPreset(b.dataset.p));
$('#qrbtn').onclick = e => { const b = e.currentTarget;
  const on = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', String(on)); $('#qrbox').classList.toggle('on', on); };
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && mode === 'wheel'){ e.preventDefault(); $('#spin').click(); }
  if (e.code === 'Space' && mode === 'pick'){ e.preventDefault(); $('#pick').click(); }
});
loadPreset('days');
</script>
</body></html>
