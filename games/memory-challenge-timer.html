<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Memory Challenge Timer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: one-screen classroom projector page. Big picture left, countdown right, one big button. Committed dark single look so it reads from the back of a room. */
:root{
  --bg:#14203A; --panel:#1F2E52; --line:#31446F; --fg:#FBF7EF; --muted:#B7C0D6;
  --accent:#F28C28; --accent-ink:#1F2A44; --ok:#7DD3A8;
  --font:'Nunito', Verdana, Arial, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--font);
  display:flex; flex-direction:column; gap:12px;
  padding-block:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  box-sizing:border-box;
}
button,select{font-family:inherit}
.top{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.top h1{margin:0; font-size:32px; font-weight:800; letter-spacing:.2px}
.tabs{display:flex; gap:8px}
.tab{
  min-width:56px; height:48px; font-size:26px; font-weight:800; border-radius:12px;
  border:2px solid var(--line); background:var(--panel); color:var(--fg); cursor:pointer;
}
.tab[aria-pressed="true"]{background:var(--fg); color:var(--accent-ink); border-color:var(--fg)}
.opts{display:flex; align-items:center; gap:14px; margin-left:auto; color:var(--muted); font-size:22px; flex-wrap:wrap}
.opts select{
  font-size:22px; font-weight:700; padding:8px 10px; border-radius:10px;
  background:var(--panel); color:var(--fg); border:2px solid var(--line);
}
.opts label{display:flex; align-items:center; gap:8px}
.opts input[type=checkbox]{width:22px; height:22px; accent-color:var(--accent)}
.logo{height:48px; border-radius:10px; background:#FBF7EF; display:block}
.stage{flex:1; min-height:0; display:flex; gap:28px}
.picwrap{flex:1; min-width:0; min-height:0; display:flex; justify-content:center; align-items:center}
.frame{
  position:relative; height:100%; max-width:100%; aspect-ratio:4/3;
  border-radius:20px; overflow:hidden; background:var(--panel); border:2px solid var(--line);
}
.frame>*{position:absolute; inset:0; width:100%; height:100%}
.pic svg{display:block; width:100%; height:100%}
.pic,.cover,.blank{display:none}
.frame[data-state="show"] .pic.on,.frame[data-state="reveal"] .pic.on{display:block}
.frame[data-state="ready"] .cover{display:flex}
.frame[data-state="blank"] .blank{display:flex}
.cover,.blank{flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:24px; box-sizing:border-box}
.cover .k{font-size:clamp(28px,3.4vw,48px); font-weight:700; color:var(--muted)}
.cover .n{font-size:clamp(120px,18vw,300px); font-weight:800; line-height:1}
.cover .q{font-size:clamp(28px,3.4vw,48px); font-weight:700; color:var(--accent)}
.blank{background:var(--accent); color:var(--accent-ink)}
.blank h2{margin:0; font-size:clamp(40px,6vw,88px); font-weight:800; line-height:1.05}
.blank h3{margin:0; font-size:clamp(28px,4vw,56px); font-weight:700}
.blank ul{list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:10px; font-size:clamp(26px,3.4vw,50px); font-weight:700}
.blank li{background:#FBF7EF; border-radius:14px; padding:8px 28px}
.side{width:clamp(220px,24vw,360px); display:flex; flex-direction:column; justify-content:center; gap:16px; flex:none}
.label{font-size:28px; font-weight:700; color:var(--muted)}
.count{font-size:clamp(110px,17vw,240px); font-weight:800; line-height:1; font-variant-numeric:tabular-nums}
.count.small{font-size:clamp(48px,6vw,84px); line-height:1.1}
.track{height:18px; border-radius:999px; background:var(--panel); border:2px solid var(--line); overflow:hidden}
.fill{height:100%; width:100%; background:var(--ok); border-radius:999px}
.low .fill{background:var(--accent)}
.low .count{color:var(--accent)}
.help{font-size:26px; color:var(--muted); line-height:1.3}
.bottom{display:flex; align-items:center; gap:20px; flex-wrap:wrap}
.go{
  height:72px; padding:0 40px; font-size:34px; font-weight:800; border-radius:16px; border:0;
  background:var(--accent); color:var(--accent-ink); cursor:pointer;
}
.go:focus-visible,.tab:focus-visible,select:focus-visible,.minor:focus-visible{outline:4px solid var(--fg); outline-offset:3px}
.minor{
  height:56px; padding:0 22px; font-size:24px; font-weight:700; border-radius:12px;
  border:2px solid var(--line); background:var(--panel); color:var(--fg); cursor:pointer;
}
.keys{margin-left:auto; color:var(--muted); font-size:22px}
@media (max-width:800px){
  .stage{flex-direction:column}
  .side{width:auto; flex-direction:row; align-items:center; justify-content:space-between}
  .count{font-size:84px}
  .picwrap{flex:1}
  .keys{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .low .count{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.55}}
}
</style>

      <div class="blank">
        <h2>Picture hidden!</h2>
        <h3>What can you remember?</h3>
        <ul><li>There is a …</li><li>There are two …</li><li>He / She is …ing</li><li>It is next to …</li></ul>
      </div>
    </div>
  </div>
  <div class="side" id="side">
    <div class="label" id="label">seconds to look</div>
    <div class="count" id="count">30</div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="help" id="help">Look carefully. Remember everything.</div>
  </div>
</div>

<div class="bottom">
  <button class="go" id="go" type="button">Start</button>
  <button class="minor" id="blankNow" type="button">Hide now</button>
  <div class="keys">Space = next step · 1–4 = picture · B = hide</div>
</div>

<script>
(function(){
  var pics = Array.prototype.slice.call(document.querySelectorAll('.pic'));
  var frame = document.getElementById('frame');
  var tabs = document.getElementById('tabs');
  var goBtn = document.getElementById('go');
  var blankBtn = document.getElementById('blankNow');
  var side = document.getElementById('side');
  var countEl = document.getElementById('count');
  var labelEl = document.getElementById('label');
  var helpEl = document.getElementById('help');
  var fillEl = document.getElementById('fill');
  var durEl = document.getElementById('dur');
  var sndEl = document.getElementById('snd');
  var coverN = document.getElementById('coverN');
  var idx = 0, state = 'ready', dur = 30, t0 = 0, timer = null, ctx = null;

  pics.forEach(function(_, i){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'tab'; b.textContent = String(i + 1);
    b.setAttribute('aria-label', 'Picture ' + (i + 1));
    b.addEventListener('click', function(){ pick(i); });
    tabs.appendChild(b);
  });

  function beep(){
    if(!sndEl.checked) return;
    try{
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.value = 0.15;
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.35);
    }catch(e){}
  }

  function stopTimer(){ if(timer){ clearInterval(timer); timer = null; } }

  function render(){
    frame.setAttribute('data-state', state);
    pics.forEach(function(p, i){ p.classList.toggle('on', i === idx); });
    coverN.textContent = String(idx + 1);
    Array.prototype.forEach.call(tabs.children, function(b, i){
      b.setAttribute('aria-pressed', i === idx ? 'true' : 'false');
    });
    side.classList.remove('low');
    countEl.classList.remove('small');
    blankBtn.hidden = state !== 'show';
    if(state === 'ready'){
      labelEl.textContent = 'seconds to look';
      countEl.textContent = String(dur);
      fillEl.style.width = '100%';
      helpEl.textContent = 'Press Start. The picture appears and the clock runs.';
      goBtn.textContent = 'Start';
    } else if(state === 'show'){
      labelEl.textContent = 'seconds left';
      helpEl.textContent = 'Look carefully. Remember everything.';
      goBtn.textContent = 'Hide picture';
    } else if(state === 'blank'){
      labelEl.textContent = '';
      countEl.textContent = 'Time’s up!';
      countEl.classList.add('small');
      fillEl.style.width = '0%';
      helpEl.textContent = 'Tell your partner everything you remember.';
      goBtn.textContent = 'Show picture again';
    } else {
      labelEl.textContent = '';
      countEl.textContent = 'Check!';
      countEl.classList.add('small');
      fillEl.style.width = '100%';
      helpEl.textContent = 'What did you forget? What did you get right?';
      goBtn.textContent = 'Next picture';
    }
  }

  function tick(){
    var left = Math.max(0, dur - (Date.now() - t0) / 1000);
    countEl.textContent = String(Math.ceil(left));
    fillEl.style.width = (left / dur * 100) + '%';
    side.classList.toggle('low', left <= 5);
    if(left <= 0){ hide(true); }
  }

  function start(){
    stopTimer();
    state = 'show'; t0 = Date.now();
    render(); tick();
    timer = setInterval(tick, 100);
  }
  function hide(withBeep){
    stopTimer();
    state = 'blank';
    if(withBeep) beep();
    render();
  }
  function reveal(){ stopTimer(); state = 'reveal'; render(); }
  function pick(i){ stopTimer(); idx = i; state = 'ready'; render(); }
  function next(){ pick((idx + 1) % pics.length); }

  function advance(){
    if(state === 'ready') start();
    else if(state === 'show') hide(false);
    else if(state === 'blank') reveal();
    else next();
  }

  goBtn.addEventListener('click', advance);
  blankBtn.addEventListener('click', function(){ hide(false); });
  durEl.addEventListener('change', function(){
    dur = parseInt(durEl.value, 10) || 30;
    durEl.blur();
    if(state === 'ready') render();
  });
  document.getElementById('fs').addEventListener('click', function(){
    try{
      var d = document;
      if(d.fullscreenElement){ d.exitFullscreen(); }
      else { d.documentElement.requestFullscreen().catch(function(){}); }
    }catch(e){}
  });
  document.addEventListener('keydown', function(e){
    var tag = e.target && e.target.tagName;
    if(tag === 'SELECT' || tag === 'INPUT') return;
    if(e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight'){
      if(tag === 'BUTTON' && e.key !== 'ArrowRight') return;
      e.preventDefault(); advance();
    } else if(e.key === 'ArrowLeft'){ e.preventDefault(); pick((idx + pics.length - 1) % pics.length); }
    else if(e.key >= '1' && e.key <= String(pics.length)){ pick(parseInt(e.key, 10) - 1); }
    else if(e.key === 'b' || e.key === 'B'){ if(state === 'show') hide(false); }
  });

  render();
})();
</script>

</body></html>
